<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="icon" href="favicon.ico" sizes="any">
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="manifest" href="site.webmanifest">
<title>Dashboard — MedLink KE</title>
<script src="theme.js"></script>
<link rel="stylesheet" href="styles.css">
<style>
.dashboard-page { max-width:1320px; margin:0 auto; }
.dashboard-grid { display:grid; grid-template-columns:minmax(0,1fr) 310px; align-items:start; gap:22px; }
.main-column { min-width:0; }
.dashboard-grid .rail { min-width:0; }
.dashboard-section { margin-top:26px; }
.dashboard-empty { padding:20px; text-align:center; color:var(--text-3); font-size:13px; }
.profile-mini-top { display:flex;align-items:center;gap:12px;margin-bottom:14px; }
.profile-mini-name { font-weight:750;font-size:14px; }
.profile-mini-meta { margin-top:3px;color:var(--text-3);font-size:11.5px;line-height:1.45; }
.profile-mini-foot { display:flex;align-items:center;justify-content:space-between;gap:10px;padding-top:12px;border-top:1px solid var(--border); }
.profile-mini-points { color:var(--text-2);font-size:12px; }
.streak-card { background:linear-gradient(145deg,var(--surface),color-mix(in srgb,var(--orange-soft) 42%,var(--surface))); }
.streak-card-top { display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:12px; }
.streak-card-label { display:flex;align-items:center;gap:10px; }
.streak-card-icon { width:40px;height:40px;display:grid;place-items:center;border-radius:13px;background:var(--orange-soft);font-size:21px; }
.streak-card-count { font-size:15px;font-weight:800; }
.streak-card-sub { margin-top:3px;color:var(--text-3);font-size:11px; }
.streak-time { display:flex;justify-content:space-between;gap:10px;padding:9px 11px;border:1px solid var(--border);border-radius:11px;background:var(--surface);font-size:11.5px; }
.streak-time strong { color:var(--text); }
.upcoming-row { display:flex;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid var(--border); }
.upcoming-row:last-child { border-bottom:0;padding-bottom:0; }
.upcoming-date { flex:0 0 42px;text-align:center;border-radius:10px;background:var(--accent-soft);color:var(--accent-on-soft);padding:6px 4px;font-size:10px;font-weight:800; }
.upcoming-title { min-width:0;font-size:12px;font-weight:700;line-height:1.4; }
.upcoming-unit { margin-top:3px;color:var(--text-3);font-size:10.5px; }
.community-mini { display:flex;align-items:center;gap:10px;min-width:0;padding:5px 0; }
.community-mini-mark { width:32px;height:32px;flex:0 0 32px;display:grid;place-items:center;border-radius:11px;background:var(--accent-soft);color:var(--accent);font-size:12px;font-weight:800; }
.community-mini-name { overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:12px;font-weight:650; }
.activity-mini { display:flex;align-items:flex-start;gap:9px;padding:9px 0;border-bottom:1px solid var(--border); }
.activity-mini:last-child { border-bottom:0; }
.activity-dot { width:7px;height:7px;flex:0 0 7px;margin-top:5px;border-radius:50%;background:var(--accent); }
.activity-copy { min-width:0;font-size:11.5px;line-height:1.45; }
.activity-copy small { display:block;margin-top:3px;color:var(--text-3);font-size:10.5px; }
@media (max-width:1050px) {
  .dashboard-grid { grid-template-columns:minmax(0,1fr) 280px;gap:16px; }
}
@media (max-width:850px) {
  .dashboard-grid { grid-template-columns:1fr; }
  .dashboard-grid .rail { position:static;display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px; }
  .dashboard-grid .rail > * { margin:0!important; }
}
@media (max-width:560px) {
  .dashboard-grid .rail { grid-template-columns:1fr; }
  .hero-text { padding:22px!important; }
}
</style>
</head>
<body>



<main id="page" hidden>
<div class="dashboard-page">
<div class="dashboard-grid">
  <div class="main-column">
    <div class="hero-carousel" id="hero">
      <div class="hero-dots" id="heroDots"></div>
    </div>

    <div class="section-heading" style="margin-top:28px;">
      <h2>Your study units</h2>
      <a href="study.html" class="btn btn-ghost btn-sm">Library ›</a>
    </div>
    <div class="grid grid-fill-230" style="margin-bottom:32px;" id="resGrid"></div>

    <div class="section-heading">
      <h2>Latest discussions</h2>
      <a href="communities.html" class="btn btn-ghost btn-sm">Communities ›</a>
    </div>
    <div id="composer" style="margin-bottom:12px;"></div>
    <div id="feedList" class="feed-list"></div>
  </div>

  <aside class="rail">
    <div id="streakHost" class="streak-banner-wrap" style="margin: 0 0 20px 0;"></div>
    <div id="upcomingSection"></div>
    <div class="rail-card" id="meCard"></div>
    <div class="rail-card">
      <div class="rail-head"><h3>Your communities</h3><a href="communities.html">See all</a></div>
      <div class="rail-list" id="communitiesMini"></div>
    </div>
    <div class="rail-card">
      <div class="rail-head"><h3>Recent activity</h3></div>
      <div class="rail-list" id="activity"></div>
    </div>
  </aside>
</div>
</div>
</main>

<script src="config.js"></script>
<script src="data.js"></script>
<script src="app.js"></script>
<script>
MedLink.run({ page: "dashboard" }, async ({ api, me }) => {
  const hour = new Date().getHours();
  const hello = hour < 12 ? "Good morning" : hour < 17 ? "Good afternoon" : "Good evening";
  const first = (me.full_name || "student").split(" ")[0];

  // Personalized home carousel
  const slides = [
    {
      kicker: new Date().toLocaleDateString(undefined, { weekday: "long", day: "numeric", month: "long" }),
      title: `${hello}, ${first}`,
      text: [courseName(me.course_id), me.year, uniFull(me)].filter(Boolean).join(" · "),
      photo: MedLink.siteImageUrl("dashboard-banner"),
      actions: [
        el("a", { class: "btn btn-white", href: "study.html" }, ["Open library"]),
        el("a", { class: "btn btn-ghost-white", href: "exams.html" }, ["Practice questions"]),
      ],
    },
    {
      kicker: "Share what you know",
      title: "Help your class learn together.",
      text: "Upload summaries, slides or past papers for your units so classmates can find them in the library.",
      photo: MedLink.siteImageUrl("hero-main"),
      actions: [el("a", { class: "btn btn-lime", href: "study.html?upload=1", "data-track": "dash_upload" }, ["↑ Upload notes"])],
    },
    {
      kicker: "Exam bank",
      title: "Practise with exam-style questions.",
      text: "Work through questions by subject and keep track of your best scores.",
      photo: MedLink.siteImageUrl("feature-exams"),
      actions: [el("a", { class: "btn btn-white", href: "exams.html", "data-track": "dash_practice" }, ["Start practising"])],
    },
  ];
  const hero = qs("#hero"), dots = qs("#heroDots");
  let current = 0, timer = null;
  slides.forEach((slide, index) => {
    const photo = el("div", { class: "hero-photo", "aria-hidden": "true" });
    if (slide.photo) photo.style.backgroundImage = MedLink.cssUrl(slide.photo);
    hero.appendChild(el("div", { class: "hero-slide" + (index === 0 ? " on" : "") }, [
      el("div", { class: "hero-text" }, [
        el("div", { class: "kicker" }, [slide.kicker]),
        el("h2", {}, [slide.title]),
        el("p", {}, [slide.text]),
        el("div", { class: "hero-actions" }, slide.actions),
      ]),
      photo,
    ]));
    dots.appendChild(el("button", {
      type: "button",
      class: index === 0 ? "on" : null,
      "aria-label": "Show dashboard slide " + (index + 1),
      "aria-pressed": String(index === 0),
      onclick: () => { show(index); restart(); },
    }));
  });
  function show(index) {
    current = (index + slides.length) % slides.length;
    hero.querySelectorAll(".hero-slide").forEach((node, i) => node.classList.toggle("on", i === current));
    dots.querySelectorAll("button").forEach((node, i) => {
      node.classList.toggle("on", i === current);
      node.setAttribute("aria-pressed", String(i === current));
    });
  }
  function restart() {
    clearInterval(timer);
    if (!document.hidden && !window.matchMedia("(prefers-reduced-motion: reduce)").matches) {
      timer = setInterval(() => show(current + 1), 8000);
    }
  }
  hero.addEventListener("mouseenter", () => clearInterval(timer));
  hero.addEventListener("focusin", () => clearInterval(timer));
  hero.addEventListener("mouseleave", restart);
  hero.addEventListener("focusout", restart);
  document.addEventListener("visibilitychange", restart);
  restart();

  // Track visible time and consecutive active days; hidden tabs don't add study time.
  const STORAGE_STREAK = "medlink_streak_" + me.id;
  const STORAGE_TIME = "medlink_time_" + me.id;
  const dateKey = date => [date.getFullYear(), String(date.getMonth() + 1).padStart(2, "0"), String(date.getDate()).padStart(2, "0")].join("-");
  const shiftDate = (key, amount) => {
    const parts = key.split("-").map(Number);
    const date = new Date(parts[0], parts[1] - 1, parts[2] + amount, 12);
    return dateKey(date);
  };
  let todayKey = dateKey(new Date());
  let timeData = {};
  let streakData = { history: [] };
  try { timeData = JSON.parse(localStorage.getItem(STORAGE_TIME) || "{}"); } catch (e) {}
  try { streakData = JSON.parse(localStorage.getItem(STORAGE_STREAK) || '{"history":[]}'); } catch (e) {}
  if (!streakData || !Array.isArray(streakData.history)) streakData = { history: [] };
  if (!Number.isFinite(Number(timeData[todayKey]))) timeData[todayKey] = 0;

  function streakCount() {
    const active = new Set(streakData.history);
    let day = active.has(todayKey) ? todayKey : shiftDate(todayKey, -1);
    let total = 0;
    while (active.has(day) && total < 3660) { total++; day = shiftDate(day, -1); }
    return total;
  }
  function recordActiveDay() {
    if ((timeData[todayKey] || 0) < 60 || streakData.history.includes(todayKey)) return;
    streakData.history.push(todayKey);
    streakData.history = Array.from(new Set(streakData.history)).sort().slice(-3660);
    try { localStorage.setItem(STORAGE_STREAK, JSON.stringify(streakData)); } catch (e) {}
  }
  function formatDuration(seconds) {
    const hours = Math.floor(seconds / 3600);
    const minutes = Math.floor((seconds % 3600) / 60);
    if (hours) return hours + " hr " + minutes + " min";
    if (minutes) return minutes + " min";
    return seconds + " sec";
  }
  function updateStreakBanner() {
    const activeSeconds = Number(timeData[todayKey] || 0);
    qs("#streakHost").replaceChildren(el("div", { class: "rail-card streak-card" }, [
      el("div", { class: "streak-card-top" }, [
        el("div", { class: "streak-card-label" }, [
          el("span", { class: "streak-card-icon", "aria-hidden": "true" }, ["🔥"]),
          el("div", {}, [
            el("div", { class: "streak-card-count" }, [streakCount() + " day streak"]),
            el("div", { class: "streak-card-sub" }, [activeSeconds >= 60 ? "Today's study time is counting." : "Study for a minute to record today."]),
          ]),
        ]),
        el("button", {
          type: "button", class: "icon-btn", title: "Study planner", "aria-label": "Open study planner",
          onclick: () => { location.href = "planner.html"; },
        }, ["▦"]),
      ]),
      el("div", { class: "streak-time" }, [
        el("span", { class: "faint" }, ["Active time today"]),
        el("strong", {}, [formatDuration(activeSeconds)]),
      ]),
    ]));
  }
  updateStreakBanner();

  setInterval(() => {
    const newDay = dateKey(new Date());
    if (newDay !== todayKey) {
      todayKey = newDay;
      if (!Number.isFinite(Number(timeData[todayKey]))) timeData[todayKey] = 0;
    }
    if (document.visibilityState === "visible") {
      timeData[todayKey] = Number(timeData[todayKey] || 0) + 10;
      try { localStorage.setItem(STORAGE_TIME, JSON.stringify(timeData)); } catch (e) {}
      recordActiveDay();
      updateStreakBanner();
    }
  }, 10000);

  // Upcoming items are only shown when the student has saved planner events.
  const upcomingSection = qs("#upcomingSection");
  let savedEvents = [];
  try { savedEvents = JSON.parse(localStorage.getItem("medlink_planner_events_" + me.id) || "[]"); } catch (e) {}
  const upcoming = savedEvents.filter(event => event.date >= todayKey).sort((a, b) => a.date.localeCompare(b.date)).slice(0, 3);
  if (upcoming.length) {
    upcomingSection.appendChild(el("div", { class: "rail-card" }, [
      el("div", { class: "rail-head" }, [el("h3", {}, ["Coming up"]), el("a", { href: "planner.html" }, ["Planner"])]),
      ...upcoming.map(event => {
        const date = new Date(event.date + "T12:00:00");
        return el("a", { class: "upcoming-row", href: "planner.html" }, [
          el("span", { class: "upcoming-date" }, [date.toLocaleDateString(undefined, { day: "numeric", month: "short" })]),
          el("span", {}, [
            el("span", { class: "upcoming-title" }, [event.title]),
            el("span", { class: "upcoming-unit" }, [event.unit || "Study plan"]),
          ]),
        ]);
      }),
    ]));
  }

  // The signed-in student's units, not a stale global catalogue property.
  const units = Array.isArray(me.current_units) ? me.current_units : [];
  const resGrid = qs("#resGrid");
  if (units.length) {
    units.slice(0, 6).forEach((unit, index) => {
      resGrid.appendChild(el("a", { class: "card unit-card", href: "study.html?unit=" + encodeURIComponent(unit) }, [
        el("div", { class: "unit-code" }, ["UNIT " + String(index + 1).padStart(2, "0")]),
        el("div", { class: "unit-name" }, [unit]),
        el("div", { class: "unit-meta" }, [
          el("span", {}, [me.year || courseName(me.course_id)]),
          el("span", {}, ["Notes & papers ›"]),
        ]),
      ]));
    });
  } else {
    resGrid.appendChild(MedLink.emptyState("Choose your current units to see their resources here.",
      el("a", { class: "btn btn-ghost btn-sm", href: "settings.html" }, ["Set my units"])));
  }

  // Personal profile card
  const meCard = qs("#meCard");
  const profileUrl = me.username ? "profile.html?u=" + encodeURIComponent(me.username) : "settings.html";
  meCard.replaceChildren(
    el("div", { class: "profile-mini-top" }, [
      MedLink.avatarNode(me, "", false),
      el("div", { style: "min-width:0" }, [
        el("div", { class: "profile-mini-name" }, [me.full_name]),
        el("div", { class: "profile-mini-meta" }, [MedLink.metaLine(me)]),
      ]),
    ]),
    el("div", { class: "profile-mini-foot" }, [
      el("span", { class: "profile-mini-points" }, ["MedPoints · "]),
      el("strong", { id: "dashPoints" }, ["…"]),
      el("a", { href: profileUrl, class: "btn btn-ghost btn-sm" }, ["View profile"]),
    ]),
  );
  api.medPoints(me.id).then(points => { const out = qs("#dashPoints"); if (out) out.textContent = points.toLocaleString(); })
    .catch(() => { const out = qs("#dashPoints"); if (out) out.textContent = "—"; });

  // Communities joined by this student.
  const communitiesHost = qs("#communitiesMini");
  communitiesHost.appendChild(MedLink.loadingState());
  try {
    const [joinedIds, allCommunities] = await Promise.all([api.myCommunityIds(me.id), api.communities()]);
    const joined = allCommunities.filter(community => joinedIds.has(community.id)).slice(0, 4);
    communitiesHost.replaceChildren(...(joined.length ? joined.map(community => el("a", {
      href: "communities.html?c=" + encodeURIComponent(community.id),
      class: "community-mini",
    }, [
      el("span", { class: "community-mini-mark" }, [community.name.slice(0, 1)]),
      el("span", { class: "community-mini-name" }, [community.name]),
    ])) : [MedLink.emptyState("You haven't joined a community yet.",
      el("a", { href: "communities.html", class: "btn btn-ghost btn-sm" }, ["Explore communities"]))]));
  } catch (err) {
    communitiesHost.replaceChildren(MedLink.emptyState("Communities are unavailable right now."));
  }

  // Recent activity is personal: the student's own notes and discussions.
  const activityHost = qs("#activity");
  activityHost.appendChild(MedLink.loadingState());
  try {
    const [posts, resources] = await Promise.all([
      api.posts({ authorId: me.id, limit: 5 }),
      api.resources({ authorId: me.id, limit: 5 }),
    ]);
    const recent = [
      ...posts.map(post => ({
        date: post.created_at,
        title: "You shared a discussion",
        href: post.community ? "communities.html?c=" + encodeURIComponent(post.community.id) : "communities.html",
      })),
      ...resources.map(resource => ({
        date: resource.created_at,
        title: "You shared " + resource.type.toLowerCase(),
        href: "resource.html?id=" + encodeURIComponent(resource.id),
      })),
    ].sort((a, b) => new Date(b.date) - new Date(a.date)).slice(0, 5);
    activityHost.replaceChildren(...(recent.length ? recent.map(item => el("a", {
      class: "activity-mini", href: item.href,
    }, [
      el("span", { class: "activity-dot", "aria-hidden": "true" }),
      el("span", { class: "activity-copy" }, [
        item.title,
        el("small", {}, [timeAgo(item.date)]),
      ]),
    ])) : [MedLink.emptyState("Your recent posts and uploads will appear here.")]));
  } catch (err) {
    activityHost.replaceChildren(MedLink.emptyState("Recent activity is unavailable right now."));
  }

  // Shared post composer and discussion renderer.
  const composer = qs("#composer");
  const feedList = qs("#feedList");
  composer.appendChild(MedLink.composerNode({
    placeholder: "Ask a medical question or share a clinical insight with your peers…",
    onPosted: post => {
      const empty = qs(".empty-state", feedList);
      if (empty) empty.remove();
      feedList.prepend(MedLink.feedPostNode(post, { liked: new Set() }));
    },
  }));
  feedList.appendChild(MedLink.loadingState());
  try {
    const posts = await api.posts({ limit: 8 });
    await MedLink.renderPosts(feedList, posts, "No discussions yet. Start the conversation.");
  } catch (err) {
    feedList.replaceChildren(MedLink.emptyState("Discussions couldn't load. Please try again later."));
  }
});
</script>
</body>
</html>
