<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="icon" href="favicon.ico" sizes="any">
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="manifest" href="site.webmanifest">
<title>Dashboard — MedLink KE</title>
<link rel="stylesheet" href="admin.css">
</head>
<body>

<header class="topbar">
  <div class="topbar-inner">
    <div class="topbar-left">
      <a href="dashboard.html" class="brand" aria-label="MedLink KE home">
        <span class="brand-badge">⚡</span>
        <span class="brand-name">MedLink KE</span>
      </a>
      <span class="topbar-divider"></span>
      <nav class="topbar-nav" aria-label="Quick links">
        <a href="dashboard.html" class="active">Dashboard</a>
        <a href="study.html">Study Library</a>
        <a href="exams.html">Exam Bank</a>
        <a href="communities.html">Communities</a>
      </nav>
    </div>
    <div class="topbar-right" id="topbarRight"></div>
  </div>
</header>

<main class="page-container">
<div class="dashboard-grid">
  <div class="main-column">
    <div class="hero-carousel" id="hero">
      <div class="hero-dots" id="heroDots"></div>
    </div>

    <div class="section-heading" style="margin-top:28px;">
      <h2>Your study units</h2>
      <a href="study.html" class="btn btn-ghost btn-sm">Library ›</a>
    </div>
    <div class="grid grid-fill-230" style="margin-bottom:32px;" id="resGrid"></div>

    <div class="section-heading">
      <h2>Latest discussions</h2>
      <a href="communities.html" class="btn btn-ghost btn-sm">Communities ›</a>
    </div>
    <div id="composer" style="margin-bottom:12px;"></div>
    <div id="feedList" class="feed-list"></div>
  </div>

  <aside class="rail">
    <div id="streakHost" class="streak-banner-wrap" style="margin: 0 0 20px 0;"></div>
    <div id="upcomingSection"></div>
    <div class="rail-card" id="meCard"></div>
    <div class="rail-card">
      <div class="rail-head"><h3>Your communities</h3><a href="communities.html">See all</a></div>
      <div class="rail-list" id="communitiesMini"></div>
    </div>
    <div class="rail-card">
      <div class="rail-head"><h3>Recent activity</h3></div>
      <div class="rail-list" id="activity"></div>
    </div>
  </aside>
</div>
</main>

<script src="config.js"></script>
<script src="data.js"></script>
<script src="app.js"></script>
<script>
MedLink.run({ page: "dashboard" }, async ({ api, me }) => {
  const hour = new Date().getHours();
  const hello = hour < 12 ? "Good morning" : hour < 17 ? "Good afternoon" : "Good evening";
  const first = me.full_name.split(" ")[0];

  // ---- hero carousel ----
  const slides = [
    { kicker: new Date().toLocaleDateString(undefined, { weekday: "long", day: "numeric", month: "long" }),
      title: `${hello}, ${first}`, text: `${courseName(me.course_id)} · ${me.year} · ${uniFull(me)}`,
      photo: MedLink.siteImageUrl("dashboard-banner"),
      actions: [el("a", { class: "btn btn-white", href: "study.html" }, ["Open library"]), el("a", { class: "btn btn-ghost-white", href: "exams.html" }, ["Practice questions"])] },
    { kicker: "Earn 20 MedPoints", title: "Share your notes, help your class.",
      text: "Upload summaries, slides or past papers for your units — they stay in the library for the year below you.",
      photo: MedLink.siteImageUrl("hero-main"),
      actions: [el("a", { class: "btn btn-lime", href: "study.html?upload=1", "data-track": "dash_upload" }, ["↑ Upload notes"])] },
    { kicker: "Exam bank", title: "Practise with real exam-style MCQs.",
      text: "Questions with explanations, grouped by subject. Your best scores are saved.",
      photo: MedLink.siteImageUrl("feature-exams"),
      actions: [el("a", { class: "btn btn-white", href: "exams.html", "data-track": "dash_practice" }, ["Start practising"])] },
  ];
  const hero = qs("#hero"), dots = qs("#heroDots");
  let current = 0, timer = null;
  slides.forEach((sl, i) => {
    const photo = el("div", { class: "hero-photo" });
    if (sl.photo) photo.style.backgroundImage = MedLink.cssUrl(sl.photo);
    hero.appendChild(el("div", { class: "hero-slide" + (i === 0 ? " on" : "") }, [
      el("div", { class: "hero-text" }, [el("div", { class: "kicker" }, [sl.kicker]), el("h2", {}, [sl.title]), el("p", {}, [sl.text]), el("div", { class: "hero-actions" }, sl.actions)]),
      photo,
    ]));
    dots.appendChild(el("button", { type: "button", class: i === 0 ? "on" : null, "aria-label": "Slide " + (i + 1), onclick: () => { show(i); restart(); } }));
  });
  function show(i) {
    current = (i + slides.length) % slides.length;
    hero.querySelectorAll(".hero-slide").forEach((el, idx) => el.classList.toggle("on", idx === current));
    dots.querySelectorAll("button").forEach((el, idx) => el.classList.toggle("on", idx === current));
  }
  function restart() { clearInterval(timer); timer = setInterval(() => show(current + 1), 7000); }
  hero.addEventListener("mouseenter", () => clearInterval(timer));
  hero.addEventListener("mouseleave", restart);
  restart();

  // ---- streak and time spent tracking logic ----
  const STORAGE_STREAK = "medlink_streak_" + me.id;
  const STORAGE_TIME = "medlink_time_" + me.id;

  let todayKey = new Date().toISOString().split("T")[0];
  let timeData = {};
  try { timeData = JSON.parse(localStorage.getItem(STORAGE_TIME) || "{}"); } catch(e){}
  if (!timeData[todayKey]) timeData[todayKey] = 0;

  // Increment active time every 10 seconds
  setInterval(() => {
    timeData[todayKey] = (timeData[todayKey] || 0) + 10;
    try { localStorage.setItem(STORAGE_TIME, JSON.stringify(timeData)); } catch(e){}
    updateStreakBanner();
  }, 10000);

  function getStreak() {
    try {
      const data = JSON.parse(localStorage.getItem(STORAGE_STREAK) || '{"count":1,"history":[]}');
      const today = new Date().toISOString().split("T")[0];
      if (!data.history.includes(today)) {
        data.history.push(today);
        data.count = data.history.length;
        localStorage.setItem(STORAGE_STREAK, JSON.stringify(data));
      }
      return data;
    } catch(e) {
      return { count: 1, history: [todayKey] };
    }
  }

  function formatDuration(sec) {
    const hrs = Math.floor(sec / 3600);
    const mins = Math.floor((sec % 3600) / 60);
    if (hrs > 0) return `${hrs}hr ${mins}min`;
    if (mins > 0) return `${mins} min`;
    return `${sec} sec`;
  }

  function updateStreakBanner() {
    const streak = getStreak();
    const activeSec = timeData[todayKey] || 0;
    const host = qs("#streakHost");
    if (!host) return;
    host.innerHTML = "";
    host.appendChild(el("div", { class: "rail-card streak-prominent-card", style: "background: linear-gradient(135deg, rgba(255,122,26,0.12) 0%, rgba(255,79,154,0.12) 100%); border: 1px solid rgba(255,122,26,0.3); padding: 16px; border-radius: 12px; position: relative;" }, [
      el("div", { style: "display: flex; align-items: center; justify-content: space-between; margin-bottom: 8px;" }, [
        el("div", { style: "display: flex; align-items: center; gap: 8px;" }, [
          el("span", { style: "font-size: 24px; animation: pulse 2s infinite;" }, ["🔥"]),
          el("div", {}, [
            el("div", { style: "font-weight: 800; font-size: 16px; color: var(--text-color);" }, [streak.count + " Day Streak"]),
            el("div", { style: "font-size: 11px; color: var(--muted-color);" }, ["Active study consistency"])
          ])
        ]),
        el("button", {
          class: "btn btn-icon btn-sm",
          title: "Study Calendar",
          onclick: () => openCalendarModal()
        }, [el("span", {}, ["📅"])])
      ]),
      el("div", { style: "background: var(--card-bg, #fff); padding: 8px 12px; border-radius: 8px; font-size: 12px; display: flex; justify-content: space-between; align-items: center; border: 1px solid var(--border-color);" }, [
        el("span", { style: "color: var(--muted-color);" }, ["Time on MedLink today:"]),
        el("span", { style: "font-weight: 700; color: var(--primary, #FF7A1A);" }, [formatDuration(activeSec)])
      ])
    ]));
  }
  updateStreakBanner();

  function openCalendarModal() {
    const streak = getStreak();
    const modal = el("div", { class: "modal-backdrop", onclick: (e) => { if (e.target === modal) modal.remove(); } }, [
      el("div", { class: "modal-card", style: "max-width: 400px; padding: 24px;" }, [
        el("div", { style: "display: flex; justify-content: space-between; align-items: center; margin-bottom: 16px;" }, [
          el("h3", {}, ["📅 Study Calendar & Streaks"]),
          el("button", { class: "btn btn-ghost btn-sm", onclick: () => modal.remove() }, ["✕"])
        ]),
        el("p", { style: "font-size: 13px; color: var(--muted-color); margin-bottom: 16px;" }, [
          `You have maintained a streak of ${streak.count} active study days on MedLink KE. Keep up the brilliant work!`
        ]),
        el("div", { style: "text-align: right;" }, [
          el("button", { class: "btn btn-primary btn-sm", onclick: () => modal.remove() }, ["Close"])
        ])
      ])
    ]);
    document.body.appendChild(modal);
  }

  // ---- units grid ----
  const units = data.units || [];
  const resGrid = qs("#resGrid");
  units.slice(0, 6).forEach(u => {
    resGrid.appendChild(el("a", { class: "unit-card", href: `study.html?unit=${u.id}` }, [
      el("div", { class: "unit-code" }, [u.code]),
      el("div", { class: "unit-name" }, [u.name]),
      el("div", { class: "unit-meta" }, [el("span", {}, [u.year || "Year 1"]), el("span", {}, ["Notes & past papers ›"])])
    ]));
  });

  // ---- community feed / composer ----
  const composer = qs("#composer");
  composer.appendChild(el("div", { class: "composer-box" }, [
    el("textarea", { placeholder: "Ask a medical question or share a clinical insight with your peers...", rows: 2, id: "feedInput" }),
    el("div", { class: "composer-foot" }, [
      el("span", { style: "font-size: 12px; color: var(--muted-color);" }, ["Visible to your university & course peers"]),
      el("button", {
        class: "btn btn-primary btn-sm",
        onclick: async () => {
          const body = qs("#feedInput").value.trim();
          if (!body) return MedLink.toast("Please write something first.", "error");
          try {
            await api.createPost({ body });
            qs("#feedInput").value = "";
            MedLink.toast("Posted successfully!");
            loadFeed();
          } catch(err) { MedLink.toast(err.message, "error"); }
        }
      }, ["Post"])
    ])
  ]));

  async function loadFeed() {
    const list = qs("#feedList");
    list.innerHTML = `<div style="padding:20px; text-align:center; color:var(--muted-color);">Loading discussions...</div>`;
    try {
      const posts = await api.listPosts();
      list.innerHTML = "";
      if (!posts.length) {
        list.innerHTML = `<div style="padding:24px; text-align:center; color:var(--muted-color);">No discussions yet. Start the conversation above!</div>`;
        return;
      }
      posts.forEach(p => {
        list.appendChild(el("div", { class: "feed-item" }, [
          el("div", { class: "feed-head" }, [
            el("strong", {}, [p.author_name || "Medical Student"]),
            el("span", { style: "font-size: 11px; color: var(--muted-color);" }, [new Date(p.created_at).toLocaleDateString()])
          ]),
          el("div", { class: "feed-body" }, [p.body]),
          el("div", { class: "feed-foot" }, [
            el("button", { class: "btn btn-ghost btn-xs", onclick: () => MedLink.toast("Liked!") }, ["❤️ " + (p.likes_count || 0)]),
            el("a", { class: "btn btn-ghost btn-xs", href: `communities.html?post=${p.id}` }, ["💬 Reply"])
          ])
        ]));
      });
    } catch(e) {
      list.innerHTML = `<div style="padding:20px; text-align:center; color:var(--muted-color);">Could not load discussions right now.</div>`;
    }
  }
  loadFeed();
});
</script>
</body>
</html>
