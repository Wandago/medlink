<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#FFFFFF">
<title>Home — MedLink KE</title>
<script src="theme.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="styles.css">
</head>
<body>
<main id="page" hidden>
<div class="fade-in home-grid">
  <div>
    <h1 class="disp" style="font-size:26px;margin:4px 0 4px;" id="greeting">Hello 👋</h1>
    <p class="muted" style="font-size:14px;margin:0 0 18px;" id="meMeta"></p>
    <div class="wrap-gap" style="margin-bottom:26px;" id="unitsChips"></div>

    <div class="section-heading">
      <div><div class="eyebrow">From your current units</div><h2>Continue Studying</h2></div>
      <a href="study.html" class="btn btn-ghost btn-sm">See all ›</a>
    </div>
    <div class="grid grid-fill-230" style="margin-bottom:30px;" id="continueStudying"></div>

    <div class="section-heading">
      <div><div class="eyebrow">Most viewed across MedLink</div><h2>Popular Right Now</h2></div>
      <a href="discover.html" class="btn btn-ghost btn-sm">Discover ›</a>
    </div>
    <div class="grid grid-fill-230" style="margin-bottom:30px;" id="popular"></div>

    <div class="section-heading">
      <div><div class="eyebrow">Everyone on MedLink</div><h2>Latest Discussions</h2></div>
      <a href="communities.html" class="btn btn-ghost btn-sm">Communities ›</a>
    </div>
    <div id="composer" style="margin-bottom:12px;"></div>
    <div id="feedList" class="feed-list"></div>
  </div>

  <div class="home-side">
    <div class="card pad">
      <div class="section-heading"><h2>Your Communities</h2></div>
      <div id="communitiesMini"></div>
      <a href="communities.html" class="btn btn-ghost btn-block" style="margin-top:8px;">Browse all</a>
    </div>
    <div class="card pad">
      <div class="section-heading"><h2>Medical News</h2></div>
      <div id="newsMini"></div>
      <a href="news.html" class="btn btn-ghost btn-block" style="margin-top:10px;">More news</a>
    </div>
  </div>
</div>
</main>

<script src="config.js"></script>
<script src="data.js"></script>
<script src="app.js"></script>
<script>
MedLink.run({ page: "dashboard" }, async ({ api, me }) => {
  const hour = new Date().getHours();
  const hello = hour < 12 ? "Good morning" : hour < 17 ? "Good afternoon" : "Good evening";
  qs("#greeting").textContent = `${hello}, ${me.full_name.split(" ")[0]} 👋`;
  qs("#meMeta").textContent = `${courseName(me.course_id)} · ${me.year} · ${uniName(me.university_id)}`;
  me.current_units.forEach(u => qs("#unitsChips").appendChild(
    el("a", { class: "chip", href: "study.html?unit=" + encodeURIComponent(u), style: "font-size:13px;padding:7px 14px;" }, [u])));

  NEWS.forEach(n => qs("#newsMini").appendChild(el("div", { class: "news-mini" }, [
    el("div", { class: "news-mini-title" }, [n.title]),
    el("div", { class: "faint", style: "font-size:11px;" }, [n.src + " · " + n.time]),
  ])));

  const cont = qs("#continueStudying"), popular = qs("#popular"), feed = qs("#feedList"), mini = qs("#communitiesMini");
  [cont, popular, feed, mini].forEach(n => n.appendChild(MedLink.loadingState()));

  qs("#composer").appendChild(MedLink.composerNode({
    placeholder: "Ask a question or share something with MedLink…",
    onPosted: post => { qs(".empty-state", feed)?.remove(); feed.prepend(MedLink.feedPostNode(post, { liked: new Set() })); },
  }));

  const [mine, top, posts, communities, joined] = await Promise.all([
    me.current_units.length ? api.resources({ units: me.current_units, limit: 3 }) : Promise.resolve([]),
    api.resources({ order: "views", limit: 3 }),
    api.posts({ limit: 15 }),
    api.communities(),
    api.myCommunityIds(),
  ]);

  cont.replaceChildren(...(mine.length ? mine.map(MedLink.resourceCardNode)
    : [MedLink.emptyState("No notes for your units yet — be the first to share.", el("a", { href: "study.html?upload=1", class: "btn btn-primary btn-sm" }, ["↑ Upload notes"]))]));
  popular.replaceChildren(...(top.length ? top.map(MedLink.resourceCardNode) : [MedLink.emptyState("Nothing uploaded yet.")]));
  await MedLink.renderPosts(feed, posts, "No discussions yet — start one above.");

  const mineFirst = communities.filter(c => joined.has(c.id));
  const list = mineFirst.length ? mineFirst : communities.slice(0, 3);
  mini.replaceChildren(
    ...(mineFirst.length ? [] : [el("p", { class: "faint", style: "font-size:12.5px;margin:0 0 6px;" }, ["You haven't joined any yet. Try:"])]),
    ...list.map(c => el("a", { href: "communities.html?c=" + encodeURIComponent(c.id), class: "row-gap mini-row" }, [
      el("div", { class: "avatar sm", style: "background:var(--panel);" }, [c.name.charAt(0)]),
      el("div", { style: "flex:1;min-width:0;" }, [
        el("div", { style: "font-size:13px;font-weight:700;" }, [c.name]),
        el("div", { class: "faint", style: "font-size:11.5px;" }, [plural(count(c.community_members), "member")]),
      ]),
    ])),
  );
});
</script>
</body>
</html>
