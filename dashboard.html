<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="icon" href="favicon.ico" sizes="any">
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="manifest" href="site.webmanifest">
<meta name="theme-color" content="#FFFFFF">
<title>Home — MedLink KE</title>
<script src="theme.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="styles.css">
<style>
.streak-banner-wrap {
  display: flex;
  flex-direction: column;
  align-items: stretch;
  margin: -10px 0 24px 0;
  gap: 12px;
}
.streak-header-row {
  display: flex;
  justify-content: space-between;
  align-items: flex-end;
  gap: 12px;
}
.overall-progress-card {
  flex: 1;
  background: rgba(255, 255, 255, 0.45);
  backdrop-filter: blur(12px);
  -webkit-backdrop-filter: blur(12px);
  border: 1px solid rgba(255, 255, 255, 0.6);
  border-radius: 20px;
  padding: 12px 18px;
  display: flex;
  flex-direction: column;
  gap: 8px;
  box-shadow: 0 4px 15px rgba(0,0,0,0.04);
}
[data-theme="dark"] .overall-progress-card {
  background: rgba(255, 255, 255, 0.05);
  border: 1px solid rgba(255, 255, 255, 0.1);
}
.progress-meta {
  display: flex;
  justify-content: space-between;
  align-items: baseline;
}
.progress-meta .label {
  font-size: 12px;
  font-weight: 700;
  text-transform: uppercase;
  letter-spacing: 0.5px;
  color: var(--text-2);
}
.progress-meta .value {
  font-size: 18px;
  font-weight: 800;
  color: var(--accent);
}
.progress-track {
  height: 8px;
  background: var(--border);
  border-radius: 10px;
  overflow: hidden;
}
.progress-fill {
  height: 100%;
  background: var(--grad-blue);
  border-radius: 10px;
  transition: width 1s cubic-bezier(0.34, 1.56, 0.64, 1);
}
.streak-pill {
  display: inline-flex;
  align-items: center;
  gap: 10px;
  background: rgba(255, 122, 26, 0.1);
  backdrop-filter: blur(10px);
  -webkit-backdrop-filter: blur(10px);
  border: 1px solid rgba(255, 122, 26, 0.25);
  border-radius: 20px;
  padding: 10px 16px 10px 12px;
  box-shadow: 0 4px 12px rgba(255, 122, 26, 0.08);
  transition: all 0.2s ease;
  height: fit-content;
}
.streak-pill:hover {
  transform: translateY(-2px) scale(1.02);
  box-shadow: 0 6px 18px rgba(255, 122, 26, 0.15);
  background: rgba(255, 122, 26, 0.15);
}
.streak-flame {
  font-size: 24px;
  animation: pulseFlame 1.8s infinite ease-in-out;
  display: inline-block;
  filter: drop-shadow(0 2px 4px rgba(255, 122, 26, 0.4));
}
@keyframes pulseFlame {
  0%, 100% { transform: scale(1) rotate(0deg); }
  50% { transform: scale(1.22) rotate(6deg); }
}
.streak-info {
  display: flex;
  flex-direction: column;
}
.streak-count {
  font-size: 18px;
  font-weight: 800;
  color: #D9480F;
  line-height: 1.1;
}
.streak-sub {
  font-size: 10px;
  color: var(--text-3);
  font-weight: 700;
  text-transform: uppercase;
  letter-spacing: 0.8px;
}
.streak-cal-btn {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  width: 36px;
  height: 36px;
  border-radius: 12px;
  background: rgba(255, 255, 255, 0.8);
  backdrop-filter: blur(4px);
  border: 1px solid rgba(255, 122, 26, 0.2);
  color: #D9480F;
  cursor: pointer;
  box-shadow: 0 2px 6px rgba(0,0,0,0.05);
  transition: all 0.2s ease;
}
.streak-cal-btn:hover {
  background: #D9480F;
  color: #FFFFFF;
  transform: rotate(8deg);
}
  transition: background 0.15s, color 0.15s;
}
.streak-cal-btn:hover {
  background: #D9480F;
  color: #FFFFFF;
}

/* Modal Calendar Styles */
.cal-modal-card {
  padding: 8px 4px;
}
.cal-header-row {
  display: flex;
  justify-content: space-between;
  align-items: center;
  margin-bottom: 16px;
}
.cal-nav-btn {
  background: var(--bg-soft, #F5F7FA);
  border: 1px solid var(--border, #E4E7EC);
  border-radius: 8px;
  padding: 4px 10px;
  font-size: 14px;
  font-weight: bold;
  cursor: pointer;
}
.cal-grid {
  display: grid;
  grid-template-columns: repeat(7, 1fr);
  gap: 6px;
  text-align: center;
}
.cal-day-label {
  font-size: 11.5px;
  font-weight: 700;
  color: var(--muted, #667085);
  padding-bottom: 6px;
}
.cal-cell {
  aspect-ratio: 1;
  display: flex;
  align-items: center;
  justify-content: center;
  border-radius: 10px;
  font-size: 13px;
  font-weight: 500;
  position: relative;
  background: var(--bg-soft, #F9FAFB);
  border: 1px solid transparent;
}
.cal-cell.empty {
  background: transparent;
  border-color: transparent;
}
.cal-cell.today {
  border-color: #D9480F;
  font-weight: 700;
}
.cal-cell.active-streak {
  background: linear-gradient(135deg, #FF7A1A 0%, #FF4F9A 100%);
  color: #FFFFFF;
  font-weight: 700;
  box-shadow: 0 2px 6px rgba(255, 122, 26, 0.35);
}
.cal-legend {
  display: flex;
  align-items: center;
  justify-content: space-between;
  margin-top: 20px;
  padding-top: 14px;
  border-top: 1px solid var(--border, #E4E7EC);
  font-size: 12px;
}
.cal-legend-item {
  display: flex;
  align-items: center;
  gap: 6px;
}
.cal-legend-dot {
  width: 12px;
  height: 12px;
  border-radius: 4px;
}
</style>
</head>
<body>
<main id="page" hidden>
<div class="fade-in with-rail">
  <div>
    <div class="hero-carousel" id="hero"></div>
    <div class="hero-dots" id="heroDots"></div>

    <div id="streakHost" class="streak-banner-wrap"></div>

    <div class="section-heading" style="flex-wrap:wrap">
      <h2>Continue studying</h2>
      <div class="pill-tabs" id="resTabs"></div>
    </div>
    <div class="grid grid-fill-230" style="margin-bottom:32px;" id="resGrid"></div>

    <div class="section-heading">
      <h2>Latest discussions</h2>
      <a href="communities.html" class="btn btn-ghost btn-sm">Communities ›</a>
    </div>
    <div id="composer" style="margin-bottom:12px;"></div>
    <div id="feedList" class="feed-list"></div>
  </div>

  <aside class="rail">
    <div id="upcomingSection"></div>
    <div class="rail-card" id="meCard"></div>
    <div class="rail-card">
      <div class="rail-head"><h3>Your communities</h3><a href="communities.html">See all</a></div>
      <div class="rail-list" id="communitiesMini"></div>
    </div>
    <div class="rail-card">
      <div class="rail-head"><h3>Recent activity</h3></div>
      <div class="rail-list" id="activity"></div>
    </div>
  </aside>
</div>
</main>

<script src="config.js"></script>
<script src="data.js"></script>
<script src="app.js"></script>
<script>
MedLink.run({ page: "dashboard" }, async ({ api, me }) => {
  const hour = new Date().getHours();
  const hello = hour < 12 ? "Good morning" : hour < 17 ? "Good afternoon" : "Good evening";
  const first = me.full_name.split(" ")[0];

  // ---- hero carousel ----
  const slides = [
    { kicker: new Date().toLocaleDateString(undefined, { weekday: "long", day: "numeric", month: "long" }),
      title: `${hello}, ${first}`, text: `${courseName(me.course_id)} · ${me.year} · ${uniFull(me)}`,
      photo: MedLink.siteImageUrl("dashboard-banner"),
      actions: [el("a", { class: "btn btn-white", href: "study.html" }, ["Open library"]), el("a", { class: "btn btn-ghost-white", href: "exams.html" }, ["Practice questions"])] },
    { kicker: "Earn 20 MedPoints", title: "Share your notes, help your class.",
      text: "Upload summaries, slides or past papers for your units — they stay in the library for the year below you.",
      photo: MedLink.siteImageUrl("hero-main"),
      actions: [el("a", { class: "btn btn-lime", href: "study.html?upload=1", "data-track": "dash_upload" }, ["↑ Upload notes"])] },
    { kicker: "Exam bank", title: "Practise with real exam-style MCQs.",
      text: "Questions with explanations, grouped by subject. Your best scores are saved.",
      photo: MedLink.siteImageUrl("feature-exams"),
      actions: [el("a", { class: "btn btn-white", href: "exams.html", "data-track": "dash_practice" }, ["Start practising"])] },
  ];
  const hero = qs("#hero"), dots = qs("#heroDots");
  let current = 0, timer = null;
  slides.forEach((sl, i) => {
    const photo = el("div", { class: "hero-photo" });
    if (sl.photo) photo.style.backgroundImage = MedLink.cssUrl(sl.photo);
    hero.appendChild(el("div", { class: "hero-slide" + (i === 0 ? " on" : "") }, [
      el("div", { class: "hero-text" }, [el("div", { class: "kicker" }, [sl.kicker]), el("h2", {}, [sl.title]), el("p", {}, [sl.text]), el("div", { class: "hero-actions" }, sl.actions)]),
      photo,
    ]));
    dots.appendChild(el("button", { type: "button", class: i === 0 ? "on" : null, "aria-label": "Slide " + (i + 1), onclick: () => { show(i); restart(); } }));
  });
  function show(i) {
    current = (i + slides.length) % slides.length;
    qsa(".hero-slide", hero).forEach((n, j) => n.classList.toggle("on", j === current));
    qsa("button", dots).forEach((n, j) => n.classList.toggle("on", j === current));
  }
  function restart() { clearInterval(timer); timer = setInterval(() => show(current + 1), 7000); }
  hero.addEventListener("mouseenter", () => clearInterval(timer));
  hero.addEventListener("mouseleave", restart);
  restart();

  // ---- streak logic ----
  const STORAGE_STREAK = "medlink_streak_" + me.id;
  function getStreak() {
    try {
      const data = JSON.parse(localStorage.getItem(STORAGE_STREAK) || '{"count":0,"history":[]}');
      const today = new Date().toISOString().split("T")[0];
      // Note today if not already noted
      if (!data.history.includes(today)) {
        data.history.push(today);
        // Basic streak logic: if yesterday exists, increment. Otherwise reset to 1.
        const yesterday = new Date(Date.now() - 86400000).toISOString().split("T")[0];
        if (data.history.includes(yesterday)) data.count += 1;
        else data.count = 1;
        localStorage.setItem(STORAGE_STREAK, JSON.stringify(data));
      }
      return data;
    } catch (e) { return {count:1, history:[new Date().toISOString().split("T")[0]]}; }
  }

  const streakData = getStreak();
  const streakHost = qs("#streakHost");
  if (streakHost) {
    // ---- overall planner progress calc ----
    const plannerData = (function() {
      try {
        const saved = localStorage.getItem("medlink_planner_events_" + me.id);
        const evs = saved ? JSON.parse(saved) : [];
        const total = evs.reduce((sum, e) => sum + (e.topics ? e.topics.length : 0), 0);
        const done = evs.reduce((sum, e) => sum + (e.topics ? e.topics.filter(t => t.done).length : 0), 0);
        return { pct: total ? Math.round(done / total * 100) : 0, count: evs.length };
      } catch(e) { return { pct: 0, count: 0 }; }
    })();

    streakHost.appendChild(el("div", { class: "streak-header-row" }, [
      el("div", { class: "overall-progress-card" }, [
        el("div", { class: "progress-meta" }, [
          el("span", { class: "label" }, ["Study Readiness"]),
          el("span", { class: "value" }, [plannerData.pct + "%"]),
        ]),
        el("div", { class: "progress-track" }, [
          el("div", { class: "progress-fill", style: "width:" + plannerData.pct + "%" })
        ]),
        el("div", { class: "faint", style: "font-size:11px;font-weight:600;" }, [
          plannerData.count ? `Tracking ${plannerData.count} upcoming exam${plannerData.count > 1 ? 's' : ''}` : "Add exams in Study Planner"
        ])
      ]),
      el("div", { class: "streak-pill" }, [
        el("span", { class: "streak-flame" }, ["🔥"]),
        el("div", { class: "streak-info" }, [
          el("span", { class: "streak-count" }, [streakData.count]),
          el("span", { class: "streak-sub" }, ["Day Streak"])
        ]),
        el("button", { 
          class: "streak-cal-btn", 
          title: "View your study calendar",
          onclick: openCalendarModal
        }, [
          el("svg", { width: "16", height: "16", viewBox: "0 0 24 24", fill: "none", stroke: "currentColor", "stroke-width": "2", "stroke-linecap": "round", "stroke-linejoin": "round" }, [
            el("rect", { x: "3", y: "4", width: "18", height: "18", rx: "2", ry: "2" }),
            el("line", { x1: "16", y1: "2", x2: "16", y2: "6" }),
            el("line", { x1: "8", y1: "2", x2: "8", y2: "6" }),
            el("line", { x1: "3", y1: "10", x2: "21", y2: "10" })
          ])
        ])
      ])
    ]));
  }

  function openCalendarModal() {
    let viewDate = new Date();
    const modalBody = el("div", { class: "cal-modal-card" });

    function renderMonth(date) {
      modalBody.replaceChildren();
      const month = date.getMonth();
      const year = date.getFullYear();
      const monthName = date.toLocaleString(undefined, { month: "long", year: "numeric" });
      
      const header = el("div", { class: "cal-header-row" }, [
        el("button", { class: "cal-nav-btn", onclick: () => { viewDate.setMonth(viewDate.getMonth()-1); renderMonth(viewDate); } }, ["‹"]),
        el("h3", { style: "margin:0;font-size:16px;" }, [monthName]),
        el("button", { class: "cal-nav-btn", onclick: () => { viewDate.setMonth(viewDate.getMonth()+1); renderMonth(viewDate); } }, ["›"])
      ]);

      const grid = el("div", { class: "cal-grid" });
      ["S","M","T","W","T","F","S"].forEach(d => grid.appendChild(el("div", { class: "cal-day-label" }, [d])));

      const firstDay = new Date(year, month, 1).getDay();
      const daysInMonth = new Date(year, month + 1, 0).getDate();
      const todayStr = new Date().toISOString().split("T")[0];

      for(let i=0; i<firstDay; i++) grid.appendChild(el("div", { class: "cal-cell empty" }));
      for(let d=1; d<=daysInMonth; d++) {
        const dStr = `${year}-${String(month+1).padStart(2,'0')}-${String(d).padStart(2,'0')}`;
        const isToday = dStr === todayStr;
        const active = streakData.history.includes(dStr);
        grid.appendChild(el("div", { class: "cal-cell" + (isToday ? " today" : "") + (active ? " active-streak" : "") }, [d]));
      }

      modalBody.append(header, grid, el("div", { class: "cal-legend" }, [
        el("div", { class: "cal-legend-item" }, [el("div", { class: "cal-legend-dot", style: "background:linear-gradient(135deg, #FF7A1A, #FF4F9A)" }), "Study Day"]),
        el("div", { class: "cal-legend-item" }, [el("div", { class: "cal-legend-dot", style: "background:var(--bg-soft, #F9FAFB);border:1px solid var(--border)" }), "Rest Day"])
      ]));
    }

    renderMonth(viewDate);
    MedLink.modal("Study Calendar", modalBody);
  }

  const grid = qs("#resGrid"), feed = qs("#feedList"), mini = qs("#communitiesMini"), activity = qs("#activity");
  [grid, feed, mini, activity].forEach(n => n.appendChild(MedLink.loadingState()));
  qs("#composer").appendChild(MedLink.composerNode({
    placeholder: "Ask a question or share something with MedLink…",
    onPosted: post => { qs(".empty-state", feed)?.remove(); feed.prepend(MedLink.feedPostNode(post, { liked: new Set() })); },
  }));

  const [mine, popular, recent, posts, communities, joined, uploads, saved, points] = await Promise.all([
    me.current_units.length ? api.resources({ units: me.current_units, limit: 6 }) : Promise.resolve([]),
    api.resources({ order: "views", limit: 6 }),
    api.resources({ limit: 6 }),
    api.posts({ limit: 15 }),
    api.communities(),
    api.myCommunityIds(),
    api.resources({ authorId: me.id, limit: 500 }),
    api.savedIds(),
    api.medPoints(me.id),
  ]);

  // ---- tabbed resources ----
  const TABS = [["units", "Your units", mine], ["popular", "Popular", popular], ["new", "New", recent]];
  const tabs = qs("#resTabs");
  function paint(key) {
    const [, , rows] = TABS.find(t => t[0] === key);
    qsa("button", tabs).forEach(b => b.classList.toggle("on", b.dataset.key === key));
    grid.replaceChildren(...(rows.length ? rows.map(MedLink.resourceCardNode) : [MedLink.emptyState(
      key === "units" ? "No notes for your units yet — be the first to share." : "Nothing uploaded yet.",
      el("a", { href: "study.html?upload=1", class: "btn btn-primary btn-sm" }, ["↑ Upload notes"]))]));
  }
  TABS.forEach(([key, label]) => tabs.appendChild(el("button", { type: "button", "data-key": key, onclick: () => paint(key) }, [label])));
  paint(mine.length ? "units" : "popular");

  await MedLink.renderPosts(feed, posts, "No discussions yet — start one above.");

  // ---- rail: upcoming events ----
  const STORAGE_PLANNER = "medlink_planner_events_" + me.id;
  function loadPlanner() {
    try { const saved = localStorage.getItem(STORAGE_PLANNER); return saved ? JSON.parse(saved) : []; } catch(e) { return []; }
  }
  const plannerEvents = loadPlanner();
  const todayStr = new Date().toISOString().split("T")[0];
  const upcomingEvents = plannerEvents.filter(e => e.date >= todayStr).sort((a,b) => new Date(a.date) - new Date(b.date)).slice(0, 3);

  const upcomingSection = qs("#upcomingSection");
  if (upcomingSection) {
    const card = el("div", { class: "rail-card" }, [
      el("div", { class: "rail-head" }, [
        el("h3", { style: "display:flex;align-items:center;gap:6px;" }, [
          el("span", { style: "font-size:16px;" }, ["🗓"]), "Upcoming exams"
        ]),
        el("a", { href: "planner.html", style: "font-size:12px;" }, ["View planner"])
      ])
    ]);
    const list = el("div", { class: "rail-list" });
    if (!upcomingEvents.length) {
      list.appendChild(el("div", { class: "faint", style: "font-size:13px;padding:8px 4px;" }, ["No upcoming exams set. Organize your CATs and papers in the Study Planner."]));
    } else {
      upcomingEvents.forEach(ev => {
        const typeLabels = { exam: "Exam", cat: "CAT", revision: "Revision", deadline: "Deadline" };
        const topics = ev.topics || [];
        const pct = topics.length ? Math.round(topics.filter(t => t.done).length / topics.length * 100) : 0;
        list.appendChild(el("a", { class: "rail-item", href: "planner.html", style: "display:block;" }, [
          el("div", { class: "who", style: "gap:2px;" }, [
            el("div", { style: "display:flex;align-items:center;gap:6px;justify-content:space-between;" }, [
              el("div", { style: "display:flex;align-items:center;gap:6px;" }, [
                el("span", { class: "event-badge " + ev.type, style: "font-size:9px;padding:1px 4px;" }, [typeLabels[ev.type] || ev.type]),
                el("b", { style: "font-size:13px;" }, [ev.title])
              ]),
              topics.length ? el("span", { style: "font-size:11px;font-weight:700;color:" + (pct >= 100 ? "var(--success)" : "var(--accent)") }, [pct + "%"]) : null
            ]),
            el("div", { style: "display:flex;justify-content:space-between;align-items:center;margin-top:2px;" }, [
              el("span", { class: "faint", style: "font-size:11px;" }, [ev.date]),
              topics.length ? el("div", { style: "width:40px;height:4px;background:var(--border);border-radius:99px;overflow:hidden;" }, [
                el("div", { style: "width:" + pct + "%;height:100%;background:" + (pct >= 100 ? "var(--success)" : "var(--accent)") })
              ]) : null
            ])
          ])
        ]));
      });
    }
    card.appendChild(list);
    upcomingSection.appendChild(card);
  }

  // ---- rail: me ----
  const stat = (n, label, href) => el("a", { href, style: "text-align:center;flex:1" }, [
    el("div", { style: "font-size:20px;font-weight:700" }, [Number(n).toLocaleString()]),
    el("div", { class: "faint", style: "font-size:11.5px" }, [label]),
  ]);
  qs("#meCard").replaceChildren(
    el("div", { class: "rail-item", style: "margin-bottom:14px" }, [
      MedLink.avatarNode(me, "md", true),
      el("div", { class: "who" }, [el("b", {}, [me.full_name]), el("span", {}, [MedLink.metaLine(me)])]),
    ]),
    el("div", { style: "display:flex;gap:6px;padding-top:12px;border-top:1px solid var(--border)" }, [
      stat(points, "MedPoints", profileHref(me)), stat(uploads.length, "Notes shared", "study.html"), stat(saved.size, "Saved", "saved.html"),
    ]),
  );

  // ---- rail: communities ----
  const mineFirst = communities.filter(c => joined.has(c.id));
  const list = (mineFirst.length ? mineFirst : communities).slice(0, 5);
  mini.replaceChildren(...list.map(c => el("div", { class: "rail-item" }, [
    MedLink.communityCoverNode(c, "cc-cover cc-sm"),
    el("a", { class: "who", href: "communities.html?c=" + encodeURIComponent(c.id) }, [el("b", {}, [c.name]), el("span", {}, [plural(count(c.community_members), "member")])]),
    el("a", { class: "pill-btn", href: "communities.html?c=" + encodeURIComponent(c.id) }, [joined.has(c.id) ? "Open" : "View"]),
  ])));

  // ---- rail: recent activity (new notes + posts) ----
  const items = recent.filter(r => r.author).map(r => ({ at: r.created_at, who: r.author, text: "shared “" + r.title + "”", href: "resource.html?id=" + r.id }))
    .concat(posts.filter(p => p.author).map(p => ({ at: p.created_at, who: p.author, text: p.community ? "posted in " + p.community.name : "posted", href: p.community ? "communities.html?c=" + p.community.id : "#feedList" })))
    .sort((a, b) => new Date(b.at) - new Date(a.at)).slice(0, 6);
  activity.replaceChildren(...(items.length ? items.map(i => el("a", { class: "rail-item", href: i.href }, [
    MedLink.avatarNode(i.who, "sm", false),
    el("div", { class: "who" }, [el("b", {}, [i.who.full_name]), el("span", {}, [i.text])]),
    el("span", { class: "time" }, [timeAgo(i.at)]),
  ])) : [el("div", { class: "faint", style: "font-size:13px" }, ["Nothing yet — be the first to share."])]));
});
</script>
