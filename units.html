<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="icon" href="favicon.ico" sizes="any">
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="manifest" href="site.webmanifest">
<meta name="theme-color" content="#FFFFFF">
<title>Current Units — MedLink KE</title>
<script src="theme.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="styles.css">
</head>
<body>
<main id="page" hidden>
<div class="fade-in">
  <div class="page-head">
    <div>
      <h1>My units</h1>
      <p id="unitsSub"></p>
    </div>
    <a href="onboarding.html?edit=1&amp;step=3" class="btn btn-ghost btn-sm">Edit my units</a>
  </div>
  <div class="grid grid-fill-260" id="unitsGrid"></div>
</div>
</main>

<script src="config.js"></script>
<script src="data.js"></script>
<script src="app.js"></script>
<script>
MedLink.run({ page: "units" }, async ({ api, me }) => {
  const grid = qs("#unitsGrid");
  const units = me.current_units;
  qs("#unitsSub").textContent = `${courseName(me.course_id)} · ${me.year} — ${plural(units.length, "unit")} this semester. Discussions happen in your course community.`;

  const cards = units.map((name, i) => {
    const stats = el("div", { class: "faint", style: "font-size:12.5px;margin:4px 0 14px;" }, ["Loading…"]);
    const color = subjectColor(name);
    const card = el("div", { class: "card set-card", style: `--sc:${color};--sc-soft:color-mix(in srgb, ${color} 12%, transparent)` }, [
      el("span", { class: "subject" }, [semesterOfUnit(me.course_id, me.year, name) || "This semester"]),
      el("div", { style: "font-weight:700;font-size:15.5px;line-height:1.3;" }, [name]),
      stats,
      el("div", { class: "row-gap" }, [
        el("a", { class: "btn btn-dark btn-block", href: "study.html?unit=" + encodeURIComponent(name) }, ["Notes"]),
        el("a", { class: "btn btn-ghost btn-block", href: "exams.html#online" }, ["Past papers"]),
      ]),
    ]);
    api.unitStats(name).then(s => {
      stats.textContent = `${plural(s.resources, "resource")} shared · ${plural(s.members, "student")} taking it`;
    }).catch(() => { stats.textContent = ""; });
    return card;
  });
  if (!units.length) cards.push(MedLink.emptyState("You haven't picked any units yet."));
  cards.push(el("a", { class: "join-unit-tile", href: "onboarding.html?edit=1&step=3" }, ["+", el("span", {}, ["Add or change units"])]));
  grid.replaceChildren(...cards);
});
</script>
</body>
</html>
