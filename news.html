<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="icon" href="favicon.ico" sizes="any">
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="manifest" href="site.webmanifest">
<meta name="theme-color" content="#FFFFFF">
<title>News — MedLink KE</title>
<script src="theme.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="styles.css">
</head>
<body>
<main id="page" hidden>
<div class="fade-in" style="max-width:680px;">
  <h1 class="disp" style="font-size:24px;margin:0 0 6px;">Medical News</h1>
  <p class="muted" style="font-size:14px;margin:0 0 22px;">What's happening in medicine today — curated for students.</p>
  <div class="feed-list" id="newsList"></div>
</div>
</main>

<script src="config.js"></script>
<script src="data.js"></script>
<script src="app.js"></script>
<script>
MedLink.run({ page: "news" }, async () => {
  qs("#newsList").replaceChildren(...NEWS.map(n => el("div", { class: "card pad" }, [
    el("div", { class: "eyebrow-text", style: "margin-bottom:6px;" }, [n.src + " · " + n.time]),
    el("div", { style: "font-size:15.5px;font-weight:700;line-height:1.4;" }, [n.title]),
  ])));
});
</script>
</body>
</html>
