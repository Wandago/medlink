<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#FFFFFF">
<title>Saved — MedLink KE</title>
<script src="theme.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="styles.css">
</head>
<body>
<main id="page" hidden>
<div class="fade-in">
  <h1 class="disp" style="font-size:24px;margin:0 0 20px;">Saved</h1>
  <div class="grid grid-fill-230" id="grid"></div>
</div>
</main>

<script src="config.js"></script>
<script src="data.js"></script>
<script src="app.js"></script>
<script>
MedLink.run({ page: "saved" }, async ({ api }) => {
  const grid = qs("#grid");
  grid.appendChild(MedLink.loadingState());
  const list = await api.savedResources();
  grid.replaceChildren(...(list.length ? list.map(MedLink.resourceCardNode)
    : [MedLink.emptyState("Nothing saved yet. Tap 🔖 Save on any resource to keep it here.",
        el("a", { href: "study.html", class: "btn btn-ghost btn-sm" }, ["Browse the library"]))]));
});
</script>
</body>
</html>
