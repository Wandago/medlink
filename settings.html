<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#FFFFFF">
<title>Settings — MedLink KE</title>
<script src="theme.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="styles.css">
</head>
<body>
<main id="page" hidden>
<div class="fade-in" style="max-width:520px;">
  <h1 class="disp" style="font-size:24px;margin:0 0 6px;">Settings</h1>
  <p class="muted" style="font-size:14px;margin:0 0 20px;" id="whoami"></p>

  <div class="card settings-row" style="cursor:default;">
    <div>
      <div style="font-size:14px;font-weight:600;">Appearance</div>
      <div class="faint" style="font-size:12px;margin-top:2px;">Follows your device unless you choose.</div>
    </div>
    <div class="seg-control" id="themeSeg">
      <button type="button" data-mode="light">Light</button>
      <button type="button" data-mode="dark">Dark</button>
      <button type="button" data-mode="system">System</button>
    </div>
  </div>

  <form class="card pad settings-form" id="profileForm">
    <div style="font-size:14px;font-weight:600;margin-bottom:12px;">Profile</div>
    <div class="field">
      <label for="in-name">Full name</label>
      <input type="text" id="in-name" maxlength="80" required>
    </div>
    <div class="field">
      <label for="in-bio">Bio</label>
      <textarea id="in-bio" rows="3" maxlength="280" placeholder="A line about you — what you're studying, what you're into."></textarea>
      <div class="field-hint" id="bioCount"></div>
    </div>
    <div class="field">
      <label>Profile colour</label>
      <div class="row-gap"><div class="avatar md" id="preview"></div><div class="avatar-color-row" id="colors"></div></div>
    </div>
    <button class="btn btn-primary" type="submit" id="saveBtn">Save profile</button>
  </form>

  <a class="card settings-row" href="onboarding.html?edit=1&amp;step=1">
    <span><span style="font-size:14px;font-weight:600;">Username, course, units &amp; interests</span>
      <span class="faint" style="display:block;font-size:12px;margin-top:2px;" id="studySummary"></span></span>
    <span class="faint">›</span>
  </a>
  <button class="card settings-row" type="button" id="accountBtn">
    <span><span style="font-size:14px;font-weight:600;">Account &amp; security</span>
      <span class="faint" style="display:block;font-size:12px;margin-top:2px;">Email, password, connected accounts — managed by Clerk</span></span>
    <span class="faint">›</span>
  </button>
  <button class="btn btn-ghost btn-block btn-danger" id="logout" type="button" style="margin-top:6px;">Sign out</button>
</div>
</main>

<script src="config.js"></script>
<script src="data.js"></script>
<script src="app.js"></script>
<script>
MedLink.run({ page: "settings" }, async ({ api, clerk, me }) => {
  if (param("saved") === "1") MedLink.toast("Profile updated.", "success");
  const email = clerk.user.primaryEmailAddress ? clerk.user.primaryEmailAddress.emailAddress : "";
  qs("#whoami").textContent = `Signed in as @${me.username}${email ? " · " + email : ""}`;
  qs("#studySummary").textContent = `@${me.username} · ${courseName(me.course_id)} · ${me.year} · ${me.current_units.length} units`;

  // Appearance
  const seg = qs("#themeSeg");
  const paintSeg = () => { const pref = MedLinkTheme.preference(); qsa("button", seg).forEach(b => b.classList.toggle("active", b.dataset.mode === pref)); };
  qsa("button", seg).forEach(b => b.addEventListener("click", () => {
    MedLink.track("theme_change", { mode: b.dataset.mode });
    if (b.dataset.mode === "system") MedLinkTheme.useSystem(); else MedLinkTheme.set(b.dataset.mode);
    paintSeg();
  }));
  document.addEventListener("themechange", paintSeg);
  paintSeg();

  // Profile basics
  const name = qs("#in-name"), bio = qs("#in-bio"), preview = qs("#preview");
  let color = me.color;
  name.value = me.full_name;
  bio.value = me.bio || "";
  const paint = () => {
    preview.style.background = safeColor(color);
    preview.textContent = initials(name.value) || "?";
    qs("#bioCount").textContent = `${bio.value.length} / 280`;
    qsa(".color-dot", qs("#colors")).forEach(d => d.classList.toggle("selected", d.dataset.color === color));
  };
  AVATAR_COLORS.forEach(c => qs("#colors").appendChild(el("button", {
    class: "color-dot", type: "button", style: `background:${c}`, "data-color": c, "aria-label": "Choose colour " + c,
    onclick: () => { color = c; paint(); },
  })));
  name.addEventListener("input", paint);
  bio.addEventListener("input", paint);
  paint();

  qs("#profileForm").addEventListener("submit", async e => {
    e.preventDefault();
    if (!name.value.trim()) return MedLink.toast("Your name can't be empty.", "error");
    const btn = qs("#saveBtn");
    btn.disabled = true; btn.textContent = "Saving…";
    try {
      await api.updateProfile({ full_name: name.value.trim(), bio: bio.value.trim(), color: safeColor(color) });
      MedLink.toast("Profile saved.", "success");
      const top = qs(".topbar .avatar");
      if (top) { top.style.background = safeColor(color); top.textContent = initials(name.value); }
    } catch (err) { MedLink.reportError(err); }
    btn.disabled = false; btn.textContent = "Save profile";
  });

  qs("#accountBtn").addEventListener("click", () => clerk.openUserProfile());
  qs("#logout").addEventListener("click", () => MedLink.signOut());
});
</script>
</body>
</html>
