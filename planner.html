<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="icon" href="favicon.ico" sizes="any">
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="manifest" href="site.webmanifest">
<meta name="theme-color" content="#FFFFFF">
<title>Study Planner & Calendar — MedLink KE</title>
<script src="theme.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="styles.css">
<style>
.planner-layout {
  display: grid;
  grid-template-columns: 1fr 340px;
  gap: 20px;
}
@media(max-width: 900px) {
  .planner-layout { grid-template-columns: 1fr; }
}
.cal-grid-full {
  display: grid;
  grid-template-columns: repeat(7, 1fr);
  gap: 8px;
  text-align: center;
}
.cal-day-header {
  font-size: 12px;
  font-weight: 700;
  color: var(--text-2);
  padding: 8px 0;
}
.cal-box {
  min-height: 90px;
  background: var(--surface-2);
  border: 1px solid var(--border);
  border-radius: 12px;
  padding: 8px;
  text-align: left;
  display: flex;
  flex-direction: column;
  justify-content: flex-start;
  position: relative;
  transition: border-color 0.15s;
}
.cal-box:hover { border-color: var(--accent); }
.cal-box.other-month { opacity: 0.4; }
.cal-box.today { border-color: var(--accent); background: var(--accent-soft); }
.cal-date-num {
  font-size: 13px;
  font-weight: 700;
  margin-bottom: 4px;
}
.event-badge {
  font-size: 10.5px;
  font-weight: 600;
  padding: 2px 6px;
  border-radius: 6px;
  margin-bottom: 3px;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
  display: block;
  cursor: pointer;
}
.event-badge.exam { background: rgba(229, 72, 77, 0.15); color: var(--error); border: 1px solid rgba(229, 72, 77, 0.3); }
.event-badge.cat { background: rgba(255, 122, 26, 0.15); color: var(--orange-text); border: 1px solid rgba(255, 122, 26, 0.3); }
.event-badge.revision { background: rgba(26, 86, 240, 0.12); color: var(--accent); border: 1px solid rgba(26, 86, 240, 0.3); }
.event-badge.deadline { background: rgba(123, 97, 255, 0.15); color: var(--purple); border: 1px solid rgba(123, 97, 255, 0.3); }

.timetable-wrap {
  position: relative;
  border-radius: 12px;
  overflow: hidden;
  background: var(--surface-2);
  border: 1px dashed var(--border-strong);
  min-height: 180px;
  display: flex;
  align-items: center;
  justify-content: center;
  text-align: center;
  cursor: pointer;
  transition: border-color 0.2s;
}
.timetable-wrap:hover {
  border-color: var(--accent);
}
.timetable-placeholder {
  padding: 30px;
}
.timetable-img {
  width: 100%;
  max-height: 400px;
  object-fit: contain;
  display: block;
  background: #000;
}
</style>
</head>
<body>
<main id="page" hidden>
<div class="fade-in" id="planner-root"></div>
</main>

<script src="config.js"></script>
<script src="data.js"></script>
<script src="app.js"></script>
<script>
MedLink.run({ page: "planner" }, async ({ api, me }) => {
  const root = qs("#planner-root");
  const STORAGE_KEY = "medlink_planner_events_" + me.id;
  const STORAGE_TT = "medlink_timetable_" + me.id;

  function loadEvents() {
    try {
      const saved = localStorage.getItem(STORAGE_KEY);
      if (saved) return JSON.parse(saved);
    } catch (e) {}
    // Default starter events
    const today = new Date();
    const d1 = new Date(today.getTime() + 86400000 * 3).toISOString().split("T")[0];
    const d2 = new Date(today.getTime() + 86400000 * 7).toISOString().split("T")[0];
    return [
      { id: "e1", title: "Biochemistry CAT 1", unit: "Biochemistry", type: "cat", date: d1, note: "Chapters 1 to 4 metabolism", topics: [
        { label: "Glycolysis & TCA cycle", done: true },
        { label: "Lipid metabolism", done: false },
        { label: "Amino acid metabolism", done: false },
      ] },
      { id: "e2", title: "Human Anatomy Practical Exam", unit: "Human Anatomy", type: "exam", date: d2, note: "Upper limb & thorax dissection spots", topics: [
        { label: "Upper limb osteology", done: true },
        { label: "Thoracic wall muscles", done: false },
      ] },
    ];
  }

  function saveEvents(evs) {
    try { localStorage.setItem(STORAGE_KEY, JSON.stringify(evs)); } catch (e) {}
  }
  function saveTimetable(url) {
    try { localStorage.setItem(STORAGE_TT, url); } catch (e) {}
  }
  function loadTimetable() {
    try { return localStorage.getItem(STORAGE_TT); } catch(e) { return null; }
  }

  let events = loadEvents();
  let currentMonth = new Date();

  // ---- progress helpers ----
  function evProgressPct(ev) {
    const t = ev.topics || [];
    if (!t.length) return 0;
    return Math.round(t.filter(x => x.done).length / t.length * 100);
  }
  function evStatus(ev) {
    const pct = evProgressPct(ev);
    if (!ev.topics || !ev.topics.length) return { label: "No plan yet", color: "var(--text-3)" };
    if (pct >= 100) return { label: "Ready 🎉", color: "var(--success)" };
    if (pct >= 60) return { label: "On track", color: "var(--accent)" };
    if (pct >= 25) return { label: "Getting there", color: "var(--orange-text)" };
    return { label: "Needs work", color: "var(--error)" };
  }
  // Unit suggestions come from the student's own units, then the full catalogue.
  function unitOptions() {
    const set = new Set(me.current_units || []);
    try {
      Object.values(UNIT_CATALOG).forEach(course => Object.values(course).forEach(y => Object.values(y).forEach(list => list.forEach(u => set.add(u)))));
    } catch (e) {}
    return Array.from(set).sort((a, b) => a.localeCompare(b));
  }
  function persist() { saveEvents(events); renderView(); }

  // ---- checklist modal: tick topics off to track % progress ----
  function openTopicChecklist(ev) {
    if (!ev.topics) ev.topics = [];
    const listBox = el("div", { class: "wrap-gap", style: "flex-direction:column;gap:8px;margin:10px 0;" });
    const pctBar = el("div", {});
    const newTopic = el("input", { type: "text", placeholder: "e.g. Cranial nerves I–XII", maxlength: 120 });

    function paintProgress() {
      const pct = evProgressPct(ev);
      pctBar.replaceChildren(
        el("div", { style: "display:flex;justify-content:space-between;font-size:12.5px;margin-bottom:5px;" }, [
          el("span", { class: "faint" }, [ev.title + " · " + (ev.unit || "General")]),
          el("b", { style: "color:" + (pct >= 100 ? "var(--success)" : "var(--accent)") }, [pct + "%"])
        ]),
        el("div", { style: "background:var(--border);border-radius:99px;height:9px;overflow:hidden;" }, [
          el("div", { style: "width:" + pct + "%;height:100%;background:" + (pct >= 100 ? "var(--success)" : "linear-gradient(90deg, #1A56F0, #0EA5E9)") + ";transition:width .35s ease;" })
        ])
      );
    }
    function paintList() {
      listBox.replaceChildren();
      if (!ev.topics.length) {
        listBox.appendChild(el("div", { class: "faint", style: "font-size:13px;" }, ["No topics yet — add the topics or subtopics you must cover before this " + (ev.type === "exam" ? "exam" : "date") + "."]));
      }
      ev.topics.forEach((t, i) => {
        const cb = el("input", { type: "checkbox", checked: t.done });
        cb.addEventListener("change", () => {
          t.done = cb.checked;
          saveEvents(events);
          paintProgress(); paintList();
        });
        listBox.appendChild(el("div", { class: "row-gap", style: "align-items:flex-start;justify-content:space-between;background:var(--surface-2);border:1px solid var(--border);border-radius:10px;padding:9px 11px;" }, [
          el("label", { class: "row-gap", style: "align-items:flex-start;gap:9px;cursor:pointer;flex:1;" }, [
            cb, el("span", { style: "font-size:13.5px;" + (t.done ? "text-decoration:line-through;opacity:.6;" : "") }, [t.label])
          ]),
          el("button", { type: "button", class: "icon-btn", style: "width:22px;height:22px;font-size:11px;", title: "Remove topic", onclick: () => {
            ev.topics.splice(i, 1); saveEvents(events); paintProgress(); paintList();
          } }, ["✕"])
        ]));
      });
    }
    function addTopic() {
      const label = newTopic.value.trim();
      if (!label) return;
      ev.topics.push({ label, done: false });
      newTopic.value = "";
      saveEvents(events); paintProgress(); paintList();
    }
    newTopic.addEventListener("keydown", e => { if (e.key === "Enter") { e.preventDefault(); addTopic(); } });

    const form = el("div", { class: "form-stack", style: "margin-top:12px;" }, [
      pctBar,
      el("div", { class: "field" }, [
        el("label", {}, ["Topics / subtopics to complete"]),
        listBox
      ]),
      el("div", { class: "row-gap", style: "align-items:stretch;" }, [
        el("div", { style: "flex:1;" }, [newTopic]),
        el("button", { type: "button", class: "btn btn-soft", onclick: addTopic }, ["+ Add topic"])
      ]),
      el("div", { class: "row-gap", style: "justify-content:space-between;align-items:center;margin-top:14px;" }, [
        el("span", { class: "faint", style: "font-size:12px;" }, ["Due " + ev.date]),
        el("button", { type: "button", class: "btn btn-primary", onclick: () => { close(); renderView(); MedLink.toast("Progress saved — " + evProgressPct(ev) + "% complete", "success"); } }, ["Done"])
      ])
    ]);

    paintProgress(); paintList();
    const close = MedLink.modal("Study progress · " + (ev.unit || ev.title), form);
  }

  function renderView() {
    root.replaceChildren();

    const topHeader = el("div", { class: "group-header", style: "margin-bottom:20px;" }, [
      el("div", {}, [
        el("h1", { class: "disp", style: "font-size:22px;margin:0 0 2px;" }, ["Study Planner & Calendar"]),
        el("p", { class: "muted", style: "margin:0;font-size:13.5px;" }, [
          "Organize upcoming exams, CATs, assignments, and study sessions."
        ]),
      ]),
      el("div", { style: "display:flex;gap:8px;flex-wrap:wrap;" }, [
        el("button", {
          type: "button",
          class: "btn btn-primary",
          onclick: () => openAddEventModal()
        }, ["+ Add upcoming event"]),
        el("button", {
          type: "button",
          class: "btn btn-soft",
          onclick: () => openTimetableModal()
        }, ["📷 School timetable"])
      ])
    ]);

    // ---- Timetable photo card ----
    const ttCard = el("div", { class: "card pad", style: "margin-bottom:20px;" }, [
      el("div", { class: "rail-head", style: "margin-bottom:12px;" }, [
        el("h3", { style: "font-size:16px;" }, ["School Timetable"]),
        el("span", { class: "faint", style: "font-size:12px;" }, ["Your weekly class schedule"])
      ])
    ]);
    const ttWrap = el("div", { class: "timetable-wrap" });
    const savedTT = loadTimetable();
    if (savedTT) {
      const img = el("img", { class: "timetable-img", src: savedTT, alt: "School timetable" });
      img.addEventListener("click", () => MedLink.modal("School Timetable", el("img", { class: "timetable-img", src: savedTT, alt: "School timetable enlarged" })));
      ttWrap.replaceChildren(img, el("div", { style: "position:absolute;top:8px;right:8px;display:flex;gap:6px;" }, [
        el("button", { type: "button", class: "btn btn-soft btn-sm", onclick: (e) => { e.stopPropagation(); openTimetableModal(); } }, ["Replace"]),
        el("button", { type: "button", class: "btn btn-ghost btn-sm", onclick: (e) => { e.stopPropagation(); if (confirm("Remove your timetable photo?")) { saveTimetable(null); renderView(); } } }, ["Remove"])
      ]));
    } else {
      ttWrap.appendChild(el("div", { class: "timetable-placeholder", onclick: () => openTimetableModal() }, [
        el("div", { style: "font-size:24px;margin-bottom:8px;" }, ["📋"]),
        el("div", { style: "font-size:13px;font-weight:600;" }, ["Upload Timetable"]),
        el("div", { style: "font-size:11px;color:var(--text-3);margin-top:4px;" }, ["Tap to upload your weekly schedule photo"])
      ]));
    }
    ttCard.appendChild(ttWrap);

    const year = currentMonth.getFullYear();
    const month = currentMonth.getMonth();
    const monthName = currentMonth.toLocaleString(undefined, { month: "long", year: "numeric" });

    const calHeader = el("div", { class: "cal-header-row", style: "margin-bottom:12px;" }, [
      el("button", { class: "cal-nav-btn", onclick: () => { currentMonth.setMonth(currentMonth.getMonth() - 1); renderView(); } }, ["‹ Prev month"]),
      el("h2", { style: "font-size:17px;font-weight:700;" }, [monthName]),
      el("button", { class: "cal-nav-btn", onclick: () => { currentMonth.setMonth(currentMonth.getMonth() + 1); renderView(); } }, ["Next month ›"])
    ]);

    const calContainer = el("div", { class: "card pad", style: "margin-bottom:20px;" }, [
      calHeader,
      el("div", { class: "cal-grid-full" }, [
        ...["Sun", "Mon", "Tue", "Wed", "Thu", "Fri", "Sat"].map(d => el("div", { class: "cal-day-header" }, [d])),
        ...buildCalendarCells(year, month)
      ])
    ]);

    // Upcoming events sidebar / list
    const upcomingList = el("div", { class: "card pad" }, [
      el("div", { class: "rail-head", style: "margin-bottom:12px;" }, [
        el("h3", { style: "font-size:16px;" }, ["Upcoming Exams & CATs"]),
        el("span", { class: "faint", style: "font-size:12px;" }, [events.length + " scheduled"])
      ])
    ]);

    const upcomingContainer = el("div", {});
    const sortedEvents = events.slice().sort((a,b) => new Date(a.date) - new Date(b.date));
    const todayStr = new Date().toISOString().split("T")[0];
    const futureEvents = sortedEvents.filter(e => e.date >= todayStr);

    if (!futureEvents.length) {
      upcomingContainer.appendChild(el("div", { class: "faint", style: "font-size:13px;padding:12px 0;" }, ["No upcoming exams or CATs scheduled. Click '+ Add upcoming event' above."]));
    } else {
      futureEvents.forEach(ev => {
        const typeLabels = { exam: "Exam", cat: "CAT", revision: "Revision", deadline: "Deadline" };
        const pct = evProgressPct(ev);
        upcomingContainer.appendChild(el("div", { class: "event-row-item" }, [
          el("div", { style: "flex:1;" }, [
            el("div", { style: "display:flex;align-items:center;gap:8px;margin-bottom:2px;flex-wrap:wrap;" }, [
              el("span", { class: "event-badge " + ev.type }, [typeLabels[ev.type] || ev.type]),
              el("b", { style: "font-size:13.5px;" }, [ev.title]),
              ev.unit ? el("span", { class: "chip", style: "font-size:11px;" }, [ev.unit]) : null
            ]),
            el("div", { class: "muted", style: "font-size:12px;" }, ["📅 " + ev.date + (ev.note ? " · " + ev.note : "")]),
            ev.topics && ev.topics.length ? el("div", { style: "margin-top:8px;" }, [
              el("div", { style: "display:flex;justify-content:space-between;font-size:11.5px;margin-bottom:4px;" }, [
                el("span", { class: "faint" }, ["Study progress"]),
                el("b", { style: "color:" + (pct >= 100 ? "var(--success)" : "var(--accent)") }, [pct + "% complete"])
              ]),
              el("div", { style: "background:var(--border);border-radius:99px;height:7px;overflow:hidden;" }, [
                el("div", { style: "width:" + pct + "%;height:100%;background:" + (pct >= 100 ? "var(--success)" : "linear-gradient(90deg, #1A56F0, #0EA5E9)") + ";transition:width .4s ease;" })
              ]),
              el("button", { type: "button", class: "btn btn-ghost btn-sm", style: "margin-top:8px;font-size:12px;padding:4px 10px;", onclick: () => openTopicChecklist(ev) }, ["✓ Update topics (" + (ev.topics.filter(t => t.done).length) + "/" + ev.topics.length + ")"])
            ]) : el("button", { type: "button", class: "btn btn-ghost btn-sm", style: "margin-top:8px;font-size:12px;padding:4px 10px;", onclick: () => openTopicChecklist(ev) }, ["+ Add study topics checklist"])
          ]),
          el("button", {
            type: "button",
            class: "icon-btn",
            style: "width:24px;height:24px;font-size:12px;",
            title: "Delete event",
            onclick: () => {
              if (confirm("Delete '" + ev.title + "'?")) {
                events = events.filter(x => x.id !== ev.id);
                saveEvents(events);
                renderView();
              }
            }
          }, ["🗑"])
        ]));
      });
    }
    upcomingList.appendChild(upcomingContainer);

    const layout = el("div", { class: "planner-layout" }, [
      calContainer,
      upcomingList
    ]);

    root.append(topHeader, ttCard, layout);
  }

  // ---- timetable upload modal (photo stored locally, instant to re-open) ----
  function openTimetableModal() {
    const input = el("input", { type: "file", accept: "image/*", style: "display:none;" });
    input.addEventListener("change", () => {
      const file = input.files && input.files[0];
      if (!file) return;
      if (file.size > 4 * 1024 * 1024) {
        MedLink.toast("Image is too large — please pick one under 4MB.", "error");
        return;
      }
      const reader = new FileReader();
      reader.onload = () => {
        try {
          saveTimetable(String(reader.result));
          MedLink.toast("Timetable saved! You'll see it here every time.", "success");
          renderView();
        } catch (e) {
          MedLink.toast("Couldn't save the timetable — storage is full. Try a smaller image.", "error");
        }
      };
      reader.readAsDataURL(file);
    });
    input.click();
  }

  function buildCalendarCells(year, month) {
    const cells = [];
    const firstDay = new Date(year, month, 1).getDay();
    const daysInMonth = new Date(year, month + 1, 0).getDate();
    const todayStr = new Date().toISOString().split("T")[0];

    for (let i = 0; i < firstDay; i++) {
      cells.push(el("div", { class: "cal-box other-month" }));
    }

    for (let d = 1; d <= daysInMonth; d++) {
      const dStr = `${year}-${String(month + 1).padStart(2, '0')}-${String(d).padStart(2, '0')}`;
      const isToday = dStr === todayStr;
      const dayEvents = events.filter(e => e.date === dStr);

      const box = el("div", { class: "cal-box" + (isToday ? " today" : "") }, [
        el("div", { class: "cal-date-num" }, [String(d)])
      ]);

      dayEvents.forEach(ev => {
        const pct = evProgressPct(ev);
        const hasPlan = ev.topics && ev.topics.length;
        const badge = el("span", {
          class: "event-badge " + ev.type,
          title: ev.title + (ev.unit ? " (" + ev.unit + ")" : "") + " — " + (ev.note || "tap to update progress"),
          onclick: () => openTopicChecklist(ev),
        }, [ev.title + (hasPlan ? " · " + pct + "%" : "")]);
        box.appendChild(badge);
        if (hasPlan) {
          box.appendChild(el("div", { style: "height:4px;border-radius:99px;background:var(--border);overflow:hidden;margin-bottom:3px;" }, [
            el("div", { style: "width:" + pct + "%;height:100%;background:" + (pct >= 100 ? "var(--success)" : "var(--accent)") + ";" })
          ]));
        }
      });

      cells.push(box);
    }
    return cells;
  }

  function openAddEventModal() {
    const titleInput = el("input", { type: "text", placeholder: "e.g. Biochemistry CAT 2", required: true, maxlength: 80 });
    const unitList = unitOptions();
    const unitSelect = el("select", {}, [
      el("option", { value: "" }, ["— Choose the unit you're planning —"]),
      ...unitList.map(u => el("option", { value: u }, [u]))
    ]);
    const typeSelect = el("select", {}, [
      el("option", { value: "exam" }, ["Exam"]),
      el("option", { value: "cat" }, ["CAT / Test"]),
      el("option", { value: "revision" }, ["Group Revision"]),
      el("option", { value: "deadline" }, ["Assignment Deadline"])
    ]);
    const dateInput = el("input", { type: "date", required: true, value: new Date().toISOString().split("T")[0] });
    const noteInput = el("textarea", { rows: 2, placeholder: "Add notes, chapters or venue (optional)", maxlength: 160 });
    const topicsInput = el("textarea", { rows: 4, placeholder: "One topic or subtopic per line, e.g.\nGlycolysis & TCA cycle\nLipid metabolism", maxlength: 2000 });
    const countOut = el("span", { class: "faint", style: "font-size:11.5px;" }, ["Counts as you type"]);

    function pctPreview() {
      const n = topicsInput.value.split("\n").map(s => s.trim()).filter(Boolean).length;
      countOut.textContent = n ? n + " topic" + (n === 1 ? "" : "s") + " will start at 0%" : "Add topics to track progress (%)";
    }
    topicsInput.addEventListener("input", pctPreview);
    pctPreview();

    const form = el("form", { class: "form-stack", style: "margin-top:14px;" }, [
      el("div", { class: "field" }, [
        el("label", {}, ["Unit being planned ", el("span", { class: "req" }, ["*"])]),
        unitSelect,
        el("div", { class: "field-hint" }, ["Used to group your revision and match notes for this event."]),
        el("div", { class: "field-error hidden" }, ["Pick the unit this event belongs to."])
      ]),
      el("div", { class: "field" }, [
        el("label", {}, ["Event / Exam Title ", el("span", { class: "req" }, ["*"])]),
        titleInput
      ]),
      el("div", { class: "field" }, [
        el("label", {}, ["Category"]),
        typeSelect
      ]),
      el("div", { class: "field" }, [
        el("label", {}, ["Date of the exam / CAT / deadline ", el("span", { class: "req" }, ["*"])]),
        dateInput
      ]),
      el("div", { class: "field" }, [
        el("label", {}, ["Study checklist — topics to finish before that date"]),
        topicsInput,
        countOut
      ]),
      el("div", { class: "field" }, [
        el("label", {}, ["Notes / Details"]),
        noteInput
      ]),
      el("div", { class: "row-gap", style: "justify-content:flex-end;margin-top:16px;" }, [
        el("button", { type: "button", class: "btn btn-ghost", onclick: () => close() }, ["Cancel"]),
        el("button", { type: "submit", class: "btn btn-primary" }, ["Save study plan"])
      ])
    ]);

    form.addEventListener("submit", (e) => {
      e.preventDefault();
      const title = titleInput.value.trim();
      const date = dateInput.value;
      const unit = unitSelect.value;
      if (!unit) { unitSelect.parentElement.querySelector(".field-error").classList.remove("hidden"); unitSelect.focus(); return; }
      if (!title || !date) return;

      const topics = topicsInput.value.split("\n").map(s => s.trim()).filter(Boolean).map(label => ({ label, done: false }));

      events.push({
        id: "ev_" + Date.now(),
        title,
        unit,
        type: typeSelect.value,
        date,
        note: noteInput.value.trim(),
        topics
      });

      persist();
      close();
      MedLink.toast(topics.length ? "Study plan saved with " + topics.length + " topics to track." : "Event added — add topics any time.", "success");
    });

    const close = MedLink.modal("Plan a unit · exam, CAT or assignment", form);
  }

  renderView();
});
</script>
</body>
</html>
