<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#FFFFFF">
<title>Communities — MedLink KE</title>
<script src="theme.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="styles.css">
</head>
<body>
<main id="page" hidden>
<div class="fade-in" id="root"></div>
</main>

<script src="config.js"></script>
<script src="data.js"></script>
<script src="app.js"></script>
<script>
MedLink.run({ page: "communities" }, async ({ api, me }) => {
  const root = qs("#root");
  const communityId = param("c");
  const unit = param("unit");

  // ---- a unit study group ----
  if (unit) {
    document.title = unit + " — MedLink KE";
    const feed = el("div", { class: "feed-list" }, [MedLink.loadingState()]);
    const stats = el("div", { class: "faint", style: "font-size:12.5px;" }, ["…"]);
    const inMyUnits = me.current_units.includes(unit);
    root.replaceChildren(...[
      el("a", { href: "units.html", class: "btn btn-ghost", style: "margin-bottom:16px;" }, ["‹ My units"]),
      el("div", { class: "row-gap", style: "margin-bottom:18px;flex-wrap:wrap;" }, [
        el("div", { class: "avatar lg", style: "background:var(--panel);" }, ["🩺"]),
        el("div", { style: "flex:1;min-width:150px;" }, [
          el("div", { class: "eyebrow-text" }, ["Unit study group"]),
          el("h1", { class: "disp", style: "font-size:22px;" }, [unit]),
          stats,
        ]),
        el("a", { class: "btn btn-ghost", href: "study.html?unit=" + encodeURIComponent(unit) }, ["📚 Unit notes"]),
      ]),
      inMyUnits ? null : el("p", { class: "muted", style: "font-size:13px;" }, ["This isn't one of your current units — you can still read and post."]),
      el("div", { style: "margin-bottom:12px;" }, [MedLink.composerNode({
        unit, placeholder: `Ask the ${unit} group something…`,
        onPosted: post => { qs(".empty-state", feed)?.remove(); feed.prepend(MedLink.feedPostNode(post, { liked: new Set() })); },
      })]),
      feed,
    ].filter(Boolean));
    api.unitStats(unit).then(s => { stats.textContent = `${plural(s.members, "student")} taking it · ${plural(s.resources, "resource")}`; }).catch(() => {});
    await MedLink.renderPosts(feed, await api.posts({ unit, limit: 40 }), "No posts in this group yet — start the conversation.");
    return;
  }

  // ---- a single community ----
  if (communityId) {
    const [c, joined] = await Promise.all([api.community(communityId), api.myCommunityIds()]);
    if (!c) {
      root.replaceChildren(MedLink.emptyState("That community doesn't exist.", el("a", { href: "communities.html", class: "btn btn-ghost btn-sm" }, ["All communities"])));
      return;
    }
    document.title = c.name + " — MedLink KE";
    let isMember = joined.has(c.id);
    let members = count(c.community_members);
    const memberLabel = el("div", { class: "faint", style: "font-size:12.5px;" });
    const joinBtn = el("button", { type: "button" });
    const paint = () => {
      memberLabel.textContent = plural(members, "member");
      joinBtn.className = isMember ? "btn btn-ghost" : "btn btn-primary";
      joinBtn.textContent = isMember ? "Joined ✓" : "Join community";
    };
    paint();
    joinBtn.addEventListener("click", async () => {
      joinBtn.disabled = true;
      try {
        isMember = !isMember; members += isMember ? 1 : -1; paint();
        await api.setMember(c.id, isMember);
      } catch (err) { isMember = !isMember; members += isMember ? 1 : -1; paint(); MedLink.reportError(err); }
      joinBtn.disabled = false;
    });
    const feed = el("div", { class: "feed-list" }, [MedLink.loadingState()]);
    root.replaceChildren(
      el("a", { href: "communities.html", class: "btn btn-ghost", style: "margin-bottom:16px;" }, ["‹ All communities"]),
      el("div", { class: "row-gap", style: "margin-bottom:14px;flex-wrap:wrap;" }, [
        el("div", { class: "avatar lg", style: "background:var(--panel);" }, [c.name.charAt(0)]),
        el("div", { style: "flex:1;min-width:150px;" }, [el("h1", { class: "disp", style: "font-size:22px;" }, [c.name]), memberLabel]),
        joinBtn,
      ]),
      el("p", { class: "muted", style: "font-size:14px;margin:0 0 18px;" }, [c.description]),
      el("div", { style: "margin-bottom:12px;" }, [MedLink.composerNode({
        communityId: c.id, placeholder: `Post to ${c.name}…`,
        onPosted: post => { qs(".empty-state", feed)?.remove(); feed.prepend(MedLink.feedPostNode(post, { liked: new Set() })); },
      })]),
      feed,
    );
    await MedLink.renderPosts(feed, await api.posts({ communityId: c.id, limit: 40 }), "No posts yet — say hello!");
    return;
  }

  // ---- all communities ----
  const grid = el("div", { class: "grid grid-fill-260" }, [MedLink.loadingState()]);
  const unitRow = el("div", { class: "wrap-gap", style: "margin-bottom:26px;" },
    me.current_units.map(u => el("a", { class: "chip", href: "communities.html?unit=" + encodeURIComponent(u), style: "font-size:13px;padding:8px 14px;" }, ["🩺 " + u])));
  root.replaceChildren(
    el("h1", { class: "disp", style: "font-size:24px;margin:0 0 20px;" }, ["Communities"]),
    ...(me.current_units.length ? [el("div", { class: "section-heading" }, [el("h2", {}, ["Your unit groups"])]), unitRow] : []),
    el("div", { class: "section-heading" }, [el("h2", {}, ["Communities"])]),
    grid,
  );
  const [list, joined] = await Promise.all([api.communities(), api.myCommunityIds()]);
  grid.replaceChildren(...list.map(c => MedLink.communityCardNode(c, joined.has(c.id))));
});
</script>
</body>
</html>
