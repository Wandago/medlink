<script>
  const params = new URLSearchParams(location.search);
  const root = document.getElementById("root");
  const community = COMMUNITIES.find(c => c.id === params.get("c"));

  if (community) {
    root.innerHTML = `
      <a href="communities.html" class="btn btn-ghost" style="margin-bottom:16px;">‹ All communities</a>
      <div class="row-gap" style="margin-bottom:20px;flex-wrap:wrap;">
        <div class="avatar lg" style="background:var(--panel);">${community.name[0]}</div>
        <div style="flex:1;min-width:150px;">
          <h1 class="disp" style="font-size:22px;">${escapeHtml(community.name)}</h1>
          <div class="faint" style="font-size:12.5px;">${community.members.toLocaleString()} members</div>
        </div>
        <button class="btn btn-primary" id="joinBtn">Joined ✓</button>
      </div>
      <p class="muted" style="font-size:14px;margin-bottom:22px;">${escapeHtml(community.desc)}</p>
      <div id="feed" style="display:flex;flex-direction:column;gap:12px;"></div>`;
    const feed = document.getElementById("feed");
    FEED.forEach(p => feed.appendChild(feedPostNode(p)));
    document.getElementById("joinBtn").addEventListener("click", e => {
      const joined = e.target.textContent.trim().startsWith("Joined");
      e.target.textContent = joined ? "Join community" : "Joined ✓";
      e.target.className = joined ? "btn btn-ghost" : "btn btn-primary";
    });
  } else {
    root.innerHTML = `<h1 class="disp" style="font-size:24px;margin:0 0 20px;">Communities</h1><div class="grid grid-fill-260" id="grid"></div>`;
    const grid = document.getElementById("grid");
    COMMUNITIES.forEach(c => {
      const card = el("a", { href: `communities.html?c=${c.id}`, class: "card pad", style: "display:block;" });
      card.innerHTML = `
        <div class="avatar md" style="background:var(--panel);">${c.name[0]}</div>
        <div style="font-weight:700;font-size:15px;margin:12px 0 4px;">${escapeHtml(c.name)}</div>
        <div class="faint" style="font-size:12.5px;margin-bottom:10px;">${c.members.toLocaleString()} members</div>
        <div class="muted" style="font-size:12.5px;line-height:1.5;margin-bottom:14px;">${escapeHtml(c.desc)}</div>
        <span class="btn btn-ghost btn-block">View community</span>`;
      grid.appendChild(card);
    });
  }
</script>
