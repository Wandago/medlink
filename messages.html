<div class="fade-in card messages-shell">
  <div class="conv-list" id="convList">
    <div style="padding:16px;font-weight:700;font-size:15px;">Messages</div>
    <div class="msg-search-wrap">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
      <input type="text" id="userSearch" placeholder="Find @username to message">

<nav class="bottom-nav">

  <a href="exams.html" class=""><span class="bn-icon">📝</span>Exams</a>
  <a href="communities.html" class=""><span class="bn-icon">👥</span>Groups</a>
  <a href="profile.html" class="" data-profile-link><span class="bn-icon">👤</span>Profile</a>
</nav>

<script>
  let conversations = getConversations();
  let openId = sessionStorage.getItem("medlink_open_conv_hint");
  sessionStorage.removeItem("medlink_open_conv_hint");
  const isMobile = () => window.innerWidth <= 860;
  if (!openId && conversations.length && !isMobile()) openId = conversations[0].id;

  const listEl = document.getElementById("convList");
  const threadEl = document.getElementById("convThread");
  const search = document.getElementById("userSearch");

  function renderItems() {
    const box = document.getElementById("convItems");
    box.innerHTML = "";
    const q = search.value.trim().toLowerCase();
    if (q) {
      const me = getMe();
      const found = allUsers().filter(u => u.id !== me.id &&
        (u.username.toLowerCase().includes(q) || u.fullName.toLowerCase().includes(q))).slice(0, 6);
      if (!found.length) box.appendChild(el("div", { class: "faint", style: "padding:10px 16px;font-size:12.5px;" }, [`No students match "${search.value}".`]));
      found.forEach(u => {
        const row = el("div", { style: "display:flex;gap:10px;padding:10px 16px;align-items:center;" });
        row.innerHTML = `
          <div class="avatar sm" style="background:${u.color}">${initials(u.fullName)}</div>
          <a href="profile.html?u=${encodeURIComponent(u.username)}" style="flex:1;min-width:0;">
            <div style="font-size:12.5px;font-weight:700;">${escapeHtml(u.fullName)}</div>
            <div class="faint" style="font-size:11px;">@${escapeHtml(u.username)}</div>
          </a>
          <button class="btn btn-ghost btn-sm msgBtn">Message</button>`;
        qs(".msgBtn", row).addEventListener("click", () => {
          openId = startConversation(u.id);
          conversations = getConversations();
          search.value = "";
          renderAll();
        });
        box.appendChild(row);
      });
      return;
    }
    conversations.forEach(c => {
      const u = getUserById(c.userId);
      if (!u) return;
      const row = el("div", { class: "conv-item" + (c.id === openId ? " active" : "") });
      row.innerHTML = `
        <div class="avatar sm" style="background:${u.color}">${initials(u.fullName)}</div>
        <div style="flex:1;min-width:0;">
          <div style="font-size:13px;font-weight:700;">${escapeHtml(u.fullName)}</div>
          <div class="faint" style="font-size:11.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;">${escapeHtml(c.last || "Say hello 👋")}</div>
        </div>
        ${c.unread > 0 ? `<span style="background:var(--coral);color:#fff;font-size:10px;font-weight:700;border-radius:999px;padding:2px 6px;">${c.unread}</span>` : ""}`;
      row.addEventListener("click", () => { openId = c.id; renderAll(); });
      box.appendChild(row);
    });
  }

  function renderThread() {
    threadEl.innerHTML = "";
    const conv = conversations.find(c => c.id === openId);
    const u = conv ? getUserById(conv.userId) : null;
    if (!conv || !u) {
      threadEl.appendChild(el("div", { class: "faint", style: "flex:1;display:flex;align-items:center;justify-content:center;font-size:13.5px;padding:20px;text-align:center;" },
        ["Pick a conversation, or search a username to start a new one."]));
      return;
    }
    const header = el("div", { class: "thread-header" });
    header.innerHTML = `
      <button class="icon-btn backToList" style="${isMobile() ? "" : "display:none;"}">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="15 18 9 12 15 6"/></svg>
      </button>
      <div class="avatar sm" style="background:${u.color}">${initials(u.fullName)}</div>
      <a href="profile.html?u=${encodeURIComponent(u.username)}">${escapeHtml(u.fullName)}
        <span class="faint" style="font-weight:400;font-size:12.5px;">@${escapeHtml(u.username)}</span></a>`;
    qs(".backToList", header).addEventListener("click", () => { openId = null; renderAll(); });

    const body = el("div", { class: "thread-body" });
    conv.thread.forEach(m => body.appendChild(el("div", { class: "bubble " + (m.from === "me" ? "me" : "them") }, [m.text])));

    const inputRow = el("div", { class: "thread-input" });
    const input = el("input", { type: "text", placeholder: "Write a message…" });
    const send = el("button", { class: "btn btn-primary" }, ["Send"]);
    function doSend() {
      if (!input.value.trim()) return;
      conversations = sendMessage(conv.id, input.value.trim());
      input.value = "";
      renderAll();
    }
    send.addEventListener("click", doSend);
    input.addEventListener("keydown", e => { if (e.key === "Enter") doSend(); });
    inputRow.appendChild(input); inputRow.appendChild(send);

    threadEl.appendChild(header); threadEl.appendChild(body); threadEl.appendChild(inputRow);
    body.scrollTop = body.scrollHeight;
  }

  function renderAll() {
    renderItems(); renderThread();
    if (isMobile()) {
      listEl.style.display = openId ? "none" : "block";
      threadEl.style.display = openId ? "flex" : "none";
    } else {
      listEl.style.display = "block";
      threadEl.style.display = "flex";
    }
  }
  search.addEventListener("input", renderItems);
  window.addEventListener("resize", renderAll);
  renderAll();
</script>

</body>
</html>
