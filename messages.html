<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#FFFFFF">
<title>Messages — MedLink KE</title>
<script src="theme.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="styles.css">
</head>
<body>
<main id="page" hidden>
<div class="fade-in card messages-shell">
  <div class="conv-list" id="convList">
    <div style="padding:16px;font-weight:700;font-size:15px;">Messages</div>
    <div class="msg-search-wrap">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
      <input type="text" id="userSearch" placeholder="Find @username to message" aria-label="Find a student to message">
    </div>
    <div id="convItems"></div>
  </div>
  <div class="conv-thread" id="convThread"></div>
</div>
</main>

<script src="config.js"></script>
<script src="data.js"></script>
<script src="app.js"></script>
<script>
MedLink.run({ page: "messages" }, async ({ api, me }) => {
  const POLL_MS = 5000;
  const listEl = qs("#convList"), threadEl = qs("#convThread"), itemsEl = qs("#convItems"), search = qs("#userSearch");
  const isMobile = () => window.innerWidth <= 860;
  let messages = [];
  const people = new Map();       // id -> profile
  let openId = null;
  let signature = "";

  const otherOf = m => (m.sender_id === me.id ? m.recipient_id : m.sender_id);

  async function refresh() {
    messages = await api.myMessages();
    const missing = [...new Set(messages.map(otherOf))].filter(id => !people.has(id));
    if (missing.length) (await api.profilesByIds(missing)).forEach(p => people.set(p.id, p));
    const sig = messages.length + ":" + (messages[0] ? messages[0].id + messages.filter(m => !m.read_at).length : "");
    const changed = sig !== signature;
    signature = sig;
    return changed;
  }

  function conversations() {
    const byOther = new Map();
    messages.forEach(m => {  // newest first
      const o = otherOf(m);
      if (!byOther.has(o)) byOther.set(o, { otherId: o, last: m, unread: 0 });
      if (m.recipient_id === me.id && !m.read_at) byOther.get(o).unread += 1;
    });
    if (openId && !byOther.has(openId)) byOther.set(openId, { otherId: openId, last: null, unread: 0 });
    return [...byOther.values()].sort((a, b) => (b.last ? +new Date(b.last.created_at) : Infinity) - (a.last ? +new Date(a.last.created_at) : Infinity));
  }

  let searchSeq = 0;
  async function renderItems() {
    const q = search.value.trim();
    if (q) {
      const mySeq = ++searchSeq;
      itemsEl.replaceChildren(MedLink.loadingState());
      let found = [];
      try { found = (await api.search(q)).profiles.slice(0, 8); } catch (err) { MedLink.reportError(err); }
      if (mySeq !== searchSeq) return;
      itemsEl.replaceChildren(...(found.length ? found.map(u => el("div", { class: "conv-item" }, [
        MedLink.avatarNode(u, "sm"),
        el("a", { href: profileHref(u), style: "flex:1;min-width:0;" }, [
          el("div", { style: "font-size:12.5px;font-weight:700;" }, [u.full_name]),
          el("div", { class: "faint", style: "font-size:11px;" }, ["@" + u.username]),
        ]),
        el("button", { class: "btn btn-ghost btn-sm", type: "button", onclick: () => { people.set(u.id, u); search.value = ""; open(u.id); } }, ["Message"]),
      ])) : [el("div", { class: "faint", style: "padding:10px 16px;font-size:12.5px;" }, [`No students match "${q}".`])]));
      return;
    }
    const convs = conversations();
    if (!convs.length) {
      itemsEl.replaceChildren(el("div", { class: "faint", style: "padding:10px 16px;font-size:12.5px;line-height:1.5;" },
        ["No conversations yet. Search a username above, or tap Message on someone's profile."]));
      return;
    }
    itemsEl.replaceChildren(...convs.map(c => {
      const u = people.get(c.otherId);
      if (!u) return null;
      return el("button", { type: "button", class: "conv-item" + (c.otherId === openId ? " active" : ""), onclick: () => open(c.otherId) }, [
        MedLink.avatarNode(u, "sm"),
        el("div", { style: "flex:1;min-width:0;text-align:left;" }, [
          el("div", { style: "font-size:13px;font-weight:700;" }, [u.full_name]),
          el("div", { class: "faint conv-last" }, [c.last ? (c.last.sender_id === me.id ? "You: " : "") + c.last.body : "Say hello 👋"]),
        ]),
        c.unread ? el("span", { class: "nav-badge" }, [String(c.unread)]) : null,
      ]);
    }).filter(Boolean));
  }

  let draft = "";
  function renderThread() {
    const u = openId ? people.get(openId) : null;
    if (!u) {
      threadEl.replaceChildren(el("div", { class: "faint thread-empty" }, ["Pick a conversation, or search a username to start a new one."]));
      return;
    }
    const prevInput = qs("input", threadEl);
    if (prevInput) draft = prevInput.value;
    const header = el("div", { class: "thread-header" }, [
      el("button", { class: "icon-btn", type: "button", "aria-label": "Back to conversations", style: isMobile() ? "" : "display:none;", onclick: () => { openId = null; renderAll(); } }, ["‹"]),
      MedLink.avatarNode(u, "sm", true),
      el("a", { href: profileHref(u) }, [u.full_name + " ", el("span", { class: "faint", style: "font-weight:400;font-size:12.5px;" }, ["@" + u.username])]),
    ]);
    const thread = messages.filter(m => otherOf(m) === openId).slice().reverse();
    const body = el("div", { class: "thread-body" }, thread.length
      ? thread.map(m => el("div", { class: "bubble " + (m.sender_id === me.id ? "me" : "them"), title: new Date(m.created_at).toLocaleString() }, [m.body]))
      : [el("div", { class: "faint", style: "margin:auto;font-size:13px;" }, [`Start your conversation with ${u.full_name.split(" ")[0]}.`])]);
    const input = el("input", { type: "text", maxlength: "2000", placeholder: "Write a message…", "aria-label": "Write a message" });
    input.value = draft;
    const send = el("button", { class: "btn btn-primary", type: "submit" }, ["Send"]);
    const form = el("form", { class: "thread-input" }, [input, send]);
    form.addEventListener("submit", async e => {
      e.preventDefault();
      const text = input.value.trim();
      if (!text) return;
      send.disabled = true;
      try {
        const m = await api.sendMessage(openId, text);
        messages.unshift(m);
        draft = "";
        renderAll(true);
      } catch (err) { MedLink.reportError(err); send.disabled = false; }
    });
    threadEl.replaceChildren(header, body, form);
    body.scrollTop = body.scrollHeight;
    if (!isMobile() || openId) input.focus({ preventScroll: true });
  }

  function renderAll(skipItems) {
    if (!skipItems || !search.value.trim()) renderItems();
    renderThread();
    if (isMobile()) {
      listEl.style.display = openId ? "none" : "block";
      threadEl.style.display = openId ? "flex" : "none";
    } else {
      listEl.style.display = "block";
      threadEl.style.display = "flex";
    }
  }

  async function open(id) {
    openId = id;
    draft = "";
    const unread = messages.some(m => m.sender_id === id && m.recipient_id === me.id && !m.read_at);
    renderAll();
    if (unread) {
      try {
        await api.markRead(id);
        const now = new Date().toISOString();
        messages.forEach(m => { if (m.sender_id === id && m.recipient_id === me.id && !m.read_at) m.read_at = now; });
        renderItems();
      } catch (err) { console.warn(err); }
    }
  }

  let searchTimer;
  search.addEventListener("input", () => { clearTimeout(searchTimer); searchTimer = setTimeout(renderItems, 250); });
  window.addEventListener("resize", () => renderAll());

  itemsEl.replaceChildren(MedLink.loadingState());
  await refresh();
  const to = param("to");
  if (to && to !== me.username) {
    const u = await api.profileByUsername(to);
    if (u) { people.set(u.id, u); await open(u.id); }
    else MedLink.toast("That user doesn't exist.", "error");
  } else if (!isMobile()) {
    const first = conversations()[0];
    if (first) await open(first.otherId); else renderAll();
  } else {
    renderAll();
  }

  setInterval(async () => {
    if (document.hidden) return;
    try {
      if (await refresh()) {
        renderAll();
        if (openId && messages.some(m => m.sender_id === openId && m.recipient_id === me.id && !m.read_at)) await open(openId);
      }
    } catch (err) { console.warn(err); }
  }, POLL_MS);
});
</script>
</body>
</html>
