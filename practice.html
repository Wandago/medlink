<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#FFFFFF">
<title>Practice — MedLink KE</title>
<script src="theme.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="styles.css">
</head>
<body>
<main id="page" hidden>
<div class="fade-in" style="max-width:620px;">
  <a href="exams.html" class="btn btn-ghost" style="margin-bottom:16px;">‹ Exit practice</a>
  <div class="row" style="justify-content:space-between;margin-bottom:14px;gap:10px;">
    <span class="chip" id="examTitle"></span>
    <span style="font-size:13px;font-weight:700;color:var(--text-2);" id="scoreLabel"></span>
  </div>
  <div class="card" style="padding:24px;" id="quizCard">
    <div class="handle" style="font-size:12px;font-weight:700;margin-bottom:10px;" id="qLabel"></div>
    <div style="font-size:16px;font-weight:600;line-height:1.5;margin-bottom:20px;" id="qText"></div>
    <div id="options"></div>
    <div class="quiz-explain hidden" id="explain"></div>
    <div style="margin-top:18px;text-align:right;">
      <button class="btn btn-primary" id="nextQ" type="button" disabled>Next question ›</button>
    </div>
  </div>
</div>
</main>

<script src="config.js"></script>
<script src="data.js"></script>
<script src="app.js"></script>
<script>
MedLink.run({ page: "exams" }, async () => {
  const examSet = EXAM_SETS.find(e => e.id === param("id")) || EXAM_SETS[0];
  qs("#examTitle").textContent = examSet.title;
  const total = SAMPLE_QUIZ.length;
  let idx = 0, picked = null, score = 0;

  function render() {
    if (idx >= total) {
      qs("#scoreLabel").textContent = `Score: ${score}/${total}`;
      MedLink.track("quiz_complete", { exam: examSet.id, score, total, percent: Math.round(score / total * 100) });
      qs("#quizCard").replaceChildren(
        el("h2", { class: "disp", style: "font-size:20px;margin:0 0 8px;" }, [`You scored ${score} out of ${total}`]),
        el("p", { class: "muted", style: "margin:0 0 18px;" }, [score === total ? "Perfect — well done! 🎉" : "Review the explanations and try again."]),
        el("div", { class: "row-gap" }, [
          el("button", { class: "btn btn-primary", type: "button", onclick: () => location.reload() }, ["Try again"]),
          el("a", { class: "btn btn-ghost", href: "exams.html" }, ["Back to Exam Bank"]),
        ]),
      );
      return;
    }
    const cur = SAMPLE_QUIZ[idx];
    qs("#scoreLabel").textContent = `Score: ${score}/${idx + (picked !== null ? 1 : 0)}`;
    qs("#qLabel").textContent = `QUESTION ${idx + 1} OF ${total}`;
    qs("#qText").textContent = cur.q;
    qs("#options").replaceChildren(...cur.options.map((o, i) => {
      const btn = el("button", { class: "quiz-option", type: "button" }, [o]);
      if (picked !== null) {
        if (i === cur.correct) btn.classList.add("correct");
        else if (i === picked) btn.classList.add("incorrect");
      }
      btn.addEventListener("click", () => {
        if (picked !== null) return;
        picked = i;
        if (i === cur.correct) score += 1;
        if (idx === 0) MedLink.track("quiz_start", { exam: examSet.id });
        render();
      });
      return btn;
    }));
    const ex = qs("#explain");
    if (picked !== null) {
      ex.classList.remove("hidden");
      ex.replaceChildren(el("strong", {}, [picked === cur.correct ? "Correct — " : "Not quite — "]), cur.explain);
    } else ex.classList.add("hidden");
    const next = qs("#nextQ");
    next.disabled = picked === null;
    next.textContent = idx === total - 1 ? "See results ›" : "Next question ›";
  }
  qs("#nextQ").addEventListener("click", () => {
    if (picked === null) return;
    picked = null; idx += 1; render();
  });
  render();
});
</script>
</body>
</html>
