<script>
  const params = new URLSearchParams(location.search);
  const examSet = EXAM_SETS.find(e => e.id === params.get("id")) || EXAM_SETS[0];
  document.getElementById("examTitle").textContent = examSet.title;
  let idx = 0, picked = null, score = 0;
  const q = () => SAMPLE_QUIZ[idx % SAMPLE_QUIZ.length];
  function render() {
    const cur = q();
    document.getElementById("scoreLabel").textContent = `Score: ${score}/${idx + (picked !== null ? 1 : 0)}`;
    document.getElementById("qLabel").textContent = `QUESTION ${idx % SAMPLE_QUIZ.length + 1} OF ${SAMPLE_QUIZ.length}`;
    document.getElementById("qText").textContent = cur.q;
    const list = document.getElementById("options");
    list.innerHTML = "";
    cur.options.forEach((o, i) => {
      const btn = el("button", { class: "quiz-option" }, [o]);
      if (picked !== null) {
        if (i === cur.correct) btn.classList.add("correct");
        else if (i === picked) btn.classList.add("incorrect");
      }
      btn.addEventListener("click", () => {
        if (picked !== null) return;
        picked = i;
        if (i === cur.correct) score += 1;
        render();
      });
      list.appendChild(btn);
    });
    const ex = document.getElementById("explain");
    if (picked !== null) {
      ex.classList.remove("hidden");
      ex.innerHTML = `<strong style="color:var(--ink);">${picked === cur.correct ? "Correct — " : "Not quite — "}</strong>${escapeHtml(cur.explain)}`;
    } else ex.classList.add("hidden");
    document.getElementById("nextQ").disabled = picked === null;
  }
  document.getElementById("nextQ").addEventListener("click", () => {
    if (picked === null) return;
    picked = null; idx += 1; render();
  });
  render();
</script>
