<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#FFFFFF">
<title>Resource — MedLink KE</title>
<script src="theme.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="styles.css">
</head>
<body>
<main id="page" hidden>
<div class="fade-in" style="max-width:820px;">
  <a href="study.html" class="btn btn-ghost" style="margin-bottom:16px;">‹ Back to library</a>
  <div class="card" style="padding:26px;" id="detail"></div>
</div>
</main>

<script src="config.js"></script>
<script src="data.js"></script>
<script src="app.js"></script>
<script>
MedLink.run({ page: "study" }, async ({ api, me }) => {
  const detail = qs("#detail");
  detail.appendChild(MedLink.loadingState());
  const id = param("id");
  const r = id && /^[0-9a-f-]{36}$/i.test(id) ? await api.resource(id) : null;
  if (!r) {
    detail.replaceChildren(MedLink.emptyState("That resource doesn't exist or was removed.",
      el("a", { href: "study.html", class: "btn btn-ghost btn-sm" }, ["Back to library"])));
    return;
  }
  document.title = r.title + " — MedLink KE";
  api.incrementViews(r.id).catch(() => {});

  const author = r.author;
  const saved = await api.savedIds();
  let isSaved = saved.has(r.id);
  let saves = count(r.saved_resources);
  const viewUrl = api.fileUrl(r.file_path);
  const downloadUrl = api.fileUrl(r.file_path, true);

  let preview;
  if (r.file_type === "application/pdf") {
    preview = el("iframe", { class: "doc-preview", src: viewUrl, title: "Preview of " + r.title, loading: "lazy" });
  } else if (/^image\//.test(r.file_type)) {
    preview = el("img", { class: "doc-preview doc-preview-img", src: viewUrl, alt: r.title });
  } else {
    preview = el("div", { class: "doc-placeholder" }, [
      `${MedLink.fileExt(r.file_name)} file — ${r.file_name} ${formatBytes(r.file_size) ? "(" + formatBytes(r.file_size) + ")" : ""}`,
      el("br"), "Preview isn't available for this format — download to open it.",
    ]);
  }

  const saveBtn = el("button", { class: "btn btn-ghost", type: "button" });
  const paintSave = () => { saveBtn.textContent = (isSaved ? "✓ Saved" : "🔖 Save") + " · " + saves; };
  paintSave();
  saveBtn.addEventListener("click", async () => {
    saveBtn.disabled = true;
    try {
      isSaved = !isSaved; saves += isSaved ? 1 : -1; paintSave();
      await api.setSaved(r.id, isSaved);
    } catch (err) { isSaved = !isSaved; saves += isSaved ? 1 : -1; paintSave(); MedLink.reportError(err); }
    saveBtn.disabled = false;
  });

  const shareBtn = el("button", { class: "btn btn-ghost", type: "button", onclick: async () => {
    const url = location.href;
    try {
      if (navigator.share) await navigator.share({ title: r.title, url });
      else { await navigator.clipboard.writeText(url); MedLink.toast("Link copied."); }
    } catch (e) { /* share sheet dismissed */ }
  } }, ["↗ Share"]);

  const actions = el("div", { class: "wrap-gap" }, [
    el("a", { class: "btn btn-primary", href: downloadUrl, rel: "noopener" }, ["↓ Download"]),
    el("a", { class: "btn btn-ghost", href: viewUrl, target: "_blank", rel: "noopener" }, ["Open in new tab"]),
    saveBtn, shareBtn,
  ]);
  if (author && author.id === me.id) {
    actions.appendChild(el("button", { class: "btn btn-ghost btn-danger", type: "button", onclick: async () => {
      if (!confirm("Delete this resource? This can't be undone.")) return;
      try { await api.deleteResource(r); MedLink.toast("Resource deleted."); MedLink.go("study.html"); }
      catch (err) { MedLink.reportError(err); }
    } }, ["Delete"]));
  } else {
    actions.appendChild(el("button", { class: "btn btn-ghost btn-danger", type: "button", onclick: async () => {
      const reason = prompt("What's wrong with this resource? (copyright, wrong unit, spam…)");
      if (reason === null) return;
      try { await api.report(r.id, reason.slice(0, 500)); MedLink.toast("Thanks — a moderator will review it."); }
      catch (err) { MedLink.reportError(err); }
    } }, ["Report"]));
  }

  detail.replaceChildren(...[
    el("span", { class: "chip" }, [r.type]),
    el("h1", { class: "disp", style: "font-size:24px;margin:12px 0 6px;" }, [r.title]),
    el("div", { class: "faint", style: "font-size:13px;margin-bottom:14px;" }, [
      el("a", { href: "study.html?unit=" + encodeURIComponent(r.unit), class: "handle" }, [r.unit]),
      " · Uploaded by ",
      author ? el("a", { href: profileHref(author), class: "handle" }, [author.full_name + " (@" + author.username + ")"]) : "a MedLink student",
      author ? " · " + uniAbbr(author.university_id) : "",
      " · " + timeAgo(r.created_at),
    ]),
    el("div", { class: "row-gap", style: "gap:22px;font-size:13px;margin-bottom:18px;" }, [
      el("span", { class: "muted" }, [(r.views + 1).toLocaleString() + " views"]),
      el("span", { class: "muted" }, [formatBytes(r.file_size)]),
    ]),
    r.description ? el("p", { class: "muted resource-desc" }, [r.description]) : null,
    preview,
    actions,
  ].filter(Boolean));
});
</script>
</body>
</html>
