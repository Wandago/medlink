<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="icon" href="favicon.ico" sizes="any">
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="manifest" href="site.webmanifest">
<meta name="theme-color" content="#FFFFFF">
<title>Profile — MedLink KE</title>
<script src="theme.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="styles.css">
</head>
<body>
<main id="page" hidden>
<div class="fade-in" style="max-width:680px;" id="root"></div>
</main>

<script src="config.js"></script>
<script src="data.js"></script>
<script src="app.js"></script>
<script>
MedLink.run({ page: "profile" }, async ({ api, me }) => {
  const root = qs("#root");
  root.appendChild(MedLink.loadingState());
  const username = param("u") || me.username;
  const user = username === me.username ? me : await api.profileByUsername(username);
  if (!user) {
    root.replaceChildren(MedLink.emptyState("That student profile doesn't exist.", el("a", { href: "discover.html", class: "btn btn-ghost btn-sm" }, ["Browse students"])));
    return;
  }
  const isMe = user.id === me.id;
  if (!isMe) qsa(".nav-item.active, .bottom-nav a.active").forEach(a => a.classList.remove("active"));
  document.title = user.full_name + " — MedLink KE";

  const [counts, points, following] = await Promise.all([api.followCounts(user.id), api.medPoints(user.id), api.followingIds()]);
  let followers = counts.followers;
  let isFollowing = following.has(user.id);
  const followersEl = el("strong", {}, [String(followers)]);

  const actions = el("div", { class: "row-gap" });
  if (isMe) {
    actions.append(el("a", { href: "settings.html", class: "btn btn-ghost" }, ["Edit profile"]));
  } else {
    const followBtn = el("button", { type: "button" });
    const paint = () => { followBtn.className = "btn " + (isFollowing ? "btn-ghost" : "btn-primary"); followBtn.textContent = isFollowing ? "Following" : "Follow"; followersEl.textContent = String(followers); };
    paint();
    followBtn.addEventListener("click", async () => {
      followBtn.disabled = true;
      try { isFollowing = !isFollowing; followers += isFollowing ? 1 : -1; paint(); await api.setFollowing(user.id, isFollowing); }
      catch (err) { isFollowing = !isFollowing; followers += isFollowing ? 1 : -1; paint(); MedLink.reportError(err); }
      followBtn.disabled = false;
    });
    actions.append(followBtn, el("a", { class: "btn btn-ghost", href: "messages.html?to=" + encodeURIComponent(user.username) }, ["Message"]));
  }

  const chips = (list, cls, emptyText) => list.length
    ? el("div", { class: "wrap-gap" }, list.map(x => el("span", { class: cls }, [x])))
    : el("span", { class: "faint", style: "font-size:13px;" }, [emptyText]);

  const header = el("div", { class: "card profile-header" }, [
    el("div", { class: "profile-top" }, [
      MedLink.avatarNode(user, "xl"),
      el("div", { style: "flex:1;min-width:170px;" }, [
        el("h1", { class: "disp", style: "font-size:22px;" }, [user.full_name]),
        el("div", { class: "handle", style: "font-size:13.5px;" }, ["@" + user.username]),
        el("div", { class: "faint", style: "font-size:12.5px;" }, [`${courseName(user.course_id)} · ${user.year} · ${uniName(user.university_id)}`]),
      ]),
      actions,
    ]),
    user.bio ? el("p", { class: "muted profile-bio" }, [user.bio]) : null,
    el("div", { class: "profile-stats" }, [
      el("span", {}, [followersEl, " ", el("span", { class: "faint" }, ["Followers"])]),
      el("span", {}, [el("strong", {}, [String(counts.following)]), " ", el("span", { class: "faint" }, ["Following"])]),
      el("span", {}, [el("strong", {}, [points.toLocaleString()]), " ", el("span", { class: "faint" }, ["MedPoints"])]),
    ]),
    el("div", { style: "margin-bottom:10px;" }, [
      el("div", { class: "eyebrow-text", style: "margin-bottom:8px;" }, ["Currently studying"]),
      chips(user.current_units, "chip", "No units listed."),
    ]),
    el("div", {}, [
      el("div", { class: "eyebrow-text coral-text", style: "margin:12px 0 8px;" }, ["Interests"]),
      chips(user.interests, "chip chip-coral", "No interests listed."),
    ]),
  ]);

  const panels = { posts: el("div", { class: "feed-list" }), resources: el("div", { class: "grid grid-fill-220" }), communities: el("div", { class: "wrap-gap" }) };
  const loaded = {};
  const loaders = {
    posts: async () => MedLink.renderPosts(panels.posts, await api.posts({ authorId: user.id, limit: 40 }), isMe ? "You haven't posted yet." : "No posts yet."),
    resources: async () => {
      const list = await api.resources({ authorId: user.id, limit: 60 });
      panels.resources.replaceChildren(...(list.length ? list.map(MedLink.resourceCardNode) : [MedLink.emptyState("No shared resources yet.")]));
    },
    communities: async () => {
      const [all, ids] = await Promise.all([api.communities(), api.myCommunityIds(user.id)]);
      const mine = all.filter(c => ids.has(c.id));
      panels.communities.replaceChildren(...(mine.length
        ? mine.map(c => el("a", { href: "communities.html?c=" + encodeURIComponent(c.id), class: "chip", style: "font-size:13px;padding:8px 14px;" }, [c.name]))
        : [MedLink.emptyState("Not in any communities yet.")]));
    },
  };
  const tabs = el("div", { class: "profile-tabs", role: "tablist" });
  const show = async (key) => {
    qsa(".profile-tab", tabs).forEach(t => { const on = t.dataset.tab === key; t.classList.toggle("active", on); t.setAttribute("aria-selected", String(on)); });
    Object.entries(panels).forEach(([k, p]) => { p.hidden = k !== key; });
    if (!loaded[key]) {
      loaded[key] = true;
      panels[key].replaceChildren(MedLink.loadingState());
      try { await loaders[key](); } catch (err) { loaded[key] = false; panels[key].replaceChildren(); MedLink.reportError(err); }
    }
  };
  [["posts", "Posts"], ["resources", "Resources"], ["communities", "Communities"]].forEach(([k, label]) =>
    tabs.appendChild(el("button", { type: "button", role: "tab", class: "profile-tab", "data-tab": k, onclick: () => show(k) }, [label])));

  root.replaceChildren(...[header, tabs, panels.posts, panels.resources, panels.communities].filter(Boolean));
  await show("posts");
});
</script>
</body>
</html>
