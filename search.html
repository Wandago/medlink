<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="icon" href="favicon.ico" sizes="any">
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="manifest" href="site.webmanifest">
<meta name="theme-color" content="#FFFFFF">
<title>Search — MedLink KE</title>
<script src="theme.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="styles.css">
</head>
<body>
<main id="page" hidden>
<div class="fade-in" id="root"></div>
</main>

<script src="config.js"></script>
<script src="data.js"></script>
<script src="app.js"></script>
<script>
MedLink.run({ page: "search" }, async ({ api }) => {
  const root = qs("#root");
  const raw = (param("q") || "").trim();
  root.replaceChildren(MedLink.loadingState());
  const r = await api.search(raw);
  if (r.q.length < 2) {
    root.replaceChildren(MedLink.emptyState("Type at least 2 characters — a unit, a topic, a name or an @username."));
    return;
  }
  const following = await api.followingIds();
  const total = r.resources.length + r.profiles.length + r.communities.length + r.posts.length;
  const section = (title, node) => [el("div", { class: "section-heading" }, [el("h2", {}, [title])]), node];
  const parts = [
    el("h1", { class: "disp", style: "font-size:22px;margin:0 0 4px;" }, [`Results for "${raw}"`]),
    el("p", { class: "faint", style: "font-size:13px;margin:0 0 22px;" }, [`${total} match${total === 1 ? "" : "es"} across MedLink`]),
  ];
  if (r.resources.length) parts.push(...section("Resources", el("div", { class: "grid grid-fill-230 search-block" }, r.resources.map(MedLink.resourceCardNode))));
  if (r.communities.length) parts.push(...section("Communities", el("div", { class: "wrap-gap search-block" },
    r.communities.map(c => el("a", { href: "communities.html?c=" + encodeURIComponent(c.id), class: "chip", style: "font-size:13px;padding:8px 14px;" }, [c.name])))));
  if (r.profiles.length) parts.push(...section("Students", el("div", { class: "feed-list search-block" },
    r.profiles.map(p => MedLink.studentRowNode(p, { following })))));
  const postsBox = el("div", { class: "feed-list search-block" });
  if (r.posts.length) parts.push(...section("Discussions", postsBox));
  if (!total) parts.push(MedLink.emptyState("No matches yet — try a unit, a name, or an @username."));
  root.replaceChildren(...parts);
  if (r.posts.length) await MedLink.renderPosts(postsBox, r.posts);
});
</script>
</body>
</html>
