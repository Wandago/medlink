<script>
  const params = new URLSearchParams(location.search);
  const raw = (params.get("q") || "").trim();
  const q = raw.toLowerCase().replace(/^@/, "");
  const me = getMe();
  const root = document.getElementById("root");

  const resources = q ? RESOURCES.filter(r => r.title.toLowerCase().includes(q) || r.unit.toLowerCase().includes(q)) : [];
  const students = q ? allUsers().filter(u => u.id !== me.id && (
    u.username.toLowerCase().includes(q) || u.fullName.toLowerCase().includes(q) ||
    uniName(u.universityId).toLowerCase().includes(q) || courseName(u.courseId).toLowerCase().includes(q) ||
    (u.interests || []).some(i => i.toLowerCase().includes(q)))) : [];
  const communities = q ? COMMUNITIES.filter(c => c.name.toLowerCase().includes(q)) : [];
  const posts = q ? FEED.filter(p => p.body.toLowerCase().includes(q)) : [];
  const total = resources.length + students.length + communities.length + posts.length;

  root.innerHTML = `
    <h1 class="disp" style="font-size:22px;margin:0 0 4px;">Results for "${escapeHtml(raw)}"</h1>
    <p class="faint" style="font-size:13px;margin-bottom:22px;">${total} matches across MedLink</p>
    <div id="sRes"></div><div id="sComm"></div><div id="sStu"></div><div id="sPost"></div>
    ${total === 0 ? `<div class="faint" style="text-align:center;padding:60px 20px;">No matches yet — try a unit, a name, or an @username.</div>` : ""}`;

  if (resources.length) {
    document.getElementById("sRes").innerHTML = `<div class="section-heading"><h2>Resources</h2></div><div class="grid grid-fill-230" style="margin-bottom:28px;" id="rg"></div>`;
    const rg = document.getElementById("rg");
    resources.forEach(r => rg.appendChild(resourceCardNode(r)));
  }
  if (communities.length) {
    document.getElementById("sComm").innerHTML = `<div class="section-heading"><h2>Communities</h2></div>
      <div class="wrap-gap" style="margin-bottom:28px;">${communities.map(c => `<a href="communities.html?c=${c.id}" class="chip" style="font-size:13px;padding:8px 14px;">${escapeHtml(c.name)}</a>`).join("")}</div>`;
  }
  if (students.length) {
    document.getElementById("sStu").innerHTML = `<div class="section-heading"><h2>Students</h2></div><div style="display:flex;flex-direction:column;gap:10px;margin-bottom:28px;" id="sl"></div>`;
    const sl = document.getElementById("sl");
    students.forEach(u => sl.appendChild(studentRowNode(u)));
  }
  if (posts.length) {
    document.getElementById("sPost").innerHTML = `<div class="section-heading"><h2>Discussions</h2></div>` +
      posts.map(p => `<div class="card pad" style="margin-bottom:10px;font-size:13.5px;line-height:1.5;">${escapeHtml(p.body)}</div>`).join("");
  }
</script>
