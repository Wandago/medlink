<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="icon" href="favicon.ico" sizes="any">
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="manifest" href="site.webmanifest">
<meta name="theme-color" content="#FFFFFF">
<title>Study Groups — MedLink KE</title>
<script src="theme.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="styles.css">
<style>
.group-header {
  display: flex;
  justify-content: space-between;
  align-items: center;
  flex-wrap: wrap;
  gap: 12px;
  margin-bottom: 22px;
}
.chat-container {
  display: flex;
  flex-direction: column;
  border: 1px solid var(--border, #E4E7EC);
  border-radius: 14px;
  background: var(--card-bg, #FFFFFF);
  height: calc(100vh - 260px);
  min-height: 480px;
}
.chat-messages {
  flex: 1;
  overflow-y: auto;
  padding: 20px;
  display: flex;
  flex-direction: column;
  gap: 14px;
}
.chat-container {
  background: rgba(255, 255, 255, 0.45);
  backdrop-filter: blur(16px);
  -webkit-backdrop-filter: blur(16px);
  border: 1px solid rgba(255, 255, 255, 0.4);
  border-radius: 24px;
  box-shadow: 0 12px 40px rgba(0, 0, 0, 0.08);
  overflow: hidden;
  display: flex;
  flex-direction: column;
  height: calc(100vh - 260px);
  min-height: 480px;
}
@media (prefers-color-scheme: dark) {
  .chat-container {
    background: rgba(15, 23, 42, 0.45);
    border: 1px solid rgba(255, 255, 255, 0.1);
  }
}
.chat-messages {
  flex: 1;
  overflow-y: auto;
  padding: 20px;
  display: flex;
  flex-direction: column;
  gap: 14px;
  background: transparent;
}
.chat-input-area {
  padding: 14px 16px;
  border-top: 1px solid rgba(228, 231, 236, 0.4);
  background: rgba(255, 255, 255, 0.65);
  backdrop-filter: blur(12px);
  -webkit-backdrop-filter: blur(12px);
  border-bottom-left-radius: 24px;
  border-bottom-right-radius: 24px;
}
.chat-menu-wrapper .btn-primary {
  color: var(--text-on-accent, #FFFFFF) !important;
  background: var(--btn-primary-bg, #1A56F0) !important;
}
.group-tag {
  display: inline-block;
  padding: 3px 8px;
  border-radius: 6px;
  font-size: 11.5px;
  font-weight: 600;
  text-transform: uppercase;
}
.group-tag-friends { background: rgba(26, 86, 240, 0.1); color: var(--primary, #1A56F0); }
.group-tag-unit { background: rgba(16, 179, 158, 0.12); color: #0d8274; }
.group-tag-university { background: rgba(255, 122, 26, 0.12); color: #d95d08; }
.members-list {
  display: flex;
  flex-wrap: wrap;
  gap: 8px;
  margin: 12px 0 16px;
}
.member-chip {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  background: var(--bg-soft, #F5F7FA);
  border: 1px solid var(--border, #E4E7EC);
  border-radius: 999px;
  padding: 4px 10px 4px 6px;
  font-size: 12.5px;
}
.member-chip .remove-member {
  cursor: pointer;
  color: var(--muted, #667085);
  font-size: 14px;
  border: none;
  background: none;
  padding: 0 2px;
}
.group-chat-box {
  background: var(--surface, #FFFFFF);
  border: 1px solid var(--border, #E4E7EC);
  border-radius: 12px;
  padding: 16px;
  margin-top: 14px;
}
.group-chat-messages {
  max-height: 260px;
  overflow-y: auto;
  display: flex;
  flex-direction: column;
  gap: 10px;
  margin-bottom: 12px;
}
.chat-msg {
  padding: 12px 16px;
  border-radius: 18px;
  background: var(--surface, #FFFFFF);
  color: var(--text, #101828);
  max-width: 80%;
  font-size: 13.5px;
  box-shadow: var(--shadow-sm, 0 1px 3px rgba(0,0,0,0.05));
  border: 1px solid var(--border, #E4E7EC);
}
.chat-msg.mine {
  align-self: flex-end;
  background: var(--surface, #FFFFFF);
  color: var(--text, #101828);
  border: 1px solid var(--accent, #1A56F0);
  border-radius: 18px 18px 6px 18px;
}
.chat-msg:not(.mine) {
  border-radius: 18px 18px 18px 6px;
}
.chat-meta {
  font-size: 11px;
  color: var(--text-3, #667085);
  margin-bottom: 2px;
}
.chat-msg.mine .chat-meta {
  color: var(--text-3, #667085);
}
.poll-card {
  background: var(--surface, #FFFFFF);
  border: 1px solid var(--border, #E4E7EC);
  border-radius: 18px;
  padding: 14px;
  margin-top: 6px;
  box-shadow: var(--shadow-sm, 0 2px 8px rgba(0,0,0,0.05));
}
.poll-option-btn {
  display: block;
  width: 100%;
  text-align: left;
  background: var(--surface-2, #F5F7FA);
  border: 1px solid var(--border, #E4E7EC);
  border-radius: 14px;
  padding: 12px 16px;
  margin-bottom: 8px;
  position: relative;
  overflow: hidden;
  cursor: pointer;
  transition: border-radius 0.2s, box-shadow 0.2s;
}
.poll-option-btn:hover {
  box-shadow: var(--shadow-sm, 0 2px 6px rgba(0,0,0,0.08));
}
.poll-bar {
  position: absolute;
  top: 0; left: 0; bottom: 0;
  background: var(--accent-soft, rgba(26, 86, 240, 0.08));
  z-index: 1;
  transition: width 0.3s;
}
.poll-option-content {
  position: relative;
  z-index: 2;
  display: flex;
  justify-content: space-between;
  align-items: center;
}
.chat-menu-wrapper {
  position: relative;
  display: inline-block;
}
.chat-menu-dropdown {
  position: absolute;
  bottom: 100%;
  left: 0;
  margin-bottom: 8px;
  background: var(--surface, #FFFFFF);
  border: 1px solid var(--border, #E4E7EC);
  border-radius: 16px;
  box-shadow: var(--shadow-lg, 0 4px 16px rgba(0,0,0,0.12));
  display: none;
  flex-direction: column;
  min-width: 160px;
  z-index: 1000;
  padding: 6px 0;
}
.chat-menu-dropdown.show {
  display: flex !important;
}
.chat-menu-dropdown button {
  background: none;
  border: none;
  padding: 10px 16px;
  text-align: left;
  font-size: 13.5px;
  font-weight: 500;
  color: var(--text, #101828);
  cursor: pointer;
  display: flex;
  align-items: center;
  gap: 8px;
  width: 100%;
}
.chat-menu-dropdown button:hover {
  background: var(--surface-2, #F5F7FA);
}
</style>
</head>
<body>
<main id="page" hidden>
<div class="fade-in" id="groups-root"></div>
</main>

<script src="config.js"></script>
<script src="data.js"></script>
<script src="app.js"></script>
<script>
MedLink.run({ page: "groups" }, async ({ api, me }) => {
  const root = qs("#groups-root");
  const STORAGE_KEY = "medlink_study_groups_" + (me ? me.id : "guest");

  function loadGroups() {
    try {
      const saved = localStorage.getItem(STORAGE_KEY);
      if (saved) return JSON.parse(saved);
    } catch (e) {}
    // Starter templates tailored to the user's university & units
    return [
      {
        id: "g_friends_" + Date.now(),
        name: "Inner Circle Study Buddies",
        type: "friends",
        typeLabel: "Close Study Friends",
        description: "Private study circle for revisions, daily targets, and discussing tricky concepts.",
        creator: me.username,
        members: [
          { username: me.username, name: me.full_name, color: me.color }
        ],
        messages: [
          { sender: me.username, text: "Hey! Added you to our study circle.", time: "Just now" }
        ],
        createdAt: new Date().toISOString()
      },
      {
        id: "g_uni_" + (Date.now() + 1),
        name: (uniLabel(me) || "Campus") + " Class Peers",
        type: "university",
        typeLabel: "University",
        description: "Connect and prepare exams with peers from " + (uniFull(me) || "our university") + ".",
        creator: me.username,
        members: [
          { username: me.username, name: me.full_name, color: me.color }
        ],
        messages: [],
        createdAt: new Date().toISOString()
      }
    ];
  }

  function saveGroups(groups) {
    try {
      localStorage.setItem(STORAGE_KEY, JSON.stringify(groups));
    } catch (e) {}
  }

  let groups = loadGroups();
  let activeGroupId = null;

  // Handle direct hash navigation if user refreshes inside a group page
  function checkHash() {
    const hash = window.location.hash;
    if (hash && hash.startsWith("#group=")) {
      const id = hash.replace("#group=", "");
      if (groups.some(g => g.id === id)) {
        activeGroupId = id;
      }
    }
  }
  checkHash();

  window.addEventListener("hashchange", () => {
    const hash = window.location.hash;
    if (hash && hash.startsWith("#group=")) {
      activeGroupId = hash.replace("#group=", "");
    } else {
      activeGroupId = null;
    }
    renderView();
  });

  function renderView() {
    root.replaceChildren();

    if (activeGroupId) {
      window.location.hash = "group=" + activeGroupId;
      renderGroupPage(activeGroupId);
      return;
    } else {
      if (window.location.hash.startsWith("#group=")) {
        history.pushState("", document.title, window.location.pathname + window.location.search);
      }
    }

    const topHeader = el("div", { class: "group-header" }, [
      el("div", {}, [
        el("h1", { class: "disp", style: "font-size:24px;margin:0 0 4px;" }, ["Study Groups"]),
        el("p", { class: "muted", style: "margin:0;font-size:14px;" }, [
          "Create and organize focused study groups for close friends, a specific unit, or your campus."
        ]),
      ]),
      el("button", {
        type: "button",
        class: "btn btn-primary",
        onclick: openCreateModal
      }, ["+ New study group"])
    ]);

    const grid = el("div", { class: "grid grid-fill-260" });

    if (!groups.length) {
      grid.appendChild(MedLink.emptyState("No study groups yet. Create your first group and invite peers by username!",
        el("button", { class: "btn btn-primary btn-sm", onclick: openCreateModal }, ["Create group"])
      ));
    } else {
      groups.forEach(g => {
        grid.appendChild(renderGroupCard(g));
      });
    }

    root.append(topHeader, grid);
  }

  function renderGroupCard(g) {
    const tagClass = g.type === "friends" ? "group-tag-friends" : g.type === "unit" ? "group-tag-unit" : "group-tag-university";

    return el("div", { 
      class: "card pad group-card",
      onclick: () => {
        activeGroupId = g.id;
        renderView();
      }
    }, [
      el("div", { style: "display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:8px;" }, [
        el("span", { class: "group-tag " + tagClass }, [g.typeLabel || g.type]),
        el("span", { class: "muted", style: "font-size:12px;" }, [g.members.length + " members"])
      ]),
      el("h3", { style: "margin:0 0 6px;font-size:17px;font-weight:700;" }, [g.name]),
      el("p", { class: "muted", style: "font-size:13px;line-height:1.5;margin:0 0 10px;" }, [g.description]),
      el("div", { style: "margin-top:auto;display:flex;justify-content:space-between;align-items:center;" }, [
        el("span", { class: "faint", style: "font-size:12px;" }, [(g.messages || []).length + " messages"]),
        el("span", { class: "btn btn-ghost btn-sm", style: "padding:2px 8px;font-size:11px;" }, ["Open Group →"])
      ])
    ]);
  }

  function renderGroupPage(groupId) {
    const g = groups.find(x => x.id === groupId);
    if (!g) {
      activeGroupId = null;
      renderView();
      return;
    }

    const header = el("div", { 
      class: "group-view-header", 
      style: "display:flex;justify-content:space-between;align-items:flex-start;flex-wrap:wrap;gap:16px;margin-bottom:20px;" 
    }, [
      el("div", { style: "display:flex;align-items:center;gap:12px;" }, [
        el("button", { 
          class: "btn btn-ghost btn-sm", 
          style: "display:flex;align-items:center;gap:6px;font-weight:600;",
          onclick: () => { 
            activeGroupId = null; 
            history.pushState("", document.title, window.location.pathname + window.location.search);
            renderView(); 
          } 
        }, [
          el("span", {}, ["←"]),
          el("span", {}, ["Back"])
        ]),
        el("div", {}, [
          el("h1", { class: "disp", style: "font-size:22px;margin:0;" }, [g.name]),
          el("p", { class: "muted", style: "font-size:13px;margin:2px 0 0;" }, [g.description || ""])
        ])
      ]),
      // Top Right Compact Members Box
      el("div", { 
        class: "card", 
        style: "padding:8px 12px;background:var(--card-bg);border:1px solid var(--border);border-radius:10px;display:flex;align-items:center;gap:10px;" 
      }, [
        el("div", { style: "display:flex;align-items:center;gap:6px;" }, [
          el("span", { style: "font-size:12px;font-weight:600;color:var(--muted);" }, ["Members:"]),
          el("div", { style: "display:flex;align-items:center;gap:4px;max-width:240px;overflow-x:auto;padding-bottom:2px;" }, 
            g.members.map(m => {
              const isMe = m.username === me.username;
              return el("span", {
                title: "@" + m.username + (isMe ? " (You)" : ""),
                style: "display:inline-flex;align-items:center;justify-content:center;width:24px;height:24px;border-radius:50%;background:" + safeColor(m.color) + ";color:#fff;font-size:10px;font-weight:700;cursor:pointer;position:relative;",
                onclick: () => {
                  if (!isMe && confirm("Remove @" + m.username + " from group?")) {
                    g.members = g.members.filter(x => x.username !== m.username);
                    saveGroups(groups);
                    renderView();
                  }
                }
              }, [initials(m.name || m.username)]);
            })
          )
        ]),
        el("button", {
          class: "btn btn-primary btn-sm",
          style: "padding:4px 8px;font-size:11px;border-radius:6px;",
          onclick: () => openAddMemberModal(g)
        }, ["+ Add"]),
        el("button", {
          class: "btn btn-ghost btn-sm",
          style: "padding:4px 6px;font-size:11px;color:var(--error);",
          title: "Delete group",
          onclick: () => {
            if (confirm("Delete this group and all its messages?")) {
              groups = groups.filter(x => x.id !== g.id);
              saveGroups(groups);
              activeGroupId = null;
              history.pushState("", document.title, window.location.pathname + window.location.search);
              renderView();
            }
          }
        }, ["🗑"])
      ])
    ]);

    // Main Chat Area
    const chatMsgs = el("div", { class: "chat-messages" });
    (g.messages || []).forEach(msg => {
      const isMine = msg.sender === me.username;
      
      let contentNode = el("div", {}, [msg.text]);
      if (msg.type === "image") {
        contentNode = el("div", {}, [
          el("img", { src: msg.url, style: "max-width:100%;max-height:220px;border-radius:8px;margin-top:4px;" })
        ]);
      } else if (msg.type === "poll") {
        const totalVotes = Object.values(msg.votes || {}).reduce((a, b) => a + b, 0);
        const optionsList = el("div", { style: "margin-top:8px;" });
        
        msg.options.forEach((opt, optIdx) => {
          const count = (msg.votes || {})[optIdx] || 0;
          const pct = totalVotes > 0 ? Math.round((count / totalVotes) * 100) : 0;
          
          optionsList.appendChild(el("button", {
            class: "poll-option-btn",
            onclick: () => {
              msg.userVotes = msg.userVotes || {};
              msg.votes = msg.votes || {};
              const prevVote = msg.userVotes[me.username];
              if (prevVote !== undefined) {
                msg.votes[prevVote] = Math.max(0, (msg.votes[prevVote] || 1) - 1);
              }
              msg.userVotes[me.username] = optIdx;
              msg.votes[optIdx] = (msg.votes[optIdx] || 0) + 1;
              saveGroups(groups);
              renderView();
            }
          }, [
            el("div", { class: "poll-bar", style: "width:" + pct + "%;" }),
            el("div", { class: "poll-option-content" }, [
              el("span", { style: "font-weight:500;" }, [opt]),
              el("span", { class: "muted", style: "font-size:12px;" }, [count + " (" + pct + "%)"])
            ])
          ]));
        });

        contentNode = el("div", { class: "poll-card" }, [
          el("div", { style: "font-weight:600;font-size:14px;margin-bottom:4px;" }, ["📊 " + msg.question]),
          optionsList,
          el("div", { class: "faint", style: "font-size:11px;margin-top:8px;" }, [totalVotes + " total vote" + (totalVotes === 1 ? "" : "s")])
        ]);
      }

      chatMsgs.appendChild(el("div", { class: "chat-msg" + (isMine ? " mine" : "") }, [
        el("div", { class: "chat-meta" }, ["@" + msg.sender + " · " + (msg.time || "")]),
        contentNode
      ]));
    });
    // Scroll to bottom
    setTimeout(() => chatMsgs.scrollTop = chatMsgs.scrollHeight, 10);

    const chatInput = el("input", {
      type: "text",
      placeholder: "Write a message...",
      style: "flex:1;padding:10px 14px;border:1px solid var(--border);border-radius:10px;"
    });

    const menuDropdown = el("div", { class: "chat-menu-dropdown" }, [
      el("button", {
        type: "button",
        onclick: () => {
          menuDropdown.classList.remove("show");
          const url = prompt("Enter image URL (e.g. https://images.unsplash.com/...):");
          if (!url) return;
          g.messages = g.messages || [];
          g.messages.push({ sender: me.username, type: "image", url, text: "Shared an image", time: "Just now" });
          saveGroups(groups);
          renderView();
        }
      }, ["📷 Share Image"]),
      el("button", {
        type: "button",
        onclick: () => {
          menuDropdown.classList.remove("show");
          openPollModal(g);
        }
      }, ["📊 Create Poll"])
    ]);

    const plusBtn = el("button", {
      type: "button",
      class: "btn btn-primary",
      style: "padding:8px 14px;font-size:18px;font-weight:700;line-height:1;border-radius:999px;cursor:pointer;background:var(--btn-primary-bg, #1A56F0);color:var(--text-on-accent, #fff);box-shadow:0 2px 8px rgba(26,86,240,0.25);",
      title: "Add attachment or poll",
      onclick: (e) => {
        e.preventDefault();
        e.stopPropagation();
        menuDropdown.classList.toggle("show");
      }
    }, ["⋮"]);

    window.addEventListener("click", () => {
      menuDropdown.classList.remove("show");
    });

    const chatForm = el("form", {
      class: "chat-input-area",
      style: "display:flex;gap:10px;position:relative;",
      onsubmit: (e) => {
        e.preventDefault();
        const text = chatInput.value.trim();
        if (!text) return;
        g.messages = g.messages || [];
        g.messages.push({ sender: me.username, type: "text", text, time: "Just now" });
        saveGroups(groups);
        chatInput.value = "";
        renderView();
      }
    }, [
      el("div", { class: "chat-menu-wrapper" }, [plusBtn, menuDropdown]),
      chatInput,
      el("button", { class: "btn btn-primary" }, ["Send"])
    ]);

    const mainChat = el("div", { class: "chat-container" }, [
      chatMsgs,
      chatForm
    ]);

    root.append(header, mainChat);
  }

  function renderGroupCard_old(g) {
    // keeping old for reference or fallback
  }

  function openCreateModal() {
    const nameInput = el("input", { type: "text", placeholder: "e.g. 3rd Year Histology Crushes", required: true, maxlength: 60 });
    const descInput = el("textarea", { rows: 2, placeholder: "What will this group focus on?", maxlength: 180 });

    const form = el("form", { class: "form-stack", style: "margin-top:14px;" }, [
      el("div", { class: "field" }, [
        el("label", {}, ["Group Name"]),
        nameInput
      ]),
      el("div", { class: "field" }, [
        el("label", {}, ["Short Description"]),
        descInput
      ]),
      el("div", { class: "row-gap", style: "justify-content:flex-end;margin-top:16px;" }, [
        el("button", { type: "button", class: "btn btn-ghost", onclick: () => close() }, ["Cancel"]),
        el("button", { type: "submit", class: "btn btn-primary" }, ["Create group"])
      ])
    ]);

    form.addEventListener("submit", (e) => {
      e.preventDefault();
      const name = nameInput.value.trim();
      if (!name) return;

      const newGroup = {
        id: "g_" + Date.now(),
        name,
        type: "custom",
        typeLabel: "Study Group",
        description: descInput.value.trim() || "Custom study group",
        creator: me.username,
        members: [{ username: me.username, name: me.full_name, color: me.color }],
        messages: [{ sender: me.username, text: "Group created! Add friends by username above.", time: "Just now" }],
        createdAt: new Date().toISOString()
      };

      groups.unshift(newGroup);
      saveGroups(groups);
      close();
      renderView();
      MedLink.toast("Study group created!", "success");
    });

    const close = MedLink.modal("Create a Study Group", form);
  }

  function openAddMemberModal(group) {
    const userInput = el("input", {
      type: "text",
      placeholder: "Enter student username without @",
      required: true,
      autocomplete: "off",
      autocapitalize: "none"
    });
    const statusMsg = el("div", { class: "field-hint", style: "margin-top:6px;" }, ["Search any classmate on MedLink by their @username."]);

    const form = el("form", { class: "form-stack", style: "margin-top:14px;" }, [
      el("div", { class: "field" }, [
        el("label", {}, ["Student's Username"]),
        userInput,
        statusMsg
      ]),
      el("div", { class: "row-gap", style: "justify-content:flex-end;margin-top:16px;" }, [
        el("button", { type: "button", class: "btn btn-ghost", onclick: () => close() }, ["Cancel"]),
        el("button", { type: "submit", class: "btn btn-primary" }, ["Add student"])
      ])
    ]);

    form.addEventListener("submit", async (e) => {
      e.preventDefault();
      const targetUser = userInput.value.trim().toLowerCase().replace(/^@/, "");
      if (!targetUser) return;

      if (group.members.some(m => m.username.toLowerCase() === targetUser)) {
        MedLink.toast("@" + targetUser + " is already in this group.", "error");
        return;
      }

      statusMsg.textContent = "Checking username @" + targetUser + "…";

      try {
        const found = await api.profileByUsername(targetUser);
        if (!found) {
          statusMsg.textContent = "Student @" + targetUser + " not found. Double check the spelling.";
          MedLink.toast("Student @" + targetUser + " not found.", "error");
          return;
        }

        group.members.push({
          username: found.username,
          name: found.full_name,
          color: found.color
        });
        saveGroups(groups);
        close();
        renderView();
        MedLink.toast("Added @" + found.username + " to the group!", "success");
      } catch (err) {
        statusMsg.textContent = "Could not check username. Please try again.";
        MedLink.reportError(err);
      }
    });

    const close = MedLink.modal("Add Student to " + group.name, form);
  }

  renderView();
});
</script>
</body>
</html>
