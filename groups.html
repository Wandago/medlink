<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="icon" href="favicon.ico" sizes="any">
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="manifest" href="site.webmanifest">
<meta name="theme-color" content="#FFFFFF">
<title>Study Groups — MedLink KE</title>
<script src="theme.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="styles.css">
<style>
.group-header {
  display: flex;
  justify-content: space-between;
  align-items: center;
  flex-wrap: wrap;
  gap: 12px;
  margin-bottom: 22px;
}
.chat-container {
  display: flex;
  flex-direction: column;
  border: 1px solid var(--border, #E4E7EC);
  border-radius: 14px;
  background: var(--card-bg, #FFFFFF);
  height: calc(100vh - 260px);
  min-height: 480px;
}
.chat-messages {
  flex: 1;
  overflow-y: auto;
  padding: 20px;
  display: flex;
  flex-direction: column;
  gap: 14px;
}
.chat-container {
  background: rgba(255, 255, 255, 0.45);
  backdrop-filter: blur(16px);
  -webkit-backdrop-filter: blur(16px);
  border: 1px solid rgba(255, 255, 255, 0.4);
  border-radius: 24px;
  box-shadow: 0 12px 40px rgba(0, 0, 0, 0.08);
  overflow: hidden;
  display: flex;
  flex-direction: column;
  height: calc(100vh - 260px);
  min-height: 480px;
}
[data-theme="dark"] .chat-container { background: rgba(15, 23, 42, 0.45); border: 1px solid rgba(255, 255, 255, 0.1); }
[data-theme="dark"] .chat-input-area { background: rgba(15, 23, 42, 0.65); border-top-color: rgba(255, 255, 255, 0.1); }
@media (prefers-color-scheme: dark) {
  .chat-container {
    background: rgba(15, 23, 42, 0.45);
    border: 1px solid rgba(255, 255, 255, 0.1);
  }
}
.chat-messages {
  flex: 1;
  overflow-y: auto;
  padding: 20px;
  display: flex;
  flex-direction: column;
  gap: 14px;
  background: transparent;
}
.chat-input-area {
  padding: 14px 16px;
  border-top: 1px solid rgba(228, 231, 236, 0.4);
  background: rgba(255, 255, 255, 0.65);
  backdrop-filter: blur(12px);
  -webkit-backdrop-filter: blur(12px);
  border-bottom-left-radius: 24px;
  border-bottom-right-radius: 24px;
}
.chat-menu-wrapper .btn-primary {
  color: var(--text-on-accent, #FFFFFF) !important;
  background: var(--btn-primary-bg, #1A56F0) !important;
}
.group-tag {
  display: inline-block;
  padding: 3px 8px;
  border-radius: 6px;
  font-size: 11.5px;
  font-weight: 600;
  text-transform: uppercase;
}
.group-tag-friends { background: rgba(26, 86, 240, 0.1); color: var(--primary, #1A56F0); }
.group-tag-unit { background: rgba(16, 179, 158, 0.12); color: #0d8274; }
.group-tag-university { background: rgba(255, 122, 26, 0.12); color: #d95d08; }
.members-list {
  display: flex;
  flex-wrap: wrap;
  gap: 8px;
  margin: 12px 0 16px;
}
.member-chip {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  background: var(--bg-soft, #F5F7FA);
  border: 1px solid var(--border, #E4E7EC);
  border-radius: 999px;
  padding: 4px 10px 4px 6px;
  font-size: 12.5px;
}
.member-chip .remove-member {
  cursor: pointer;
  color: var(--muted, #667085);
  font-size: 14px;
  border: none;
  background: none;
  padding: 0 2px;
}
.group-chat-box {
  background: var(--surface, #FFFFFF);
  border: 1px solid var(--border, #E4E7EC);
  border-radius: 12px;
  padding: 16px;
  margin-top: 14px;
}
.group-chat-messages {
  max-height: 260px;
  overflow-y: auto;
  display: flex;
  flex-direction: column;
  gap: 10px;
  margin-bottom: 12px;
}
.chat-msg {
  padding: 12px 16px;
  border-radius: 18px;
  background: var(--surface, #FFFFFF);
  color: var(--text, #101828);
  max-width: 80%;
  font-size: 13.5px;
  box-shadow: var(--shadow-sm, 0 1px 3px rgba(0,0,0,0.05));
  border: 1px solid var(--border, #E4E7EC);
}
.chat-msg.mine {
  align-self: flex-end;
  background: var(--surface, #FFFFFF);
  color: var(--text, #101828);
  border: 1px solid var(--accent, #1A56F0);
  border-radius: 18px 18px 6px 18px;
}
.chat-msg:not(.mine) {
  border-radius: 18px 18px 18px 6px;
}
.chat-meta {
  font-size: 11px;
  color: var(--text-3, #667085);
  margin-bottom: 2px;
}
.chat-msg.mine .chat-meta {
  color: var(--text-3, #667085);
}
.poll-card {
  background: var(--surface, #FFFFFF);
  border: 1px solid var(--border, #E4E7EC);
  border-radius: 18px;
  padding: 14px;
  margin-top: 6px;
  box-shadow: var(--shadow-sm, 0 2px 8px rgba(0,0,0,0.05));
}
.poll-option-btn {
  display: block;
  width: 100%;
  text-align: left;
  background: var(--surface-2, #F5F7FA);
  border: 1px solid var(--border, #E4E7EC);
  border-radius: 14px;
  padding: 12px 16px;
  margin-bottom: 8px;
  position: relative;
  overflow: hidden;
  cursor: pointer;
  transition: border-radius 0.2s, box-shadow 0.2s;
}
.poll-option-btn:hover {
  box-shadow: var(--shadow-sm, 0 2px 6px rgba(0,0,0,0.08));
}
.poll-bar {
  position: absolute;
  top: 0; left: 0; bottom: 0;
  background: var(--accent-soft, rgba(26, 86, 240, 0.08));
  z-index: 1;
  transition: width 0.3s;
}
.poll-option-content {
  position: relative;
  z-index: 2;
  display: flex;
  justify-content: space-between;
  align-items: center;
}
.chat-menu-wrapper {
  position: relative;
  display: inline-block;
}
.chat-menu-dropdown {
  position: absolute;
  bottom: 100%;
  left: 0;
  margin-bottom: 8px;
  background: var(--surface, #FFFFFF);
  border: 1px solid var(--border, #E4E7EC);
  border-radius: 16px;
  box-shadow: var(--shadow-lg, 0 4px 16px rgba(0,0,0,0.12));
  display: none;
  flex-direction: column;
  min-width: 160px;
  z-index: 1000;
  padding: 6px 0;
}
.chat-menu-dropdown.show {
  display: flex !important;
}
.chat-menu-dropdown button {
  background: none;
  border: none;
  padding: 10px 16px;
  text-align: left;
  font-size: 13.5px;
  font-weight: 500;
  color: var(--text, #101828);
  cursor: pointer;
  display: flex;
  align-items: center;
  gap: 8px;
  width: 100%;
}
.chat-menu-dropdown button:hover {
  background: var(--surface-2, #F5F7FA);
}
</style>
</head>
<body>
<main id="page" hidden>
<div class="fade-in" id="groups-root"></div>
</main>

<script src="config.js"></script>
<script src="data.js"></script>
<script src="app.js"></script>
<script>
MedLink.run({ page: "groups" }, async ({ api, me }) => {
  const root = qs("#groups-root");
  // Groups made before they were saved online lived only in this browser.
  const LOCAL_KEY = "medlink_study_groups_" + me.id;
  const REFRESH_MS = 5000;
  let groups = [];
  let refreshTimer = null;

  // One listener closes any open ⋮ menu.
  document.addEventListener("click", () => qsa(".chat-menu-dropdown.show").forEach(n => n.classList.remove("show")));
  window.addEventListener("hashchange", route);

  const groupIdFromHash = () => location.hash.startsWith("#group=") ? decodeURIComponent(location.hash.slice(7)) : null;
  const backToList = () => { history.pushState("", document.title, location.pathname + location.search); route(); };
  const personName = p => (p && (p.full_name || p.username)) || "Someone";

  async function route() {
    clearInterval(refreshTimer);
    const id = groupIdFromHash();
    root.replaceChildren(MedLink.loadingState());
    try {
      groups = await api.myGroups();
    } catch (err) {
      console.error(err);
      root.replaceChildren(MedLink.emptyState("Couldn't load study groups: " + MedLink.errorMessage(err) +
        (/study_groups|schema cache/i.test(err.message || "") ? " — an admin needs to run the latest supabase/schema.sql." : "")));
      return;
    }
    if (id) return renderGroupPage(id);
    renderList();
  }

  // ---------------- list ----------------
  function renderList() {
    const header = el("div", { class: "group-header" }, [
      el("div", {}, [
        el("h1", { class: "disp", style: "font-size:24px;margin:0 0 4px;" }, ["Study Groups"]),
        el("p", { class: "muted", style: "margin:0;font-size:14px;" }, [
          "Private groups for close friends, a unit or your campus. Only the members you add can see the chat.",
        ]),
      ]),
      el("button", { type: "button", class: "btn btn-primary", onclick: openCreateModal }, ["+ New study group"]),
    ]);
    const grid = el("div", { class: "grid grid-fill-260" });
    if (!groups.length) {
      grid.appendChild(MedLink.emptyState("No study groups yet. Create one and add classmates by their @username.",
        el("button", { type: "button", class: "btn btn-primary btn-sm", onclick: openCreateModal }, ["Create group"])));
    }
    groups.forEach(g => grid.appendChild(groupCard(g)));
    root.replaceChildren(...[header, localMoveBanner(), grid].filter(Boolean));
  }

  function groupCard(g) {
    const mine = g.created_by === me.id;
    return el("a", { class: "card pad group-card", href: "#group=" + encodeURIComponent(g.id),
      style: "display:flex;flex-direction:column;color:inherit;text-decoration:none;" }, [
      el("div", { style: "display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:8px;" }, [
        el("span", { class: "group-tag " + (mine ? "group-tag-friends" : "group-tag-unit") }, [mine ? "Your group" : "Member"]),
        el("span", { class: "muted", style: "font-size:12px;" }, [plural(count(g.study_group_members), "member")]),
      ]),
      el("h3", { style: "margin:0 0 6px;font-size:17px;font-weight:700;" }, [g.name]),
      el("p", { class: "muted", style: "font-size:13px;line-height:1.5;margin:0 0 10px;" }, [g.description || ""]),
      el("div", { style: "margin-top:auto;display:flex;justify-content:space-between;align-items:center;gap:8px;" }, [
        el("span", { class: "faint", style: "font-size:12px;" }, [plural(count(g.study_group_messages), "message") + " · active " + timeAgo(g.last_activity_at)]),
        el("span", { class: "btn btn-ghost btn-sm", style: "padding:2px 8px;font-size:11px;" }, ["Open group →"]),
      ]),
    ]);
  }

  // ---------------- one group ----------------
  async function renderGroupPage(id) {
    const g = groups.find(x => x.id === id);
    if (!g) {
      root.replaceChildren(MedLink.emptyState("This group doesn't exist, or you're not a member.",
        el("button", { type: "button", class: "btn btn-primary btn-sm", onclick: backToList }, ["All study groups"])));
      return;
    }
    let members = [], messages = [], votes = [];
    try {
      [members, messages] = await Promise.all([api.groupMembers(id), api.groupMessages(id)]);
      votes = await api.groupPollVotes(messages.filter(m => m.kind === "poll").map(m => m.id));
    } catch (err) { MedLink.reportError(err); return; }
    const isOwner = () => members.some(m => m.user_id === me.id && m.role === "owner");

    const membersBox = el("div", { style: "display:flex;align-items:center;gap:4px;max-width:240px;overflow-x:auto;padding-bottom:2px;" });
    const paintMembers = () => membersBox.replaceChildren(...members.map(m => {
      const p = m.profile || {}, isMe = m.user_id === me.id, removable = isOwner() && !isMe;
      return el(removable ? "button" : "span", {
        type: removable ? "button" : null,
        title: "@" + (p.username || "?") + (isMe ? " (you)" : "") + (m.role === "owner" ? " · owner" : "") + (removable ? " — tap to remove" : ""),
        "aria-label": removable ? "Remove @" + p.username : null,
        style: "display:inline-flex;align-items:center;justify-content:center;width:24px;height:24px;border-radius:50%;border:none;padding:0;flex-shrink:0;background:" +
          safeColor(p.color) + ";color:#fff;font-size:10px;font-weight:700;" + (removable ? "cursor:pointer;" : ""),
        onclick: removable ? async () => {
          if (!confirm("Remove @" + p.username + " from " + g.name + "?")) return;
          try { await api.removeGroupMember(g.id, m.user_id); members = members.filter(x => x.user_id !== m.user_id); paintMembers(); }
          catch (err) { MedLink.reportError(err); }
        } : null,
      }, [initials(personName(p))]);
    }));
    paintMembers();

    const ownerOrLeave = isOwner()
      ? el("button", { type: "button", class: "btn btn-ghost btn-sm", title: "Delete group", "aria-label": "Delete group",
          style: "padding:4px 8px;font-size:11px;border-radius:6px;color:var(--error);",
          onclick: async () => {
            if (!confirm("Delete " + g.name + " and all its messages for everyone?")) return;
            try { await api.deleteGroup(g.id); MedLink.toast("Group deleted."); backToList(); } catch (err) { MedLink.reportError(err); }
          } }, ["🗑"])
      : el("button", { type: "button", class: "btn btn-ghost btn-sm", style: "padding:4px 8px;font-size:11px;border-radius:6px;",
          onclick: async () => {
            if (!confirm("Leave " + g.name + "? You'll need a member to add you back.")) return;
            try { await api.removeGroupMember(g.id, me.id); MedLink.toast("You left " + g.name + "."); backToList(); } catch (err) { MedLink.reportError(err); }
          } }, ["Leave"]);

    const header = el("div", { class: "group-view-header",
      style: "display:flex;justify-content:space-between;align-items:flex-start;flex-wrap:wrap;gap:16px;margin-bottom:20px;" }, [
      el("div", { style: "display:flex;align-items:center;gap:12px;min-width:0;" }, [
        el("button", { type: "button", class: "btn btn-ghost btn-sm", style: "display:flex;align-items:center;gap:6px;font-weight:600;", onclick: backToList }, [
          el("span", {}, ["←"]), el("span", {}, ["Back"]),
        ]),
        el("div", { style: "min-width:0;" }, [
          el("h1", { class: "disp", style: "font-size:22px;margin:0;" }, [g.name]),
          el("p", { class: "muted", style: "font-size:13px;margin:2px 0 0;" }, [g.description || ""]),
        ]),
      ]),
      el("div", { class: "card", style: "padding:8px 12px;background:var(--surface);border:1px solid var(--border);border-radius:10px;display:flex;align-items:center;gap:10px;" }, [
        el("div", { style: "display:flex;align-items:center;gap:6px;" }, [
          el("span", { style: "font-size:12px;font-weight:600;color:var(--muted);" }, ["Members:"]), membersBox,
        ]),
        el("button", { type: "button", class: "btn btn-primary btn-sm", style: "padding:4px 8px;font-size:11px;border-radius:6px;",
          onclick: () => openAddMemberModal(g, members, added => { members.push(added); paintMembers(); }) }, ["+ Add"]),
        ownerOrLeave,
      ]),
    ]);

    // ---- chat ----
    const chatMsgs = el("div", { class: "chat-messages" });
    let painted = "";
    const paintChat = (force) => {
      const sig = JSON.stringify([messages.map(m => m.id), votes.map(v => v.message_id + v.user_id + v.option)]);
      if (!force && sig === painted) return;
      painted = sig;
      const nearBottom = chatMsgs.scrollHeight - chatMsgs.scrollTop - chatMsgs.clientHeight < 80;
      chatMsgs.replaceChildren(...(messages.length ? messages.map(messageNode)
        : [el("div", { class: "faint", style: "text-align:center;font-size:13px;margin:auto;" }, ["No messages yet — say hello 👋"])]));
      if (force || nearBottom) chatMsgs.scrollTop = chatMsgs.scrollHeight;
    };

    function messageNode(m) {
      const isMine = m.sender_id === me.id;
      let content = el("div", { style: "white-space:pre-wrap;word-break:break-word;" }, [m.body]);
      if (m.kind === "image") {
        content = el("a", { href: m.image_url, target: "_blank", rel: "noopener noreferrer" }, [
          el("img", { src: m.image_url, alt: "Shared image", loading: "lazy", referrerpolicy: "no-referrer",
            style: "display:block;max-width:100%;max-height:220px;border-radius:8px;margin-top:4px;" }),
        ]);
      } else if (m.kind === "poll") {
        content = pollNode(m);
      }
      return el("div", { class: "chat-msg" + (isMine ? " mine" : "") }, [
        el("div", { class: "chat-meta" }, [(isMine ? "You" : "@" + ((m.sender && m.sender.username) || "?")) + " · " + timeAgo(m.created_at)]),
        content,
      ]);
    }

    function pollNode(m) {
      const mv = votes.filter(v => v.message_id === m.id);
      const total = mv.length;
      const myVote = (mv.find(v => v.user_id === me.id) || {}).option;
      return el("div", { class: "poll-card" }, [
        el("div", { style: "font-weight:600;font-size:14px;margin-bottom:4px;" }, ["📊 " + m.body]),
        el("div", { style: "margin-top:8px;" }, (m.poll_options || []).map((opt, i) => {
          const n = mv.filter(v => v.option === i).length;
          const pct = total ? Math.round(n * 100 / total) : 0;
          return el("button", { type: "button", class: "poll-option-btn", "aria-pressed": myVote === i ? "true" : "false",
            style: myVote === i ? "border-color:var(--accent);" : null,
            onclick: async () => {
              try {
                await api.setGroupVote(m.id, myVote === i ? null : i);
                votes = await api.groupPollVotes(messages.filter(x => x.kind === "poll").map(x => x.id));
                paintChat(false);
              } catch (err) { MedLink.reportError(err); }
            } }, [
            el("div", { class: "poll-bar", style: "width:" + pct + "%;" }),
            el("div", { class: "poll-option-content" }, [
              el("span", { style: "font-weight:500;" }, [(myVote === i ? "✓ " : "") + opt]),
              el("span", { class: "muted", style: "font-size:12px;" }, [n + " (" + pct + "%)"]),
            ]),
          ]);
        })),
        el("div", { class: "faint", style: "font-size:11px;margin-top:8px;" }, [plural(total, "vote") + (myVote != null ? " · tap your pick again to undo" : "")]),
      ]);
    }

    async function send(m) {
      const row = await api.sendGroupMessage(g.id, m);
      messages.push(row);
      paintChat(true);
    }

    const chatInput = el("input", { type: "text", maxlength: "2000", placeholder: "Write a message...", "aria-label": "Write a message",
      style: "flex:1;min-width:0;padding:10px 14px;border:1px solid var(--border);border-radius:10px;" });
    const sendBtn = el("button", { type: "submit", class: "btn btn-primary" }, ["Send"]);

    const menuDropdown = el("div", { class: "chat-menu-dropdown" }, [
      el("button", { type: "button", onclick: async () => {
        menuDropdown.classList.remove("show");
        const url = (prompt("Paste an image link (it must start with https://):") || "").trim();
        if (!url) return;
        if (!/^https:\/\/\S+$/.test(url)) { MedLink.toast("Image links must start with https://", "error"); return; }
        try { await send({ kind: "image", imageUrl: url, body: "" }); } catch (err) { MedLink.reportError(err); }
      } }, ["📷 Share Image"]),
      el("button", { type: "button", onclick: () => { menuDropdown.classList.remove("show"); openPollModal(send); } }, ["📊 Create Poll"]),
    ]);
    const plusBtn = el("button", { type: "button", class: "btn btn-primary", title: "Add an image or poll", "aria-label": "Add an image or poll",
      style: "padding:8px 14px;font-size:18px;font-weight:700;line-height:1;border-radius:999px;cursor:pointer;background:var(--btn-primary-bg, #1A56F0);color:var(--text-on-accent, #fff);box-shadow:0 2px 8px rgba(26,86,240,0.25);",
      onclick: (e) => { e.preventDefault(); e.stopPropagation(); menuDropdown.classList.toggle("show"); } }, ["⋮"]);

    const chatForm = el("form", { class: "chat-input-area", style: "display:flex;gap:10px;position:relative;" }, [
      el("div", { class: "chat-menu-wrapper" }, [plusBtn, menuDropdown]), chatInput, sendBtn,
    ]);
    chatForm.addEventListener("submit", async (e) => {
      e.preventDefault();
      const text = chatInput.value.trim();
      if (!text) return;
      sendBtn.disabled = true;
      try { await send({ kind: "text", body: text }); chatInput.value = ""; } catch (err) { MedLink.reportError(err); }
      sendBtn.disabled = false;
      chatInput.focus();
    });

    root.replaceChildren(header, el("div", { class: "chat-container" }, [chatMsgs, chatForm]));
    paintChat(true);

    // New messages and votes from other members.
    refreshTimer = setInterval(async () => {
      if (document.hidden || groupIdFromHash() !== g.id) return;
      try {
        messages = await api.groupMessages(g.id);
        votes = await api.groupPollVotes(messages.filter(m => m.kind === "poll").map(m => m.id));
        paintChat(false);
      } catch (err) { console.warn("[MedLink] group refresh:", err); }
    }, REFRESH_MS);
  }

  // ---------------- modals ----------------
  function openCreateModal() {
    const nameInput = el("input", { type: "text", placeholder: "e.g. 3rd Year Histology Crushes", required: true, minlength: "2", maxlength: "60" });
    const descInput = el("textarea", { rows: 2, placeholder: "What will this group focus on?", maxlength: "180" });
    const submit = el("button", { type: "submit", class: "btn btn-primary" }, ["Create group"]);
    const form = el("form", { class: "form-stack", style: "margin-top:14px;" }, [
      el("div", { class: "field" }, [el("label", {}, ["Group name"]), nameInput]),
      el("div", { class: "field" }, [el("label", {}, ["Short description"]), descInput]),
      el("div", { class: "row-gap", style: "justify-content:flex-end;margin-top:16px;" }, [
        el("button", { type: "button", class: "btn btn-ghost", onclick: () => close() }, ["Cancel"]), submit,
      ]),
    ]);
    const close = MedLink.modal("Create a study group", form);
    nameInput.focus();
    form.addEventListener("submit", async (e) => {
      e.preventDefault();
      const name = nameInput.value.trim();
      if (name.length < 2) return;
      submit.disabled = true;
      try {
        const g = await api.createGroup(name, descInput.value.trim());
        close();
        MedLink.toast("Study group created — add classmates with + Add.", "success");
        location.hash = "group=" + encodeURIComponent(g.id);
      } catch (err) { MedLink.reportError(err); submit.disabled = false; }
    });
  }

  function openAddMemberModal(group, members, onAdded) {
    const userInput = el("input", { type: "text", placeholder: "Their username, without @", required: true, autocomplete: "off", autocapitalize: "none" });
    const statusMsg = el("div", { class: "field-hint", style: "margin-top:6px;" }, ["Anyone on MedLink, by their @username."]);
    const submit = el("button", { type: "submit", class: "btn btn-primary" }, ["Add student"]);
    const form = el("form", { class: "form-stack", style: "margin-top:14px;" }, [
      el("div", { class: "field" }, [el("label", {}, ["Student's username"]), userInput, statusMsg]),
      el("div", { class: "row-gap", style: "justify-content:flex-end;margin-top:16px;" }, [
        el("button", { type: "button", class: "btn btn-ghost", onclick: () => close() }, ["Cancel"]), submit,
      ]),
    ]);
    const close = MedLink.modal("Add a student to " + group.name, form);
    userInput.focus();
    form.addEventListener("submit", async (e) => {
      e.preventDefault();
      const username = userInput.value.trim().toLowerCase().replace(/^@/, "");
      if (!username) return;
      if (members.some(m => m.profile && m.profile.username === username)) { statusMsg.textContent = "@" + username + " is already in this group."; return; }
      submit.disabled = true;
      statusMsg.textContent = "Looking up @" + username + "…";
      try {
        const found = await api.profileByUsername(username);
        if (!found) { statusMsg.textContent = "No student called @" + username + " — check the spelling."; submit.disabled = false; return; }
        await api.addGroupMember(group.id, found.id);
        onAdded({ user_id: found.id, role: "member", profile: found });
        close();
        MedLink.toast("Added @" + found.username + " to " + group.name + ".", "success");
      } catch (err) {
        statusMsg.textContent = "Couldn't add them: " + MedLink.errorMessage(err);
        submit.disabled = false;
      }
    });
  }

  function openPollModal(send) {
    const questionInput = el("input", { type: "text", placeholder: "e.g. Which topic should we revise next?", required: true, maxlength: "100" });
    const optionInputs = ["Option A (e.g. Cardiology)", "Option B (e.g. Neurology)", "Option C (optional)", "Option D (optional)"].map((ph, i) =>
      el("input", { type: "text", placeholder: ph, required: i < 2, maxlength: "60" }));
    const submit = el("button", { type: "submit", class: "btn btn-primary" }, ["Create poll"]);
    const form = el("form", { class: "form-stack", style: "margin-top:14px;" }, [
      el("div", { class: "field" }, [el("label", {}, ["Poll question"]), questionInput]),
      el("div", { class: "field" }, [el("label", {}, ["Options"]), el("div", { style: "display:grid;gap:8px;" }, optionInputs)]),
      el("div", { class: "row-gap", style: "justify-content:flex-end;margin-top:16px;" }, [
        el("button", { type: "button", class: "btn btn-ghost", onclick: () => close() }, ["Cancel"]), submit,
      ]),
    ]);
    const close = MedLink.modal("Create a poll", form);
    questionInput.focus();
    form.addEventListener("submit", async (e) => {
      e.preventDefault();
      const question = questionInput.value.trim();
      const options = optionInputs.map(i => i.value.trim()).filter(Boolean);
      if (!question || options.length < 2) { MedLink.toast("Add a question and at least 2 options.", "error"); return; }
      submit.disabled = true;
      try { await send({ kind: "poll", body: question, options }); close(); }
      catch (err) { MedLink.reportError(err); submit.disabled = false; }
    });
  }

  // ---------------- move groups saved on this device ----------------
  function localGroupsToMove() {
    try {
      const list = JSON.parse(localStorage.getItem(LOCAL_KEY) || "[]");
      // Skip the two starter groups nobody touched.
      return (Array.isArray(list) ? list : []).filter(g => g && g.name &&
        !(/^g_(friends|uni)_/.test(String(g.id)) && (g.members || []).length <= 1 && (g.messages || []).length <= 1));
    } catch (e) { return []; }
  }
  function forgetLocalGroups() { try { localStorage.removeItem(LOCAL_KEY); } catch (e) { /* private mode */ } }

  function localMoveBanner() {
    const local = localGroupsToMove();
    if (!local.length) { forgetLocalGroups(); return null; }
    const moveBtn = el("button", { type: "button", class: "btn btn-primary btn-sm" }, ["Move them online"]);
    const banner = el("div", { class: "card pad", style: "margin-bottom:18px;display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:12px;" }, [
      el("div", { style: "font-size:13.5px;line-height:1.5;max-width:620px;" }, [
        el("b", {}, [plural(local.length, "study group") + " saved only on this device. "]),
        "Move them online so the classmates you added can see them. Names and members move; old chat messages stay behind.",
      ]),
      el("div", { class: "row-gap" }, [
        el("button", { type: "button", class: "btn btn-ghost btn-sm", onclick: () => {
          if (confirm("Discard the groups saved on this device?")) { forgetLocalGroups(); banner.remove(); }
        } }, ["Discard"]),
        moveBtn,
      ]),
    ]);
    moveBtn.addEventListener("click", async () => {
      moveBtn.disabled = true;
      moveBtn.textContent = "Moving…";
      let missing = 0;
      try {
        for (const lg of local) {
          const raw = String(lg.name).trim();
          const name = (raw.length >= 2 ? raw : raw + " group").slice(0, 60);
          const g = await api.createGroup(name, String(lg.description || "").slice(0, 180));
          for (const m of lg.members || []) {
            if (!m || !m.username || m.username === me.username) continue;
            const found = await api.profileByUsername(String(m.username).toLowerCase()).catch(() => null);
            if (found) await api.addGroupMember(g.id, found.id).catch(() => { missing += 1; });
            else missing += 1;
          }
          // Drop each group from this device as soon as it's online, so a retry can't duplicate it.
          try {
            const rest = JSON.parse(localStorage.getItem(LOCAL_KEY) || "[]").filter(x => x && x.id !== lg.id);
            localStorage.setItem(LOCAL_KEY, JSON.stringify(rest));
          } catch (e) { /* private mode */ }
        }
        forgetLocalGroups();
        MedLink.toast("Your groups are online now." + (missing ? " " + plural(missing, "member") + " couldn't be found." : ""), "success");
        route();
      } catch (err) {
        MedLink.reportError(err);
        moveBtn.disabled = false;
        moveBtn.textContent = "Move them online";
      }
    });
    return banner;
  }

  route();
});
</script>
</body>
</html>
