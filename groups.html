<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="icon" href="favicon.ico" sizes="any">
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="manifest" href="site.webmanifest">
<meta name="theme-color" content="#FFFFFF">
<title>Study Groups — MedLink KE</title>
<script src="theme.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="styles.css">
<style>
.group-header { margin:0 0 24px; }
.groups-hero { position:relative; display:flex; align-items:flex-end; justify-content:space-between; gap:22px; overflow:hidden; padding:30px; border-radius:26px; background:linear-gradient(120deg,#10245d 0%,#1748b6 55%,#247de2 100%); color:#fff; box-shadow:0 18px 50px rgba(20,60,150,.2); }
.groups-hero::after { content:""; position:absolute; width:280px;height:280px;right:10%;top:-180px;border:1px solid rgba(255,255,255,.17);border-radius:50%;box-shadow:0 0 0 36px rgba(255,255,255,.04),0 0 0 72px rgba(255,255,255,.03);pointer-events:none; }
.groups-hero-copy,.groups-hero-aside { position:relative;z-index:1; }
.groups-eyebrow { display:inline-flex;align-items:center;gap:7px;margin-bottom:12px;color:#c9dbff;font-size:10px;font-weight:800;letter-spacing:.14em;text-transform:uppercase; }
.groups-eyebrow::before { content:"";width:7px;height:7px;border-radius:50%;background:#8df0d2;box-shadow:0 0 0 4px rgba(141,240,210,.15); }
.groups-hero h1 { color:#fff;font-size:30px;line-height:1.13;margin:0 0 9px;letter-spacing:-.04em; }
.groups-hero p { max-width:590px;margin:0;color:rgba(239,245,255,.78);font-size:13.5px;line-height:1.65; }
.groups-hero .btn { border-color:rgba(255,255,255,.18);background:#fff;color:#153b90;box-shadow:0 8px 22px rgba(4,24,80,.2);white-space:nowrap; }
.groups-hero .btn:hover { transform:translateY(-2px);box-shadow:0 12px 26px rgba(4,24,80,.25); }
.groups-hero-stats { display:flex;gap:10px;margin-top:20px; }
.groups-stat { min-width:95px;padding:10px 13px;border:1px solid rgba(255,255,255,.16);border-radius:13px;background:rgba(255,255,255,.08); }
.groups-stat b { display:block;color:#fff;font-size:16px;line-height:1.2; }
.groups-stat span { display:block;margin-top:3px;color:rgba(239,245,255,.68);font-size:10px;letter-spacing:.04em;text-transform:uppercase; }
.groups-grid { grid-template-columns:repeat(auto-fill,minmax(255px,1fr));gap:16px; }
.group-card { --group-accent:var(--accent); position:relative;min-height:218px;overflow:hidden;padding:20px;border:1px solid var(--border);border-radius:21px;background:var(--surface);box-shadow:var(--shadow-sm);cursor:default;transition:transform var(--ease),box-shadow var(--ease),border-color var(--ease); }
.group-card:hover { transform:translateY(-4px);border-color:color-mix(in srgb,var(--group-accent) 38%,var(--border));box-shadow:var(--shadow-md); }
.group-card::before { content:"";position:absolute;inset:0 0 auto;height:4px;background:linear-gradient(90deg,var(--group-accent),color-mix(in srgb,var(--group-accent) 35%,white)); }
.group-card-head { display:flex;align-items:center;justify-content:space-between;gap:8px; }
.group-card-icon { display:grid;place-items:center;width:43px;height:43px;border-radius:14px;background:color-mix(in srgb,var(--group-accent) 11%,var(--surface));color:var(--group-accent);font-size:20px; }
.group-tag { padding:6px 9px;border-radius:999px;font-size:9px;font-weight:800;letter-spacing:.09em;text-transform:uppercase;background:color-mix(in srgb,var(--group-accent) 10%,var(--surface));color:var(--group-accent); }
.group-card h3 { margin:15px 0 6px;font-size:16px;line-height:1.35;letter-spacing:-.02em; }
.group-card-desc { min-height:38px;margin:0;color:var(--text-2);font-size:12px;line-height:1.6; }
.group-card-foot { display:flex;align-items:center;justify-content:space-between;gap:10px;margin-top:17px;padding-top:13px;border-top:1px solid var(--border); }
.group-people { display:flex;align-items:center;padding-left:2px; }
.group-face { display:grid;place-items:center;width:27px;height:27px;margin-left:-4px;border:2px solid var(--surface);border-radius:50%;color:#fff;font-size:9px;font-weight:800; }
.group-more { margin-left:7px;color:var(--text-3);font-size:10px;white-space:nowrap; }
.group-open { border:0;background:none;color:var(--group-accent);font-family:inherit;font-size:11px;font-weight:700;padding:6px 0;cursor:pointer; }
.group-open:hover { text-decoration:underline; }
.group-view-header { align-items:center!important;margin-bottom:16px!important;padding:15px 17px;border:1px solid var(--border);border-radius:20px;background:var(--surface);box-shadow:var(--shadow-sm); }
.group-view-header > div:first-child { min-width:0; }
.group-view-header h1 { font-size:20px!important; }
.group-view-header p { color:var(--text-2); }
.group-members-panel { padding:7px 9px!important;border:1px solid var(--border)!important;border-radius:14px!important;background:var(--surface-2)!important; }
.chat-container { display:flex;flex-direction:column;height:calc(100vh - 275px);min-height:440px;overflow:hidden;border:1px solid var(--border);border-radius:24px;background:var(--surface);box-shadow:var(--shadow-md); }
.chat-messages { position:relative;isolation:isolate;flex:1;overflow-y:auto;display:flex;flex-direction:column;gap:12px;padding:22px;background-color:var(--surface-2);background-image:radial-gradient(circle at 1px 1px,color-mix(in srgb,var(--text-3) 15%,transparent) 1px,transparent 0);background-size:20px 20px; }
.chat-messages::before { content:"";position:absolute;inset:0;z-index:-1;background:linear-gradient(135deg,color-mix(in srgb,var(--surface) 64%,transparent),color-mix(in srgb,var(--surface) 84%,transparent));pointer-events:none; }
.chat-messages > * { position:relative;z-index:1; }
.chat-input-area { display:flex;gap:10px;align-items:center;position:relative;padding:13px 15px;border-top:1px solid var(--border);background:var(--surface); }
.chat-input-area > input { min-width:0;flex:1;padding:12px 15px!important;border:1px solid var(--border)!important;border-radius:14px!important;background:var(--surface-2);color:var(--text);font-size:13px; }
.chat-input-area > .btn { padding:10px 17px;border-radius:13px; }
.chat-menu-wrapper .btn-primary { color:var(--text-on-accent)!important;background:var(--btn-primary-bg)!important; }
.chat-msg { max-width:min(76%,620px);padding:12px 15px;border:1px solid var(--border);border-radius:18px 18px 18px 5px;background:color-mix(in srgb,var(--surface) 94%,transparent);color:var(--text);font-size:13px;line-height:1.6;box-shadow:0 4px 14px rgba(13,35,82,.06); }
.chat-msg.mine { align-self:flex-end;border-color:transparent;border-radius:18px 18px 5px 18px;background:linear-gradient(135deg,var(--btn-primary-bg),var(--accent));color:#fff; }
.chat-meta { margin-bottom:4px;color:var(--text-3);font-size:10px;font-weight:700;letter-spacing:.02em; }
.chat-msg.mine .chat-meta { color:rgba(255,255,255,.72); }
.poll-card { padding:14px;border:1px solid var(--border);border-radius:16px;background:var(--surface);box-shadow:var(--shadow-sm); }
.poll-option-btn { border-radius:12px;background:var(--surface-2); }
.chat-menu-dropdown { border:1px solid var(--border);border-radius:15px;background:var(--surface);box-shadow:var(--shadow-lg); }
.group-empty { grid-column:1/-1;min-height:180px;display:grid;place-items:center;border:1px dashed var(--border-strong);border-radius:22px;background:var(--surface); }
@media (max-width:760px) {
  .groups-hero { align-items:flex-start;flex-direction:column;padding:24px 21px;border-radius:22px; }
  .groups-hero h1 { font-size:26px; }
  .groups-hero .btn { width:100%; }
  .groups-grid { grid-template-columns:1fr; }
  .group-view-header { align-items:flex-start!important; }
  .chat-container { height:calc(100dvh - 310px);min-height:360px; }
  .chat-messages { padding:15px; }
  .chat-msg { max-width:88%; }
}

/* Keep group conversations polished and low contrast */
.chat-container { box-shadow:0 12px 34px rgba(15,35,75,.075); }
.chat-messages { background-size:24px 24px; }
.chat-msg {
  border-color:var(--border);
  background:color-mix(in srgb,var(--surface) 96%,transparent);
  box-shadow:0 2px 8px rgba(15,35,75,.035);
}
.chat-msg.mine {
  border-color:color-mix(in srgb,var(--accent) 20%,var(--border));
  background:color-mix(in srgb,var(--accent) 12%,var(--surface));
  color:var(--text);
}
.chat-msg.mine .chat-meta { color:var(--text-3); }
.chat-input-area { background:color-mix(in srgb,var(--surface) 94%,var(--surface-2)); }
.chat-input-area > input { box-shadow:inset 0 1px 2px rgba(10,30,70,.025); }
.chat-input-area > .btn { box-shadow:0 2px 7px rgba(10,30,70,.08); }

.group-back { flex:0 0 auto; border-color:var(--border)!important; background:var(--surface-2)!important; color:var(--text-2)!important; }
.group-back:hover { border-color:var(--border-strong)!important; color:var(--accent)!important; }
.chat-image-wrap { display:grid;gap:6px; }
.chat-image-preview { display:block;max-width:min(100%,520px);max-height:340px;object-fit:contain;border-radius:12px;border:1px solid var(--border); }
.chat-image-caption { font-size:11px;color:var(--text-3);overflow-wrap:anywhere; }
.chat-msg.poll-message { max-width:min(88%,680px);padding:8px;border:0;background:transparent!important;box-shadow:none; }
.poll-card { width:min(100%,540px);padding:16px;border:1px solid var(--border);border-radius:17px;background:var(--surface);box-shadow:0 5px 18px rgba(13,35,82,.06); }
.poll-card-label { margin-bottom:6px;color:var(--accent);font-size:9px;font-weight:800;letter-spacing:.12em; }
.poll-question { margin-bottom:12px;color:var(--text);font-size:14px;font-weight:700;line-height:1.45; }
.poll-options { display:flex;flex-direction:column;gap:8px; }
.poll-option-btn { display:block;width:100%;min-height:42px;margin:0;padding:10px 12px;text-align:left;border:1px solid var(--border)!important;border-radius:12px!important;background:var(--surface-2)!important;color:var(--text);position:relative;overflow:hidden;cursor:pointer; }
.poll-option-btn:hover { border-color:color-mix(in srgb,var(--accent) 42%,var(--border))!important;background:color-mix(in srgb,var(--accent-soft) 35%,var(--surface))!important; }
.poll-option-btn.selected { border-color:color-mix(in srgb,var(--accent) 52%,var(--border))!important;background:color-mix(in srgb,var(--accent-soft) 56%,var(--surface))!important; }
.poll-option-btn .poll-bar { position:absolute;inset:0 auto 0 0;z-index:0;border-radius:inherit;background:color-mix(in srgb,var(--accent) 9%,transparent);transition:width .25s ease; }
.poll-option-content { position:relative;z-index:1;display:flex;align-items:center;justify-content:space-between;gap:10px; }
.poll-option-label { font-size:12px;font-weight:600; }
.poll-option-result { flex:0 0 auto;color:var(--text-3);font-size:10px;font-weight:650; }
.poll-card-foot { margin-top:10px;color:var(--text-3);font-size:10px; }
.poll-builder { gap:14px; }
.poll-builder-heading { display:flex;align-items:center;justify-content:space-between;margin-bottom:8px; }
.poll-builder-options { display:grid;gap:8px; }
.poll-choice-row { display:flex;gap:8px;align-items:center; }
.poll-choice-row input { flex:1;min-width:0; }
.poll-remove-choice { width:38px;height:38px;padding:0;border-radius:11px!important;font-size:19px; }
.poll-add-choice { align-self:flex-start;margin-top:9px; }
.poll-builder .field-hint { font-size:11px; }
@media(max-width:560px) {
  .poll-card { padding:13px; }
  .chat-msg.poll-message { max-width:96%; }
  .group-back { padding:8px 10px; }
}
</style>
</head>
<body>
<main id="page" hidden>
<div class="fade-in" id="groups-root"></div>
</main>

<script src="config.js"></script>
<script src="data.js"></script>
<script src="app.js"></script>
<script>
MedLink.run({ page: "groups" }, async ({ api, me }) => {
  const root = qs("#groups-root");
  const STORAGE_KEY = "medlink_study_groups_" + (me ? me.id : "guest");

  function loadGroups() {
    try {
      const saved = localStorage.getItem(STORAGE_KEY);
      if (saved) return JSON.parse(saved);
    } catch (e) {}
    // Starter templates tailored to the user's university & units
    return [
      {
        id: "g_friends_" + Date.now(),
        name: "Inner Circle Study Buddies",
        type: "friends",
        typeLabel: "Close Study Friends",
        description: "Private study circle for revisions, daily targets, and discussing tricky concepts.",
        creator: me.username,
        members: [
          { username: me.username, name: me.full_name, color: me.color }
        ],
        messages: [
          { sender: me.username, text: "Hey! Added you to our study circle.", time: "Just now" }
        ],
        createdAt: new Date().toISOString()
      },
      {
        id: "g_uni_" + (Date.now() + 1),
        name: (uniLabel(me) || "Campus") + " Class Peers",
        type: "university",
        typeLabel: "University",
        description: "Connect and prepare exams with peers from " + (uniFull(me) || "our university") + ".",
        creator: me.username,
        members: [
          { username: me.username, name: me.full_name, color: me.color }
        ],
        messages: [],
        createdAt: new Date().toISOString()
      }
    ];
  }

  function saveGroups(groups) {
    try {
      localStorage.setItem(STORAGE_KEY, JSON.stringify(groups));
      return true;
    } catch (e) { return false; }
  }

  let groups = loadGroups();
  let activeGroupId = null;

  document.addEventListener("click", event => {
    if (event.target.closest && event.target.closest(".chat-menu-wrapper")) return;
    qsa(".chat-menu-dropdown.show").forEach(menu => menu.classList.remove("show"));
  });

  // Handle direct hash navigation if user refreshes inside a group page
  function checkHash() {
    const hash = window.location.hash;
    if (hash && hash.startsWith("#group=")) {
      const id = hash.replace("#group=", "");
      if (groups.some(g => g.id === id)) {
        activeGroupId = id;
      }
    }
  }
  checkHash();

  window.addEventListener("hashchange", () => {
    const hash = window.location.hash;
    if (hash && hash.startsWith("#group=")) {
      activeGroupId = hash.replace("#group=", "");
    } else {
      activeGroupId = null;
    }
    renderView();
  });

  function renderView() {
    root.replaceChildren();

    if (activeGroupId) {
      window.location.hash = "group=" + activeGroupId;
      renderGroupPage(activeGroupId);
      return;
    } else {
      if (window.location.hash.startsWith("#group=")) {
        history.pushState("", document.title, window.location.pathname + window.location.search);
      }
    }

    const totalMembers = groups.reduce((total, group) => total + (group.members || []).length, 0);
    const topHeader = el("section", { class: "group-header groups-hero" }, [
      el("div", { class: "groups-hero-copy" }, [
        el("div", { class: "groups-eyebrow" }, ["Your study community"]),
        el("h1", {}, ["Study groups"]),
        el("p", {}, ["Bring your classmates together, share what you’re learning, and make exam prep feel more connected."]),
        el("div", { class: "groups-hero-stats" }, [
          el("div", { class: "groups-stat" }, [el("b", {}, [String(groups.length)]), el("span", {}, ["Your groups"])]),
          el("div", { class: "groups-stat" }, [el("b", {}, [String(totalMembers)]), el("span", {}, ["Group seats"])]),
        ]),
      ]),
      el("div", { class: "groups-hero-aside" }, [
        el("button", { type: "button", class: "btn", onclick: openCreateModal }, ["＋ Create a group"]),
      ]),
    ]);

    const grid = el("div", { class: "grid grid-fill-260 groups-grid" });

    if (!groups.length) {
      grid.appendChild(MedLink.emptyState("No study groups yet. Create your first group and invite peers by username!",
        el("button", { class: "btn btn-primary btn-sm", onclick: openCreateModal }, ["Create group"])
      ));
    } else {
      groups.forEach(g => {
        grid.appendChild(renderGroupCard(g));
      });
    }

    root.append(topHeader, grid);
  }

  function renderGroupCard(g) {
    const tone = g.type === "friends" ? "#7357ef" : g.type === "unit" ? "#0c9b87" : g.type === "university" ? "#e78331" : "#1a56f0";
    const iconName = g.type === "friends" ? "✦" : g.type === "unit" ? "⌘" : g.type === "university" ? "⌂" : "✧";
    const members = g.members || [];
    const faces = members.slice(0, 4).map(member => el("span", {
      class: "group-face",
      style: "background:" + safeColor(member.color),
      title: member.name || member.username,
    }, [initials(member.name || member.username)]));
    if (members.length > 4) faces.push(el("span", { class: "group-more" }, ["+" + (members.length - 4) + " more"]));
    const latest = (g.messages || []).slice(-1)[0];
    return el("article", { class: "card group-card", style: "--group-accent:" + tone }, [
      el("div", { class: "group-card-head" }, [
        el("span", { class: "group-card-icon", "aria-hidden": "true" }, [iconName]),
        el("span", { class: "group-tag" }, [g.typeLabel || g.type || "Study group"]),
      ]),
      el("h3", {}, [g.name]),
      el("p", { class: "group-card-desc" }, [g.description || "A focused space to learn and revise together."]),
      el("div", { class: "group-card-foot" }, [
        el("div", { class: "group-people", "aria-label": members.length + " group members" }, [
          ...faces,
          el("span", { class: "group-more" }, [members.length + (members.length === 1 ? " member" : " members")]),
        ]),
        el("button", { type: "button", class: "group-open", onclick: () => {
          activeGroupId = g.id;
          renderView();
        } }, [latest ? "Continue chat →" : "Open group →"]),
      ]),
    ]);
  }

  function renderGroupPage(groupId) {
    const g = groups.find(x => x.id === groupId);
    if (!g) {
      activeGroupId = null;
      renderView();
      return;
    }

    const header = el("div", { 
      class: "group-view-header", 
      style: "display:flex;justify-content:space-between;align-items:flex-start;flex-wrap:wrap;gap:16px;margin-bottom:20px;" 
    }, [
      el("div", { style: "display:flex;align-items:center;gap:12px;" }, [
        el("button", { 
          class: "btn btn-ghost btn-sm group-back", 
          style: "display:flex;align-items:center;gap:6px;font-weight:600;",
          onclick: () => { 
            activeGroupId = null; 
            history.pushState("", document.title, window.location.pathname + window.location.search);
            renderView(); 
          } 
        }, [
          el("span", {}, ["←"]),
          el("span", {}, ["All study groups"])
        ]),
        el("div", {}, [
          el("h1", { class: "disp", style: "font-size:22px;margin:0;" }, [g.name]),
          el("p", { class: "muted", style: "font-size:13px;margin:2px 0 0;" }, [g.description || ""])
        ])
      ]),
      // Top Right Compact Members Box
      el("div", { 
        class: "card group-members-panel", 
        style: "padding:8px 12px;background:var(--card-bg);border:1px solid var(--border);border-radius:10px;display:flex;align-items:center;gap:10px;" 
      }, [
        el("div", { style: "display:flex;align-items:center;gap:6px;" }, [
          el("span", { style: "font-size:12px;font-weight:600;color:var(--muted);" }, ["Members:"]),
          el("div", { style: "display:flex;align-items:center;gap:4px;max-width:240px;overflow-x:auto;padding-bottom:2px;" }, 
            g.members.map(m => {
              const isMe = m.username === me.username;
              return el("span", {
                title: "@" + m.username + (isMe ? " (You)" : ""),
                style: "display:inline-flex;align-items:center;justify-content:center;width:24px;height:24px;border-radius:50%;background:" + safeColor(m.color) + ";color:#fff;font-size:10px;font-weight:700;cursor:pointer;position:relative;",
                onclick: () => {
                  if (!isMe && confirm("Remove @" + m.username + " from group?")) {
                    g.members = g.members.filter(x => x.username !== m.username);
                    saveGroups(groups);
                    renderView();
                  }
                }
              }, [initials(m.name || m.username)]);
            })
          )
        ]),
        el("button", {
          class: "btn btn-primary btn-sm",
          style: "padding:4px 8px;font-size:11px;border-radius:6px;",
          onclick: () => openAddMemberModal(g)
        }, ["+ Add"]),
        el("button", {
          class: "btn btn-ghost btn-sm",
          style: "padding:4px 6px;font-size:11px;color:var(--error);",
          title: "Delete group",
          onclick: () => {
            if (confirm("Delete this group and all its messages?")) {
              groups = groups.filter(x => x.id !== g.id);
              saveGroups(groups);
              activeGroupId = null;
              history.pushState("", document.title, window.location.pathname + window.location.search);
              renderView();
            }
          }
        }, ["🗑"])
      ])
    ]);

    // Main Chat Area
    const chatMsgs = el("div", { class: "chat-messages" });
    (g.messages || []).forEach(msg => {
      const isMine = msg.sender === me.username;
      
      let contentNode = el("div", {}, [msg.text]);
      if (msg.type === "image") {
        contentNode = el("div", { class: "chat-image-wrap" }, [
          el("img", { src: msg.url, alt: msg.text || "Shared image", loading: "lazy", class: "chat-image-preview" }),
          msg.text && msg.text !== "Shared an image" ? el("span", { class: "chat-image-caption" }, [msg.text]) : null,
        ]);
      } else if (msg.type === "poll") {
        const pollOptions = Array.isArray(msg.options) ? msg.options : [];
        msg.votes = msg.votes || {};
        msg.userVotes = msg.userVotes || {};
        const totalVotes = Object.values(msg.votes).reduce((total, value) => total + Number(value || 0), 0);
        const selected = msg.userVotes[me.username];
        const optionsList = el("div", { class: "poll-options" });
        pollOptions.forEach((option, optionIndex) => {
          const count = Number(msg.votes[optionIndex] || 0);
          const pct = totalVotes ? Math.round(count / totalVotes * 100) : 0;
          const isSelected = selected === optionIndex;
          optionsList.appendChild(el("button", {
            type: "button",
            class: "poll-option-btn" + (isSelected ? " selected" : ""),
            "aria-pressed": String(isSelected),
            onclick: () => {
              const previous = msg.userVotes[me.username];
              if (previous !== undefined) msg.votes[previous] = Math.max(0, Number(msg.votes[previous] || 0) - 1);
              msg.userVotes[me.username] = optionIndex;
              msg.votes[optionIndex] = Number(msg.votes[optionIndex] || 0) + 1;
              saveGroups(groups);
              renderView();
            }
          }, [
            el("span", { class: "poll-bar", style: "width:" + pct + "%" }),
            el("span", { class: "poll-option-content" }, [
              el("span", { class: "poll-option-label" }, [option]),
              el("span", { class: "poll-option-result" }, [count + " · " + pct + "%"]),
            ]),
          ]));
        });
        contentNode = el("div", { class: "poll-card" }, [
          el("div", { class: "poll-card-label" }, ["STUDY GROUP POLL"]),
          el("div", { class: "poll-question" }, [msg.question || "Poll"]),
          optionsList,
          el("div", { class: "poll-card-foot" }, [totalVotes + (totalVotes === 1 ? " vote" : " votes") + " · Tap a choice to vote"]),
        ]);
      }

      chatMsgs.appendChild(el("div", { class: "chat-msg" + (isMine ? " mine" : "") + (msg.type === "poll" ? " poll-message" : "") }, [
        el("div", { class: "chat-meta" }, ["@" + msg.sender + " · " + (msg.time || "")]),
        contentNode
      ]));
    });
    // Scroll to bottom
    setTimeout(() => chatMsgs.scrollTop = chatMsgs.scrollHeight, 10);

    const chatInput = el("input", {
      type: "text",
      placeholder: "Write a message...",
      style: "flex:1;padding:10px 14px;border:1px solid var(--border);border-radius:10px;"
    });

    const imagePicker = el("input", { type: "file", accept: "image/*", hidden: true, "aria-label": "Choose an image to share" });
    imagePicker.addEventListener("change", () => {
      const file = imagePicker.files && imagePicker.files[0];
      imagePicker.value = "";
      if (!file) return;
      if (!/^image\//i.test(file.type)) {
        MedLink.toast("Choose an image file.", "error");
        return;
      }
      if (file.size > 8 * 1024 * 1024) {
        MedLink.toast("Choose an image smaller than 8 MB.", "error");
        return;
      }
      const reader = new FileReader();
      reader.onerror = () => MedLink.toast("The image could not be read. Try another file.", "error");
      reader.onload = () => {
        const image = new Image();
        image.onerror = () => MedLink.toast("The image could not be opened.", "error");
        image.onload = () => {
          const scale = Math.min(1, 1400 / Math.max(image.naturalWidth, image.naturalHeight));
          const canvas = document.createElement("canvas");
          canvas.width = Math.max(1, Math.round(image.naturalWidth * scale));
          canvas.height = Math.max(1, Math.round(image.naturalHeight * scale));
          const context = canvas.getContext("2d");
          if (!context) {
            MedLink.toast("This image cannot be prepared for sharing.", "error");
            return;
          }
          context.drawImage(image, 0, 0, canvas.width, canvas.height);
          const dataUrl = canvas.toDataURL("image/jpeg", .78);
          g.messages = g.messages || [];
          g.messages.push({
            sender: me.username,
            type: "image",
            url: dataUrl,
            text: file.name || "Shared an image",
            time: "Just now",
          });
          if (!saveGroups(groups)) {
            g.messages.pop();
            MedLink.toast("There isn't enough browser storage to save this image.", "error");
            return;
          }
          renderView();
        };
        image.src = reader.result;
      };
      reader.readAsDataURL(file);
    });

    const menuDropdown = el("div", { class: "chat-menu-dropdown", role: "menu" }, [
      el("button", {
        type: "button",
        role: "menuitem",
        onclick: () => { menuDropdown.classList.remove("show"); imagePicker.click(); }
      }, ["▧  Share image"]),
      el("button", {
        type: "button",
        role: "menuitem",
        onclick: () => { menuDropdown.classList.remove("show"); openPollModal(g); }
      }, ["▤  Create poll"]),
    ]);

    const plusBtn = el("button", {
      type: "button",
      class: "btn btn-primary chat-attach-btn",
      "aria-haspopup": "menu",
      "aria-expanded": "false",
      "aria-label": "Open chat attachments and poll menu",
      title: "Share an image or create a poll",
      onclick: event => {
        event.preventDefault();
        event.stopPropagation();
        const isOpen = menuDropdown.classList.toggle("show");
        plusBtn.setAttribute("aria-expanded", String(isOpen));
      }
    }, ["⋮"]);
    const menuWrap = el("div", { class: "chat-menu-wrapper" }, [plusBtn, menuDropdown, imagePicker]);

    const chatForm = el("form", {
      class: "chat-input-area",
      onsubmit: (e) => {
        e.preventDefault();
        const text = chatInput.value.trim();
        if (!text) return;
        g.messages = g.messages || [];
        g.messages.push({ sender: me.username, type: "text", text, time: "Just now" });
        saveGroups(groups);
        chatInput.value = "";
        renderView();
      }
    }, [
      menuWrap,
      chatInput,
      el("button", { class: "btn btn-primary" }, ["Send"])
    ]);

    const mainChat = el("div", { class: "chat-container" }, [
      chatMsgs,
      chatForm
    ]);

    root.append(header, mainChat);
  }

  function renderGroupCard_old(g) {
    // keeping old for reference or fallback
  }

  function openPollModal(group) {
    const questionInput = el("input", {
      type: "text", maxlength: "180", required: true,
      placeholder: "e.g. Which topic should we revise next?",
      "aria-label": "Poll question",
    });
    let choices = ["", ""];
    const choicesWrap = el("div", { class: "poll-builder-options" });
    const choiceCount = el("span", { class: "faint" }, ["2 of 10"]);
    const hint = el("div", { class: "field-hint" }, ["Add 2 to 10 choices. Students can change their vote."]);
    const addChoice = el("button", { type: "button", class: "btn btn-ghost btn-sm poll-add-choice" }, ["＋ Add a choice"]);
    const error = el("div", { class: "field-error hidden", role: "alert" }, ["Enter a question and at least two choices."]);
    function paintChoices(focusIndex) {
      choicesWrap.replaceChildren(...choices.map((value, index) => {
        const input = el("input", {
          type: "text", maxlength: "100", required: true, value,
          placeholder: "Choice " + (index + 1),
          "aria-label": "Choice " + (index + 1),
          "data-choice-index": String(index),
        });
        input.addEventListener("input", () => { choices[index] = input.value; error.classList.add("hidden"); });
        const remove = el("button", {
          type: "button", class: "btn btn-ghost btn-sm poll-remove-choice",
          "aria-label": "Remove choice " + (index + 1),
          disabled: choices.length <= 2,
          onclick: () => { choices.splice(index, 1); paintChoices(); },
        }, ["×"]);
        return el("div", { class: "poll-choice-row" }, [input, remove]);
      }));
      addChoice.disabled = choices.length >= 10;
      addChoice.textContent = choices.length >= 10 ? "Maximum 10 choices" : "＋ Add a choice";
      choiceCount.textContent = choices.length + " of 10";
      if (focusIndex != null) {
        const focus = qs('[data-choice-index="' + focusIndex + '"]', choicesWrap);
        if (focus) focus.focus();
      }
    }
    addChoice.addEventListener("click", () => {
      if (choices.length >= 10) return;
      choices.push("");
      paintChoices(choices.length - 1);
    });
    const form = el("form", { class: "form-stack poll-builder" }, [
      el("div", { class: "field" }, [
        el("label", {}, ["Question"]),
        questionInput,
      ]),
      el("div", { class: "field" }, [
        el("div", { class: "poll-builder-heading" }, [
          el("label", {}, ["Choices"]),
          choiceCount,
        ]),
        choicesWrap,
        addChoice,
        hint,
        error,
      ]),
      el("div", { class: "row-gap", style: "justify-content:flex-end;margin-top:8px" }, [
        el("button", { type: "button", class: "btn btn-ghost", onclick: () => close() }, ["Cancel"]),
        el("button", { type: "submit", class: "btn btn-primary" }, ["Post poll"]),
      ]),
    ]);
    paintChoices();
    form.addEventListener("submit", event => {
      event.preventDefault();
      const question = questionInput.value.trim();
      const options = choices.map(choice => choice.trim()).filter(Boolean);
      if (!question || options.length < 2 || options.length !== choices.length) {
        error.classList.remove("hidden");
        const firstEmpty = choices.findIndex(choice => !choice.trim());
        if (firstEmpty >= 0) qs('[data-choice-index="' + firstEmpty + '"]', choicesWrap).focus();
        else questionInput.focus();
        return;
      }
      group.messages = group.messages || [];
      group.messages.push({
        sender: me.username,
        type: "poll",
        question,
        options,
        votes: {},
        userVotes: {},
        time: "Just now",
      });
      if (!saveGroups(groups)) {
        group.messages.pop();
        MedLink.toast("There isn't enough browser storage to save this poll.", "error");
        return;
      }
      close();
      renderView();
    });
    const close = MedLink.modal("Create a poll", form);
  }

  function openCreateModal() {
    const nameInput = el("input", { type: "text", placeholder: "e.g. 3rd Year Histology Crushes", required: true, maxlength: 60 });
    const descInput = el("textarea", { rows: 2, placeholder: "What will this group focus on?", maxlength: 180 });

    const form = el("form", { class: "form-stack", style: "margin-top:14px;" }, [
      el("div", { class: "field" }, [
        el("label", {}, ["Group Name"]),
        nameInput
      ]),
      el("div", { class: "field" }, [
        el("label", {}, ["Short Description"]),
        descInput
      ]),
      el("div", { class: "row-gap", style: "justify-content:flex-end;margin-top:16px;" }, [
        el("button", { type: "button", class: "btn btn-ghost", onclick: () => close() }, ["Cancel"]),
        el("button", { type: "submit", class: "btn btn-primary" }, ["Create group"])
      ])
    ]);

    form.addEventListener("submit", (e) => {
      e.preventDefault();
      const name = nameInput.value.trim();
      if (!name) return;

      const newGroup = {
        id: "g_" + Date.now(),
        name,
        type: "custom",
        typeLabel: "Study Group",
        description: descInput.value.trim() || "Custom study group",
        creator: me.username,
        members: [{ username: me.username, name: me.full_name, color: me.color }],
        messages: [{ sender: me.username, text: "Group created! Add friends by username above.", time: "Just now" }],
        createdAt: new Date().toISOString()
      };

      groups.unshift(newGroup);
      saveGroups(groups);
      close();
      renderView();
      MedLink.toast("Study group created!", "success");
    });

    const close = MedLink.modal("Create a Study Group", form);
  }

  function openAddMemberModal(group) {
    const userInput = el("input", {
      type: "text",
      placeholder: "Enter student username without @",
      required: true,
      autocomplete: "off",
      autocapitalize: "none"
    });
    const statusMsg = el("div", { class: "field-hint", style: "margin-top:6px;" }, ["Search any classmate on MedLink by their @username."]);

    const form = el("form", { class: "form-stack", style: "margin-top:14px;" }, [
      el("div", { class: "field" }, [
        el("label", {}, ["Student's Username"]),
        userInput,
        statusMsg
      ]),
      el("div", { class: "row-gap", style: "justify-content:flex-end;margin-top:16px;" }, [
        el("button", { type: "button", class: "btn btn-ghost", onclick: () => close() }, ["Cancel"]),
        el("button", { type: "submit", class: "btn btn-primary" }, ["Add student"])
      ])
    ]);

    form.addEventListener("submit", async (e) => {
      e.preventDefault();
      const targetUser = userInput.value.trim().toLowerCase().replace(/^@/, "");
      if (!targetUser) return;

      if (group.members.some(m => m.username.toLowerCase() === targetUser)) {
        MedLink.toast("@" + targetUser + " is already in this group.", "error");
        return;
      }

      statusMsg.textContent = "Checking username @" + targetUser + "…";

      try {
        const found = await api.profileByUsername(targetUser);
        if (!found) {
          statusMsg.textContent = "Student @" + targetUser + " not found. Double check the spelling.";
          MedLink.toast("Student @" + targetUser + " not found.", "error");
          return;
        }

        group.members.push({
          username: found.username,
          name: found.full_name,
          color: found.color
        });
        saveGroups(groups);
        close();
        renderView();
        MedLink.toast("Added @" + found.username + " to the group!", "success");
      } catch (err) {
        statusMsg.textContent = "Could not check username. Please try again.";
        MedLink.reportError(err);
      }
    });

    const close = MedLink.modal("Add Student to " + group.name, form);
  }

  renderView();
});
</script>
</body>
