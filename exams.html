<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="icon" href="favicon.ico" sizes="any">
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="manifest" href="site.webmanifest">
<meta name="theme-color" content="#FFFFFF">
<title>Exam Bank — MedLink KE</title>
<script src="theme.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="styles.css">
<style>
.exam-papers-layout { display: grid; grid-template-columns: minmax(0, 1fr) minmax(280px, 340px); gap: 20px; align-items: start; }
.exam-papers-upload { position: sticky; top: calc(var(--header-h) + 18px); }
@media (max-width: 900px) {
  .exam-papers-layout { grid-template-columns: 1fr; }
  .exam-papers-upload { position: static; }
}
</style>
</head>
<body>
<main id="page" hidden>
<div class="fade-in">
  <div class="page-head">
    <div>
      <h1>Exam bank</h1>
      <p>Access shared past papers and practice questions. Add a paper to help grow the collection.</p>
    </div>
    <div class="pill-tabs" id="tabs"></div>
  </div>
  <section id="tab-papers" hidden></section>
  <section id="tab-practice" hidden></section>
  <section id="tab-online" hidden></section>
</div>
</main>

<script src="config.js"></script>
<script src="data.js"></script>
<script src="app.js"></script>
<script>
MedLink.run({ page: "exams" }, async ({ api, me, role }) => {
  const TABS = [["papers", "Past papers"], ["practice", "Practice questions"], ["online", "Find papers online"]];
  const tabs = qs("#tabs");
  const show = key => {
    TABS.forEach(([k]) => { qs("#tab-" + k).hidden = k !== key; });
    qsa("button", tabs).forEach(b => b.classList.toggle("on", b.dataset.key === key));
    history.replaceState(null, "", "#" + key);
  };
  TABS.forEach(([key, label]) => tabs.appendChild(el("button", { type: "button", "data-key": key, onclick: () => show(key) }, [label])));
  show(TABS.some(t => "#" + t[0] === location.hash) ? location.hash.slice(1) : "papers");
  const staffNote = role ? el("a", { class: "btn btn-primary btn-sm", href: "admin.html#exams" }, ["+ Add questions or papers"]) : null;

  // ---------- practice sets ----------
  const practice = qs("#tab-practice");
  practice.appendChild(MedLink.loadingState());
  const [sets, attempts, papers, sources, uploadedPaperResources] = await Promise.all([
    api.examSets().catch(() => []), api.myAttempts().catch(() => []), api.examPapers().catch(() => []), api.examSources().catch(() => []),
    api.resources({ type: "Past Paper", limit: 300 }).catch(() => []),
  ]);
  let uploadedPapers = uploadedPaperResources;
  const best = {};
  attempts.forEach(a => { const pct = a.score / a.total; if (!(a.set_id in best) || pct > best[a.set_id]) best[a.set_id] = pct; });
  const subjects = Array.from(new Set(sets.map(s => s.subject).filter(Boolean))).sort();
  let subject = "", q = "";
  const filterRow = el("div", { class: "pill-tabs" });
  const search = el("input", { type: "search", class: "filter-select", placeholder: "Search sets…", style: "border-radius:999px;min-width:180px", "aria-label": "Search practice sets" });
  const grid = el("div", { class: "grid grid-fill-260" });
  const setCard = s => {
    const color = subjectColor(s.subject);
    const n = count(s.exam_questions);
    return el("div", { class: "card set-card", style: `--sc:${color};--sc-soft:color-mix(in srgb, ${color} 12%, transparent)` }, [
      el("span", { class: "subject" }, [s.subject || "General"]),
      el("h3", {}, [s.title]),
      el("div", { class: "set-meta" }, [plural(n, "question") + (s.source ? " · " + s.source : "") + (s.published ? "" : " · Draft")]),
      s.id in best ? el("div", { class: "best" }, ["Your best: " + Math.round(best[s.id] * 100) + "%"]) : null,
      el("a", { class: "btn btn-dark btn-block", href: "practice.html?id=" + encodeURIComponent(s.id), "data-track": "exam_open" }, [s.id in best ? "Practise again" : "Start practising"]),
    ]);
  };
  const paint = () => {
    const shown = sets.filter(s => (!subject || s.subject === subject) && (!q || (s.title + " " + s.subject + " " + s.unit).toLowerCase().includes(q)));
    grid.replaceChildren(...(shown.length ? shown.map(setCard) : [MedLink.emptyState("No sets match.")]));
  };
  [["", "All"]].concat(subjects.map(x => [x, x])).forEach(([val, label]) => filterRow.appendChild(el("button", {
    type: "button", class: val === subject ? "on" : null,
    onclick: ev => { subject = val; qsa("button", filterRow).forEach(b => b.classList.remove("on")); ev.currentTarget.classList.add("on"); paint(); },
  }, [label])));
  search.addEventListener("input", () => { q = search.value.trim().toLowerCase(); paint(); });

  if (sets.length) {
    practice.replaceChildren(el("div", { class: "section-heading", style: "flex-wrap:wrap" }, [filterRow, el("div", { class: "row-gap" }, [search, staffNote])]), grid);
    paint();
  } else {
    // Nothing imported yet: offer the built-in starter quiz, honestly labelled.
    practice.replaceChildren(
      el("div", { class: "grid grid-fill-260" }, [el("div", { class: "card set-card" }, [
        el("span", { class: "subject" }, ["Mixed"]),
        el("h3", {}, ["Starter quiz"]),
        el("div", { class: "set-meta" }, [plural(SAMPLE_QUIZ.length, "question") + " · anatomy, physiology & biochemistry"]),
        el("a", { class: "btn btn-dark btn-block", href: "practice.html?id=starter" }, ["Start practising"]),
      ])]),
      el("p", { class: "muted", style: "font-size:13.5px;margin-top:18px" }, [role
        ? "No question sets yet. Import hundreds of free, explained MCQs by subject from Admin → Exam bank."
        : "More question sets are on the way."]),
      ...(staffNote ? [staffNote] : []),
    );
  }

  // ---------- past papers ----------
  const papersBox = qs("#tab-papers");
  const paperList = el("div");
  const paperTitle = el("input", { id: "paper-upload-title", type: "text", maxlength: "140", minlength: "3", required: true, placeholder: "e.g. Anatomy II — End of Semester Exam", "aria-label": "Past paper title" });
  const OTHER_UNIVERSITY = "__other";
  const isCuratedUniversity = id => UNIVERSITIES.some(u => u.id === id);
  let paperUniversityId = isCuratedUniversity(me.university_id) ? me.university_id
    : (me.university_name ? "" : (UNIVERSITIES[0] && UNIVERSITIES[0].id) || "");
  let otherUniversityName = paperUniversityId ? "" : (me.university_name || "");
  const paperUniversity = el("select", { id: "paper-upload-university", required: true, "aria-label": "University or institution" });
  const paperUniversityOther = el("input", { id: "paper-upload-university-other", type: "text", maxlength: "120", minlength: "3", placeholder: "Type your institution's full name", "aria-label": "Other university or institution" });
  const paperUniversityOtherField = el("div", { class: "field", hidden: true }, [
    el("label", { for: "paper-upload-university-other" }, ["Institution name *"]),
    paperUniversityOther,
  ]);
  const paperUnit = el("input", { id: "paper-upload-unit", type: "text", maxlength: "120", minlength: "1", required: true, placeholder: "e.g. Human Anatomy", "aria-label": "Unit or subject" });
  const paperCourse = el("select", { id: "paper-upload-course", required: true, "aria-label": "Course or programme" });
  const paperLevel = el("input", { id: "paper-upload-level", type: "text", maxlength: "60", minlength: "1", required: true, placeholder: "e.g. Year 2, Clinical years, Level 300", "aria-label": "Relevant year or level" });
  const paperFile = el("input", { id: "paper-upload-file", type: "file", accept: "application/pdf,.pdf", required: true, "aria-label": "PDF past paper" });

  const courseChoicesForUniversity = universityId => {
    if (!universityId) return COURSES;
    const isKMTC = universityId === "kmtc";
    return COURSES.filter(c => {
      const belongs = universityOffersCourse(universityId, c.id);
      return isKMTC ? (belongs || COURSE_CATEGORIES.KMTC.includes(c.id)) : belongs;
    });
  };
  const renderPaperUniversity = () => {
    paperUniversity.replaceChildren(
      ...UNIVERSITIES.map(u => el("option", { value: u.id }, [`${u.name} (${u.abbreviation})`])),
      el("option", { value: OTHER_UNIVERSITY }, ["My institution isn't listed…"]),
    );
    const isOther = !isCuratedUniversity(paperUniversityId);
    paperUniversity.value = isOther ? OTHER_UNIVERSITY : paperUniversityId;
    paperUniversityOtherField.hidden = !isOther;
    paperUniversityOther.required = isOther;
    paperUniversityOther.value = isOther ? otherUniversityName : "";
  };
  const renderPaperCourses = requestedCourseId => {
    const universityId = isCuratedUniversity(paperUniversityId) ? paperUniversityId : "";
    const courses = courseChoicesForUniversity(universityId);
    const placeholder = el("option", { value: "", disabled: true }, ["Select your course or program…"]);
    const selectedCourseId = courses.some(c => c.id === requestedCourseId) ? requestedCourseId : "";
    if (universityId === "kmtc") {
      const diploma = el("optgroup", { label: "——— DIPLOMA COURSES ———" });
      const higherDiploma = el("optgroup", { label: "——— HIGHER DIPLOMA COURSES ———" });
      const general = el("optgroup", { label: "——— GENERAL COURSES ———" });
      courses.forEach(c => {
        const option = el("option", { value: c.id }, [c.name]);
        if (KMTC_DIPLOMA.includes(c.id)) diploma.appendChild(option);
        else if (KMTC_HIGHER_DIPLOMA.includes(c.id)) higherDiploma.appendChild(option);
        else general.appendChild(option);
      });
      paperCourse.replaceChildren(
        placeholder,
        ...(diploma.children.length ? [diploma] : []),
        ...(higherDiploma.children.length ? [higherDiploma] : []),
        ...(general.children.length ? [general] : []),
      );
    } else {
      paperCourse.replaceChildren(placeholder, ...courses.map(c => el("option", { value: c.id }, [c.name])));
    }
    paperCourse.value = selectedCourseId;
  };
  renderPaperUniversity();
  renderPaperCourses(me.course_id || "");
  paperUniversity.addEventListener("change", () => {
    if (paperUniversity.value === OTHER_UNIVERSITY) {
      paperUniversityId = "";
      otherUniversityName = paperUniversityOther.value;
    } else {
      paperUniversityId = paperUniversity.value;
      otherUniversityName = "";
    }
    renderPaperUniversity();
    renderPaperCourses("");
    if (paperUniversity.value === OTHER_UNIVERSITY) paperUniversityOther.focus();
  });
  paperUniversityOther.addEventListener("input", () => {
    otherUniversityName = paperUniversityOther.value.replace(/\s+/g, " ").trimStart().slice(0, 120);
  });
  const paperSubmit = el("button", { class: "btn btn-primary", type: "submit" }, ["Upload past paper"]);
  const adminPaperLink = role ? el("a", { class: "btn btn-ghost btn-sm", href: "admin.html#exams" }, ["Admin tools"]) : null;
  const paperUploadForm = el("form", { class: "card pad form-stack" }, [
    el("div", { class: "section-heading", style: "margin-bottom:4px;flex-wrap:wrap" }, [
      el("div", {}, [
        el("h2", { style: "font-size:17px;margin:0 0 4px" }, ["Share a past paper"]),
        el("p", { class: "muted", style: "font-size:13px;margin:0" }, ["Upload a PDF exam so other students can find it here."]),
      ]),
      adminPaperLink,
    ]),
    el("div", { class: "grid grid-fill-220" }, [
      el("div", { class: "field" }, [el("label", { for: "paper-upload-title" }, ["Paper title *"]), paperTitle]),
      el("div", { class: "field" }, [
        el("label", { for: "paper-upload-university" }, ["University / institution *"]),
        paperUniversity,
        paperUniversityOtherField,
      ]),
      el("div", { class: "field" }, [el("label", { for: "paper-upload-unit" }, ["Unit *"]), paperUnit]),
      el("div", { class: "field" }, [el("label", { for: "paper-upload-course" }, ["Course *"]), paperCourse]),
      el("div", { class: "field" }, [el("label", { for: "paper-upload-level" }, ["Year / level *"]), paperLevel]),
    ]),
    el("div", { class: "field" }, [el("label", { for: "paper-upload-file" }, ["PDF file · up to 20 MB"]), paperFile]),
    el("div", { class: "row-gap", style: "justify-content:flex-end" }, [paperSubmit]),
  ]);
  const renderPapers = () => {
    const rows = [
      ...papers.map(p => ({ ...p, uploaded: false })),
      ...uploadedPapers.map(p => ({ ...p, uploaded: true, url: api.fileUrl(p.file_path) })),
    ].sort((a, b) => +new Date(b.created_at || 0) - +new Date(a.created_at || 0));
    const heading = el("div", { class: "section-heading", style: "margin-bottom:12px" }, [
      el("h2", { style: "font-size:18px" }, ["Past papers"]),
      el("span", { class: "faint", style: "font-size:12.5px" }, [rows.length + (rows.length === 1 ? " paper" : " papers")]),
    ]);
    if (!rows.length) {
      paperList.replaceChildren(el("div", { class: "card pad" }, [
        heading,
        MedLink.emptyState("No past papers have been shared yet. Upload one from the panel to add it here."),
      ]));
      return;
    }
    paperList.replaceChildren(el("div", { class: "card pad" }, [
      heading,
      ...rows.map(p => {
        const details = p.uploaded
          ? [p.institution, p.course, p.unit, p.academic_level, p.author_id === me.id ? "Your upload" : "Student upload"].filter(Boolean).join(" · ")
          : [[p.unit, uniAbbr(p.university_id), p.year].filter(Boolean).join(" · ") || "Past paper"];
        return el("div", { class: "paper-row" }, [
          el("span", { class: "thumb", style: "background:" + subjectColor(p.unit || p.title) }, ["📄"]),
          el("div", { class: "who" }, [el("b", {}, [p.title]), el("span", {}, [details])]),
          el("a", { class: "btn btn-soft btn-sm", href: p.url, target: "_blank", rel: "noopener", onclick: () => MedLink.track("paper_open", { id: p.id, title: p.title }) }, ["Open ↗"]),
        ]);
      }),
    ]));
  };
  paperUploadForm.addEventListener("submit", async event => {
    event.preventDefault();
    const institutionName = paperUniversity.value === OTHER_UNIVERSITY
      ? paperUniversityOther.value.trim()
      : (UNIVERSITIES.find(u => u.id === paperUniversity.value) || {}).name || "";
    const selectedCourse = COURSES.find(c => c.id === paperCourse.value);
    if (!institutionName || !paperUnit.value.trim() || !selectedCourse || !paperLevel.value.trim()) {
      MedLink.toast("Choose the university and course, and enter the unit and relevant year or level.", "error");
      return;
    }
    const file = paperFile.files && paperFile.files[0];
    if (!file || (!/^application\/pdf$/i.test(file.type) && !/\.pdf$/i.test(file.name))) {
      MedLink.toast("Choose a PDF past paper to upload.", "error");
      return;
    }
    if (file.size > 20 * 1024 * 1024) {
      MedLink.toast("The PDF must be 20 MB or smaller.", "error");
      return;
    }
    paperSubmit.disabled = true;
    try {
      await api.uploadResource({
        title: paperTitle.value.trim(),
        institution: institutionName,
        unit: paperUnit.value.trim(),
        course: selectedCourse.name,
        academic_level: paperLevel.value.trim(),
        type: "Past Paper",
        description: "Shared from the Exam Bank.",
        file,
      });
      paperUploadForm.reset();
          MedLink.toast("Past paper uploaded.", "success");
      try {
        uploadedPapers = await api.resources({ type: "Past Paper", limit: 300 });
        renderPapers();
      } catch (refreshError) {
        MedLink.reportError(refreshError);
      }
    } catch (err) {
      MedLink.reportError(err);
    } finally {
      paperSubmit.disabled = false;
    }
  });
  papersBox.replaceChildren(el("div", { class: "exam-papers-layout" }, [
    el("section", { "aria-label": "Shared past papers" }, [paperList]),
    el("aside", { class: "exam-papers-upload", "aria-label": "Upload a past paper" }, [paperUploadForm]),
  ]));
  renderPapers();

  // ---------- find papers online ----------
  const online = qs("#tab-online");
  const query = el("input", { type: "search", class: "filter-select", style: "border-radius:999px;flex:1;min-width:220px", value: me.current_units[0] || "", placeholder: "Unit or topic, e.g. Human Anatomy I", "aria-label": "What to search for" });
  const unitChips = el("div", { class: "wrap-gap", style: "margin:10px 0 18px" }, me.current_units.map(u => el("button", { type: "button", class: "chip-toggle", onclick: () => { query.value = u; } }, [u])));
  const searchUrl = src => src.search_url.replace("{q}", encodeURIComponent((query.value.trim() || "medicine") + " past paper exam"));
  online.replaceChildren(
    el("div", { class: "card pad" }, [
      el("div", { class: "row-gap", style: "flex-wrap:wrap" }, [query]),
      me.current_units.length ? unitChips : null,
      el("div", {}, sources.map(src => el("div", { class: "paper-row" }, [
        el("span", { class: "thumb", style: "background:" + subjectColor(src.name) }, ["🏛️"]),
        el("div", { class: "who" }, [el("b", {}, [src.name]), el("span", {}, [src.home_url.replace(/^https?:\/\//, "")])]),
        src.search_url ? el("button", { type: "button", class: "btn btn-dark btn-sm", onclick: () => {
          MedLink.track("paper_search", { source: src.id, q: query.value.trim().slice(0, 80) });
          window.open(searchUrl(src), "_blank", "noopener");
        } }, ["Search"]) : null,
        el("a", { class: "btn btn-ghost btn-sm", href: src.home_url, target: "_blank", rel: "noopener" }, ["Visit"]),
      ]))),
      el("p", { class: "faint", style: "font-size:12.5px;line-height:1.5;margin:14px 0 0" }, [
        "These are university repositories and past-paper sites run by others — each university decides what's public, and some papers need your student login. Download a paper you can share? Upload the PDF in the Past papers tab.",
      ]),
    ]),
  );
});
</script>
</body>
</html>
