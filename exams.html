<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="icon" href="favicon.ico" sizes="any">
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="manifest" href="site.webmanifest">
<meta name="theme-color" content="#FFFFFF">
<title>Exam Bank — MedLink KE</title>
<script src="theme.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="styles.css">
</head>
<body>
<main id="page" hidden>
<div class="fade-in">
  <h1 class="disp" style="font-size:24px;margin:0 0 6px;">Exam Bank</h1>
  <p class="muted" style="font-size:14px;margin:0 0 22px;">Practice question sets with instant explanations. Looking for real past papers? They're shared in the
    <a href="study.html" class="handle">Study Library</a> under the "Past Paper" type.</p>
  <div class="grid grid-fill-260" id="examGrid"></div>
</div>
</main>

<script src="config.js"></script>
<script src="data.js"></script>
<script src="app.js"></script>
<script>
MedLink.run({ page: "exams" }, async () => {
  const grid = qs("#examGrid");
  EXAM_SETS.forEach(e => grid.appendChild(el("div", { class: "card pad" }, [
    el("span", { class: "chip" }, [e.unit]),
    el("div", { style: "font-weight:700;font-size:15px;margin:12px 0 6px;" }, [e.title]),
    el("div", { class: "faint", style: "font-size:12px;margin-bottom:16px;" }, [`${SAMPLE_QUIZ.length} practice questions · ${e.university}`]),
    el("div", { class: "row-gap" }, [
      el("a", { href: "practice.html?id=" + encodeURIComponent(e.id), class: "btn btn-primary btn-block", "data-track": "exam_open" }, ["Practice"]),
      el("a", { href: "study.html?unit=" + encodeURIComponent(e.unit), class: "btn btn-ghost btn-block" }, ["Related notes"]),
    ]),
  ])));
});
</script>
</body>
</html>
