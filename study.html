<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="icon" href="favicon.ico" sizes="any">
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="manifest" href="site.webmanifest">
<meta name="theme-color" content="#FFFFFF">
<title>Study Library — MedLink KE</title>
<script src="theme.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="styles.css">
</head>
<body>
<main id="page" hidden>
<div class="fade-in">
  <div class="row" style="justify-content:space-between;margin-bottom:6px;gap:10px;flex-wrap:wrap;">
    <h1 class="disp" style="font-size:24px;">Study Library</h1>
    <button class="btn btn-primary" id="uploadBtn" type="button">↑ Upload Resource</button>
  </div>
  <p class="muted" style="font-size:14px;margin:0 0 20px;" id="libSub"></p>
  <div class="row-gap" style="margin-bottom:20px;flex-wrap:wrap;">
    <select id="unitFilter" class="filter-select" aria-label="Filter by unit"></select>
    <select id="typeFilter" class="filter-select" aria-label="Filter by type"></select>
    <select id="sortFilter" class="filter-select" aria-label="Sort">
      <option value="created_at">Newest</option>
      <option value="views">Most viewed</option>
    </select>
    <span class="faint" style="font-size:12.5px;" id="resultCount"></span>
  </div>
  <div class="grid grid-fill-230" id="resourceGrid"></div>
</div>
</main>

<script src="config.js"></script>
<script src="data.js"></script>
<script src="app.js"></script>
<script>
MedLink.run({ page: "study" }, async ({ api, me }) => {
  const MAX_BYTES = 20 * 1024 * 1024;
  const ACCEPT = ".pdf,.doc,.docx,.ppt,.pptx,.png,.jpg,.jpeg,.webp,.txt";
  const yearUnits = unitsForYear(me.course_id, me.year);

  qs("#libSub").textContent = `${courseName(me.course_id)} · ${me.year} — notes, past papers and summaries shared by students.`;

  const unitFilter = qs("#unitFilter"), typeFilter = qs("#typeFilter"), sortFilter = qs("#sortFilter");
  unitFilter.appendChild(el("option", { value: "" }, ["All units"]));
  unitFilter.appendChild(el("option", { value: "__mine" }, ["My current units"]));
  const unitGroup = el("optgroup", { label: `${courseName(me.course_id)} · ${me.year}` },
    yearUnits.map(u => el("option", { value: u }, [u])));
  unitFilter.appendChild(unitGroup);
  typeFilter.appendChild(el("option", { value: "" }, ["All types"]));
  RESOURCE_TYPES.forEach(t => typeFilter.appendChild(el("option", { value: t }, [t])));

  const wanted = param("unit");
  if (wanted) {
    if (!yearUnits.includes(wanted)) unitFilter.appendChild(el("option", { value: wanted }, [wanted]));
    unitFilter.value = wanted;
  }

  const grid = qs("#resourceGrid");
  let seq = 0;
  async function render() {
    const mySeq = ++seq;
    grid.replaceChildren(MedLink.loadingState());
    const unit = unitFilter.value;
    const opts = { type: typeFilter.value || undefined, order: sortFilter.value, limit: 90 };
    if (unit === "__mine") opts.units = me.current_units.length ? me.current_units : ["__none__"];
    else if (unit) opts.unit = unit;
    try {
      const list = await api.resources(opts);
      if (mySeq !== seq) return;
      qs("#resultCount").textContent = `${list.length} resource${list.length === 1 ? "" : "s"}`;
      grid.replaceChildren(...(list.length ? list.map(MedLink.resourceCardNode)
        : [MedLink.emptyState("Nothing matches yet — upload the first one.")]));
    } catch (err) { grid.replaceChildren(); MedLink.reportError(err); }
  }
  [unitFilter, typeFilter, sortFilter].forEach(s => s.addEventListener("change", render));

  function openUpload() {
    const title = el("input", { type: "text", maxlength: "140", required: true, placeholder: "e.g. Brachial Plexus — High-Yield Summary" });
    const unit = el("select", { required: true }, [
      el("optgroup", { label: "Your current units" }, me.current_units.map(u => el("option", { value: u }, [u]))),
      el("optgroup", { label: `${courseName(me.course_id)} · ${me.year}` },
        yearUnits.filter(u => !me.current_units.includes(u)).map(u => el("option", { value: u }, [u]))),
    ]);
    if (unitFilter.value && unitFilter.value !== "__mine") unit.value = unitFilter.value;
    const type = el("select", { required: true }, RESOURCE_TYPES.map(t => el("option", { value: t }, [t])));
    const desc = el("textarea", { rows: "3", maxlength: "1000", placeholder: "What's covered? Which lecturer / year? (optional)" });
    const file = el("input", { type: "file", accept: ACCEPT, required: true });
    const hint = el("div", { class: "field-hint" }, ["PDF, Word, PowerPoint, images or text · up to 20 MB. Only share your own or open-access material."]);
    const submit = el("button", { class: "btn btn-primary btn-block", type: "submit" }, ["Upload"]);
    const field = (label, input, extra) => el("div", { class: "field" }, [el("label", {}, [label]), input, extra || null]);
    const form = el("form", { class: "upload-form" }, [
      field("Title *", title), field("Unit *", unit), field("Type *", type),
      field("Description", desc), field("File *", file, hint), submit,
    ]);
    const close = MedLink.modal("Upload a resource", form, { sticky: true });
    form.addEventListener("submit", async e => {
      e.preventDefault();
      const f = file.files[0];
      if (!f) return MedLink.toast("Choose a file to upload.", "error");
      if (f.size > MAX_BYTES) return MedLink.toast("That file is over 20 MB.", "error");
      if (title.value.trim().length < 3) return MedLink.toast("Give it a title (at least 3 characters).", "error");
      submit.disabled = true; submit.textContent = "Uploading…";
      try {
        const row = await api.uploadResource({ file: f, title: title.value.trim(), unit: unit.value, type: type.value, description: desc.value.trim() });
        close();
        MedLink.toast("Uploaded — thanks for sharing! +20 MedPoints", "success");
        MedLink.go("resource.html?id=" + encodeURIComponent(row.id));
      } catch (err) {
        submit.disabled = false; submit.textContent = "Upload";
        MedLink.reportError(err);
      }
    });
  }
  qs("#uploadBtn").addEventListener("click", openUpload);
  if (param("upload") === "1") openUpload();

  await render();
});
</script>
</body>
</html>
