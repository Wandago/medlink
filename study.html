<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="icon" href="favicon.ico" sizes="any">
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="manifest" href="site.webmanifest">
<meta name="theme-color" content="#FFFFFF">
<title>Study Library — MedLink KE</title>
<script src="theme.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="styles.css">

<style>
.study-filter-grid {
  display: grid;
  grid-template-columns: repeat(4, minmax(0, 1fr));
  gap: 12px;
  align-items: start;
}
.study-filter-grid .field { min-width: 0; margin: 0; }
.study-filter-grid .filter-select { width: 100%; min-width: 0; }
.study-filter-grid .field-hint { margin-top: 5px; }
.study-filter-grid .study-primary-filter { grid-row: 1; }
.study-filter-grid .study-secondary-filter { grid-row: 2; }
.study-unit-control { display: flex; align-items: center; gap: 6px; min-width: 0; }
.study-unit-control input { flex: 1 1 auto; min-width: 0; }
.study-unit-control .btn { flex: 0 0 auto; white-space: nowrap; }
.study-result-count { align-self: center; grid-row: 2; grid-column: 3 / -1; justify-self: end; }
.study-paper-fields { grid-template-columns: repeat(3, minmax(0, 1fr)); }
@media (max-width: 900px) {
  .study-filter-grid { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  .study-filter-grid .study-primary-filter,
  .study-filter-grid .study-secondary-filter { grid-row: auto; }
  .study-result-count { grid-row: auto; grid-column: 1 / -1; justify-self: start; }
  .study-paper-fields { grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); }
}
@media (max-width: 520px) {
  .study-filter-grid { grid-template-columns: minmax(0, 1fr); gap: 10px; }
  .study-unit-control { align-items: stretch; }
}
</style>

</head>
<body>
<main id="page" hidden>
<div class="fade-in">
  <div class="row" style="justify-content:space-between;margin-bottom:6px;gap:10px;flex-wrap:wrap;">
    <h1 class="disp" style="font-size:24px;">Study Library</h1>
    <button class="btn btn-primary" id="uploadBtn" type="button">↑ Upload Resource</button>
  </div>
  <p class="muted" style="font-size:14px;margin:0 0 20px;" id="libSub"></p>
  <div class="study-filter-grid" style="margin-bottom:20px;">
    <div class="field study-primary-filter">
      <label for="universityFilter">University / institution</label>
      <select id="universityFilter" class="filter-select" aria-label="Filter by university or institution"></select>
    </div>
    <div class="field study-primary-filter">
      <label for="courseFilter">Course</label>
      <input id="courseFilter" class="filter-select" type="search" list="courseOptions" autocomplete="off" placeholder="Type to find a course" aria-label="Search by course">
      <datalist id="courseOptions"></datalist>
    </div>
    <div class="field study-primary-filter">
      <label for="yearFilter">Year of study</label>
      <select id="yearFilter" class="filter-select" aria-label="Filter by year of study"></select>
    </div>
    <div class="field study-primary-filter">
      <label for="unitFilter">Unit</label>
      <div class="study-unit-control">
        <input id="unitFilter" class="filter-select" type="search" list="unitOptions" autocomplete="off" placeholder="Type a unit keyword" aria-label="Search units">
        <button id="mineUnitsBtn" class="btn btn-ghost btn-sm" type="button" aria-pressed="false">My units</button>
      </div>
      <datalist id="unitOptions"></datalist>
      <div class="field-hint">Type a keyword or choose a suggested unit.</div>
    </div>
    <div class="field study-secondary-filter">
      <label for="typeFilter">Type</label>
      <select id="typeFilter" class="filter-select" aria-label="Filter by resource type"></select>
    </div>
    <div class="field study-secondary-filter">
      <label for="sortFilter">Sort</label>
      <select id="sortFilter" class="filter-select" aria-label="Sort resources">
        <option value="created_at">Newest</option>
        <option value="views">Most viewed</option>
      </select>
    </div>
    <span class="faint study-result-count" style="font-size:12.5px;" id="resultCount"></span>
  </div>
  <div class="grid grid-fill-230" id="resourceGrid"></div>
</div>
</main>

<script src="config.js"></script>
<script src="data.js"></script>
<script src="app.js"></script>
<script>
MedLink.run({ page: "study" }, async ({ api, me }) => {
  const MAX_BYTES = 20 * 1024 * 1024;
  const ACCEPT = ".pdf,.doc,.docx,.ppt,.pptx,.png,.jpg,.jpeg,.webp,.txt";
  const yearUnits = unitsForYear(me.course_id, me.year);

  qs("#libSub").textContent = `${courseName(me.course_id)} · ${me.year} — notes, past papers and summaries shared by students.`;

  const universityFilter = qs("#universityFilter"), courseFilter = qs("#courseFilter");
  const yearFilter = qs("#yearFilter"), unitFilter = qs("#unitFilter");
  const typeFilter = qs("#typeFilter"), sortFilter = qs("#sortFilter");
  const mineUnitsBtn = qs("#mineUnitsBtn");
  const courseOptions = qs("#courseOptions"), unitOptions = qs("#unitOptions");
  const maxCourseYears = Math.max(...COURSES.map(c => Number(c.years) || 0), 6);

  universityFilter.appendChild(el("option", { value: "" }, ["All universities / institutions"]));
  UNIVERSITIES.forEach(u => universityFilter.appendChild(el("option", { value: u.id }, [u.name])));
  if (me.university_name && !UNIVERSITIES.some(u => u.id === me.university_id)) {
    universityFilter.appendChild(el("option", { value: "name:" + me.university_name }, [me.university_name]));
  }
  courseFilter.setAttribute("placeholder", "Type to find a course");
  COURSES.forEach(c => courseOptions.appendChild(el("option", { value: c.name })));
  yearFilter.appendChild(el("option", { value: "" }, ["All years"]));
  for (let year = 1; year <= maxCourseYears; year++) {
    yearFilter.appendChild(el("option", { value: String(year) }, ["Year " + year]));
  }
  typeFilter.appendChild(el("option", { value: "" }, ["All types"]));
  RESOURCE_TYPES.forEach(t => typeFilter.appendChild(el("option", { value: t }, [t])));
  function addDatalistValue(list, value, seen) {
    const label = String(value || "").trim();
    const key = label.toLocaleLowerCase();
    if (!label || seen.has(key)) return;
    seen.add(key);
    list.appendChild(el("option", { value: label }));
  }
  const courseValueSet = new Set(COURSES.map(c => c.name.toLocaleLowerCase()));
  const unitValueSet = new Set();
  yearUnits.concat(me.current_units || []).forEach(u => addDatalistValue(unitOptions, u, unitValueSet));

  const wanted = param("unit");
  if (wanted === "__mine") {
    mineUnitsBtn.classList.add("active");
    mineUnitsBtn.setAttribute("aria-pressed", "true");
  } else if (wanted) unitFilter.value = wanted;

  const grid = qs("#resourceGrid");
  let seq = 0;
  let resourcesCache = [];
  let loaded = false;

  function populateSuggestions(list) {
    list.forEach(resource => {
      const author = resource.author || {};
      const institution = String(resource.institution || "").trim();
      const authorInstitution = String(author.university_name || "").trim();
      [institution, authorInstitution].forEach(name => {
        if (!name || UNIVERSITIES.some(u => u.name.toLocaleLowerCase() === name.toLocaleLowerCase())) return;
        const value = "name:" + name;
        if (!Array.from(universityFilter.options).some(option => option.value === value)) {
          universityFilter.appendChild(el("option", { value }, [name]));
        }
      });
      const course = String(resource.course || "").trim();
      addDatalistValue(courseOptions, course, courseValueSet);
      const authorCourse = courseName(author.course_id);
      addDatalistValue(courseOptions, authorCourse, courseValueSet);
      addDatalistValue(unitOptions, resource.unit, unitValueSet);
    });
  }

  function filteredResources(list) {
    const selectedUniversity = universityFilter.value;
    const selectedCourse = courseFilter.value.trim().toLocaleLowerCase();
    const selectedYear = yearFilter.value;
    const unitKeyword = unitFilter.value.trim().toLocaleLowerCase();
    const onlyMyUnits = mineUnitsBtn.getAttribute("aria-pressed") === "true";
    return list.filter(resource => {
      const author = resource.author || {};
      if (selectedUniversity) {
        const university = UNIVERSITIES.find(u => u.id === selectedUniversity);
        const target = selectedUniversity.startsWith("name:")
          ? selectedUniversity.slice(5).toLocaleLowerCase()
          : university ? university.name.toLocaleLowerCase() : "";
        const resourceInstitution = String(resource.institution || "").toLocaleLowerCase();
        const authorInstitution = String(author.university_name || "").toLocaleLowerCase();
        const sameId = university && author.university_id === university.id;
        const nameMatch = target && [resourceInstitution, authorInstitution].some(value => value.includes(target));
        if (!sameId && !nameMatch) return false;
      }
      if (selectedCourse) {
        const authorCourse = courseName(author.course_id).toLocaleLowerCase();
        const resourceCourse = String(resource.course || "").toLocaleLowerCase();
        if (!authorCourse.includes(selectedCourse) && !resourceCourse.includes(selectedCourse)) return false;
      }
      if (selectedYear) {
        const n = Number(selectedYear);
        const authorYear = Number(String(author.year || "").match(/\d+/)?.[0]);
        const level = String(resource.academic_level || "").toLocaleLowerCase();
        const levelMatch = level === String(n) || new RegExp("(?:year|yr|level)\\s*" + n + "\\b").test(level);
        if (authorYear !== n && !levelMatch) return false;
      }
      if (onlyMyUnits && !(me.current_units || []).includes(resource.unit)) return false;
      if (unitKeyword && !String(resource.unit || "").toLocaleLowerCase().includes(unitKeyword)) return false;
      if (typeFilter.value && resource.type !== typeFilter.value) return false;
      return true;
    });
  }

  async function render(refresh) {
    const mySeq = ++seq;
    if (!loaded || refresh) {
      grid.replaceChildren(MedLink.loadingState());
      try {
        resourcesCache = await api.resources({ order: sortFilter.value, limit: 1000 });
        if (mySeq !== seq) return;
        loaded = true;
        populateSuggestions(resourcesCache);
      } catch (err) {
        grid.replaceChildren();
        MedLink.reportError(err);
        return;
      }
    }
    if (mySeq !== seq) return;
    const list = filteredResources(resourcesCache);
    qs("#resultCount").textContent = `${list.length} resource${list.length === 1 ? "" : "s"}`;
    grid.replaceChildren(...(list.length ? list.map(MedLink.resourceCardNode)
      : [MedLink.emptyState("Nothing matches — adjust your criteria or upload the first resource.")]));
  }
  [universityFilter, yearFilter, typeFilter].forEach(control => control.addEventListener("change", () => render(control === typeFilter)));
  [courseFilter, unitFilter].forEach(control => control.addEventListener("input", () => {
    if (control === unitFilter && unitFilter.value) {
      mineUnitsBtn.classList.remove("active");
      mineUnitsBtn.setAttribute("aria-pressed", "false");
    }
    render(false);
  }));
  mineUnitsBtn.addEventListener("click", () => {
    const on = mineUnitsBtn.getAttribute("aria-pressed") !== "true";
    mineUnitsBtn.setAttribute("aria-pressed", String(on));
    mineUnitsBtn.classList.toggle("active", on);
    if (on) unitFilter.value = "";
    render(false);
  });
  sortFilter.addEventListener("change", () => render(true));

  function openUpload() {
    const title = el("input", { type: "text", maxlength: "140", required: true, placeholder: "e.g. Brachial Plexus — High-Yield Summary" });
    const unit = el("select", { required: true }, [
      el("optgroup", { label: "Your current units" }, me.current_units.map(u => el("option", { value: u }, [u]))),
      el("optgroup", { label: `${courseName(me.course_id)} · ${me.year}` },
        yearUnits.filter(u => !me.current_units.includes(u)).map(u => el("option", { value: u }, [u]))),
    ]);
    if (unitFilter.value && unitFilter.value !== "__mine") unit.value = unitFilter.value;
    const type = el("select", { required: true }, RESOURCE_TYPES.map(t => el("option", { value: t }, [t])));
    const field = (label, input, extra) => el("div", { class: "field" }, [el("label", {}, [label]), input, extra || null]);
    const institutionOptions = [
      el("option", { value: "", disabled: true, selected: true }, ["Select university / institution…"]),
      ...UNIVERSITIES.map(u => el("option", { value: u.id }, [u.name])),
    ];
    const profileInstitutionIsListed = UNIVERSITIES.some(u => u.id === me.university_id);
    const customInstitutionNames = new Set();
    (resourcesCache || []).forEach(resource => {
      const name = String(resource.institution || "").trim();
      if (name && !UNIVERSITIES.some(u => u.name.toLocaleLowerCase() === name.toLocaleLowerCase())) customInstitutionNames.add(name);
    });
    if (me.university_name && !profileInstitutionIsListed) {
      institutionOptions.push(el("option", { value: "__profile" }, [me.university_name]));
      customInstitutionNames.delete(me.university_name);
    }
    customInstitutionNames.forEach(name => institutionOptions.push(el("option", { value: "name:" + name }, [name])));
    const institution = el("select", { required: true }, institutionOptions);
    if (profileInstitutionIsListed) institution.value = me.university_id;
    else if (me.university_name) institution.value = "__profile";

    const course = el("select", { required: true, disabled: true }, [
      el("option", { value: "", disabled: true, selected: true }, ["Select a course…"]),
    ]);
    const academicLevel = el("select", { required: true, disabled: true }, [
      el("option", { value: "", disabled: true, selected: true }, ["Select year of study…"]),
    ]);
    const paperDetails = el("div", { class: "grid study-paper-fields", hidden: true }, [
      field("University / institution *", institution),
      field("Course *", course),
      field("Year of study *", academicLevel),
    ]);

    function coursesForInstitution(universityId) {
      if (!universityId || universityId === "__profile") return COURSES;
      const available = COURSES.filter(c => {
        const offered = universityOffersCourse(universityId, c.id);
        if (universityId === "kmtc") return offered || COURSE_CATEGORIES.KMTC.includes(c.id);
        return offered;
      });
      return available.length ? available : COURSES;
    }
    function renderUploadCourses() {
      const options = coursesForInstitution(institution.value).map(c => el("option", { value: c.id }, [c.name]));
      course.replaceChildren(el("option", { value: "", disabled: true }, ["Select a course…"]), ...options);
      course.value = "";
      course.disabled = !institution.value;
      renderUploadYears();
    }
    function renderUploadYears() {
      const options = course.value
        ? yearsForCourse(course.value).map(y => el("option", { value: y }, [y]))
        : [];
      academicLevel.replaceChildren(el("option", { value: "", disabled: true }, ["Select year of study…"]), ...options);
      academicLevel.value = "";
      academicLevel.disabled = !course.value;
    }
    institution.addEventListener("change", renderUploadCourses);
    course.addEventListener("change", renderUploadYears);
    if (institution.value) renderUploadCourses();

    const syncPaperFields = () => {
      const isPastPaper = type.value === "Past Paper";
      paperDetails.hidden = !isPastPaper;
      institution.required = isPastPaper;
      course.required = isPastPaper;
      academicLevel.required = isPastPaper;
      institution.disabled = !isPastPaper;
      course.disabled = !isPastPaper || !institution.value;
      academicLevel.disabled = !isPastPaper || !course.value;
    };
    type.addEventListener("change", syncPaperFields);
    const desc = el("textarea", { rows: "3", maxlength: "1000", placeholder: "What's covered? (optional)" });
    const file = el("input", { type: "file", accept: ACCEPT, required: true });
    const hint = el("div", { class: "field-hint" }, ["PDF, Word, PowerPoint, images or text · up to 20 MB. Only share your own or open-access material."]);
    const submit = el("button", { class: "btn btn-primary btn-block", type: "submit" }, ["Upload"]);
    const form = el("form", { class: "upload-form" }, [
      field("Title *", title), field("Unit *", unit), field("Type *", type),
      paperDetails, field("Description", desc), field("File *", file, hint), submit,
    ]);
    syncPaperFields();
    const close = MedLink.modal("Upload a resource", form, { sticky: true });
    form.addEventListener("submit", async e => {
      e.preventDefault();
      const f = file.files[0];
      if (!f) return MedLink.toast("Choose a file to upload.", "error");
      if (f.size > MAX_BYTES) return MedLink.toast("That file is over 20 MB.", "error");
      if (title.value.trim().length < 3) return MedLink.toast("Give it a title (at least 3 characters).", "error");
      if (type.value === "Past Paper" && (!institution.value || !course.value || !academicLevel.value)) {
        return MedLink.toast("Choose the university or institution, course, and year of study.", "error");
      }
      submit.disabled = true; submit.textContent = "Uploading…";
      try {
        const row = await api.uploadResource({
          file: f, title: title.value.trim(), unit: unit.value, type: type.value, description: desc.value.trim(),
          institution: type.value === "Past Paper" ? institution.selectedOptions[0].textContent.trim() : "",
          course: type.value === "Past Paper" ? course.selectedOptions[0].textContent.trim() : "",
          academic_level: type.value === "Past Paper" ? academicLevel.value : "",
        });
        close();
        MedLink.toast("Uploaded — thanks for sharing! +20 MedPoints", "success");
        MedLink.go("resource.html?id=" + encodeURIComponent(row.id));
      } catch (err) {
        submit.disabled = false; submit.textContent = "Upload";
        MedLink.reportError(err);
      }
    });
  }
  qs("#uploadBtn").addEventListener("click", openUpload);
  if (param("upload") === "1") openUpload();

  await render();
});
</script>
</body>
</html>
