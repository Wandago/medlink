<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#FFFFFF">
<title>Discover — MedLink KE</title>
<script src="theme.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="styles.css">
</head>
<body>
<main id="page" hidden>
<div class="fade-in">
  <h1 class="disp" style="font-size:24px;margin:0 0 20px;">Discover</h1>
  <div class="section-heading"><div><div class="eyebrow">Most viewed</div><h2>Trending Resources</h2></div></div>
  <div class="grid grid-fill-230" style="margin-bottom:30px;" id="trending"></div>
  <div class="section-heading"><div><div class="eyebrow">Same university, course or year first</div><h2>Students You May Want to Follow</h2></div></div>
  <div class="grid grid-fill-290" style="margin-bottom:30px;" id="students"></div>
  <div class="section-heading"><h2>Communities</h2></div>
  <div class="wrap-gap" id="commChips"></div>
</div>
</main>

<script src="config.js"></script>
<script src="data.js"></script>
<script src="app.js"></script>
<script>
MedLink.run({ page: "discover" }, async ({ api, me }) => {
  const t = qs("#trending"), s = qs("#students"), c = qs("#commChips");
  [t, s].forEach(n => n.appendChild(MedLink.loadingState()));
  const [trending, people, communities] = await Promise.all([
    api.resources({ order: "views", limit: 8 }),
    api.suggestedProfiles(8, me),
    api.communities(),
  ]);
  t.replaceChildren(...(trending.length ? trending.map(MedLink.resourceCardNode) : [MedLink.emptyState("No resources yet.")]));
  const following = new Set();
  s.replaceChildren(...(people.length ? people.map(p => MedLink.studentRowNode(p, { following }))
    : [MedLink.emptyState("You're following everyone so far — invite your classmates!")]));
  c.replaceChildren(...communities.map(x => el("a", {
    href: "communities.html?c=" + encodeURIComponent(x.id), class: "chip", style: "font-size:13px;padding:8px 14px;",
  }, [`${x.name} · ${count(x.community_members).toLocaleString()}`])));
});
</script>
</body>
</html>
